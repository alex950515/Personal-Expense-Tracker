                ledger_id: ledgerRef.id,
                type: cat.type,
                major: cat.major,
                sub,
                is_archived: false,
              });
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            batch.set(db.collection('payment_methods').doc(), {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
          setNewCoupleLedgerName('');
          setActiveLedgerId(ledgerRef.id);
          showToast('已建立情侶共同帳本');
        } catch (err) {
          showToast('建立共同帳本失敗：' + err.message);
        }
      }

      async function sendInvitation() {
        if (!inviteEmail.trim()) {
          showToast('請輸入邀請對象的 Google Email');
          return;
        }
        if (!isOwner || activeLedger?.type !== 'couple') return;
        if ((activeLedger.memberIds || []).length >= 5) {
          showToast('共同帳本最多只能有 5 位成員（含擁有者）');
          return;
        }
        try {
          await firebase.firestore().collection('ledger_invitations').add({
            ledger_id: activeLedger.id,
            ledger_name: activeLedger.name,
            inviter_id: user.uid,
            inviter_nickname: profile?.nickname || user.email,
            invitee_email: inviteEmail.trim().toLowerCase(),
            status: 'pending',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setInviteEmail('');
          showToast('已發送邀請！對方登入後即可接受加入');
        } catch (err) {
          showToast('發送邀請失敗：' + err.message);
        }
      }

      async function acceptInvitation(inv) {
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc(inv.ledger_id);
          const snap = await ledgerRef.get();
          if (!snap.exists) {
            showToast('找不到該共同帳本（可能已被刪除）');
            return;
          }
          const data = snap.data();
          if ((data.memberIds || []).length >= 5) {
            showToast('此共同帳本成員已滿 5 人上限');
            return;
          }
          const myNick = profile?.nickname || user.email.split('@')[0];
          await ledgerRef.update({
            memberIds: firebase.firestore.FieldValue.arrayUnion(user.uid),
            [`members.${user.uid}`]: { role: 'member', email: user.email, nickname: myNick },
          });
          await db.collection('ledger_invitations').doc(inv.id).update({ status: 'accepted' });
          setActiveLedgerId(inv.ledger_id);
          showToast(`已成功加入「${inv.ledger_name}」`);
        } catch (err) {
          showToast('加入帳本失敗：' + err.message);
        }
      }

      async function removeMember(targetUid) {
        if (!isOwner || targetUid === user.uid) return;
        const ok = await askConfirm({
          title: '移除共同帳本成員',
          message: '確定要移除此成員嗎？移除後對方將立即失去存取權限，但歷史交易紀錄會完整保留。',
          danger: true,
          confirmText: '確認移除',
        });
        if (!ok) return;
        try {
          const updatedMembers = { ...(activeLedger.members || {}) };
          delete updatedMembers[targetUid];
          await firebase.firestore().collection('ledgers').doc(activeLedger.id).update({
            memberIds: firebase.firestore.FieldValue.arrayRemove(targetUid),
            members: updatedMembers,
          });
          showToast('已移除該成員');
        } catch (err) {
          showToast('移除成員失敗：' + err.message);
        }
      }

      async function changeCurrency(newCode) {
        if (!isOwner) return;
        const ok = await askConfirm({
          title: '變更帳本幣別',
          message: `確定將幣別改為 ${newCode} 嗎？\n提醒：原有交易金額不會自動進行匯率換算。`,
          confirmText: '確認變更',
        });
        if (!ok) return;
        try {
          await firebase.firestore().collection('ledgers').doc(activeLedger.id).update({ currency: newCode });
          showToast(`幣別已變更為 ${newCode}`);
        } catch (err) {
          showToast('變更幣別失敗：' + err.message);
        }
      }

      async function toggleArchiveLedger(ledger, archiveState) {
        try {
          await firebase.firestore().collection('ledgers').doc(ledger.id).update({ is_archived: archiveState });
          showToast(archiveState ? '已封存帳本' : '已解除封存');
        } catch (err) {
          showToast('操作失敗：' + err.message);
        }
      }

      async function permanentlyDeleteLedger(ledger) {
        if (ledger.owner_id !== user.uid) return;
        const ok1 = await askConfirm({
          title: `永久刪除「${ledger.name}」`,
          message: '【警告】所有交易、分類與預算將一併刪除且無法復原！確定要繼續嗎？',
          danger: true,
          confirmText: '繼續刪除',
        });
        if (!ok1) return;
        const ok2 = await askConfirm({
          title: '最後確認：不可逆操作',
          message: `請再次確認：真的要永久刪除「${ledger.name}」？`,
          danger: true,
          confirmText: '確認永久刪除',
        });
        if (!ok2) return;

        try {
          const db = firebase.firestore();
          const collections = ['transactions', 'categories', 'payment_methods', 'budgets'];
          for (const col of collections) {
            const snap = await db.collection(col).where('ledger_id', '==', ledger.id).get();
            const batch = db.batch();
            snap.docs.forEach((d) => batch.delete(d.ref));
            await batch.commit();
          }
          await db.collection('ledgers').doc(ledger.id).delete();
          showToast(`已永久刪除「${ledger.name}」`);
        } catch (err) {
          showToast('永久刪除失敗：' + err.message);
        }
      }

      function handleExport(format) {
        if (!activeLedger) {
          showToast('請先選擇要匯出的帳本');
          return;
        }
        if (typeof XLSX === 'undefined') {
          showToast('匯出元件尚未載入完成，請稍後再試');
          return;
        }
        const filtered = transactions.filter((t) => {
          if (exportStart && t.date < exportStart) return false;
          if (exportEnd && t.date > exportEnd) return false;
          return true;
        });

        if (filtered.length === 0) {
          showToast('此日期區間沒有可匯出的資料');
          return;
        }

        const rows = filtered.map((t) => {
          const base = {
            '日期': t.date,
            '收支類型': t.type === 'income' ? '收入' : '支出',
            '大分類': t.major_category,
            '子分類': t.sub_category,
            '項目名稱': t.item_name || '',
            '金額': Number(t.amount) || 0,
            '備註': t.note || '',
            '付款方式': t.payment_method,
          };
          if (activeLedger?.type === 'couple') {
            base['付款人'] = t.payer_nickname || '';
          }
          return base;
        });

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '收支明細');
        const filename = `${activeLedger.name}_匯出_${getTodayStr()}.${format}`;
        XLSX.writeFile(wb, filename, { bookType: format });
        showToast(`已匯出 ${filename}`);
      }

      async function handleBackupDownload() {
        if (!activeLedger) {
          showToast('請先選擇要備份的帳本');
          return;
        }
        try {
          const db = firebase.firestore();
          const budgetsSnap = await db.collection('budgets').where('ledger_id', '==', activeLedger.id).get();
          const backupObj = {
            version: '1.0',
            exported_at: new Date().toISOString(),
            ledger_name: activeLedger.name,
            ledger_type: activeLedger.type,
            currency: activeLedger.currency,
            categories: categories.map(({ id, ledger_id, ...rest }) => rest),
            payment_methods: paymentMethods.map(({ id, ledger_id, ...rest }) => rest),
            transactions: transactions.map(({ id, ledger_id, ...rest }) => rest),
            budgets: budgetsSnap.docs.map((d) => {
              const { ledger_id, ...rest } = d.data();
              return rest;
            }),
          };
          const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${activeLedger.name}_完整備份_${getTodayStr()}.json`;
          a.click();
          showToast('已下載完整備份檔案');
        } catch (err) {
          showToast('下載備份失敗：' + err.message);
        }
      }

      function handleBackupFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data.transactions) || !Array.isArray(data.categories)) {
              showToast('備份檔案格式不正確');
              return;
            }
            setRestorePreview(data);
          } catch (err) {
            showToast('無法解析備份檔案：' + err.message);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      }

      async function executeRestore() {
        if (!restorePreview || !activeLedger) return;
        const ok = await askConfirm({
          title: '確認覆蓋並還原',
          message: `確定要還原備份至「${activeLedger.name}」嗎？此動作將會覆蓋目前帳本內的現有交易、分類與付款方式。`,
          danger: true,
          confirmText: '確認還原',
        });
        if (!ok) return;

        const db = firebase.firestore();
        const targetId = activeLedger.id;

        for (const col of ['transactions', 'categories', 'payment_methods', 'budgets']) {
          const snap = await db.collection(col).where('ledger_id', '==', targetId).get();
          const delBatch = db.batch();
          snap.docs.forEach((d) => delBatch.delete(d.ref));
          await delBatch.commit();
        }

        const addBatch = db.batch();
        (restorePreview.categories || []).forEach((c) => {
          addBatch.set(db.collection('categories').doc(), { ...c, ledger_id: targetId });
        });
        (restorePreview.payment_methods || []).forEach((p) => {
          addBatch.set(db.collection('payment_methods').doc(), { ...p, ledger_id: targetId });
        });
        (restorePreview.transactions || []).forEach((t) => {
          addBatch.set(db.collection('transactions').doc(), { ...t, ledger_id: targetId });
        });
        (restorePreview.budgets || []).forEach((b) => {
          addBatch.set(db.collection('budgets').doc(`${targetId}_${b.month}`), { ...b, ledger_id: targetId });
        });
        await addBatch.commit();

        setRestorePreview(null);
        showToast('備份還原完成！');
      }

      return (
        <div className="space-y-6 text-sm">
          {invitations.length > 0 && (
            <div className="p-5 rounded-2xl bg-amber-50 dark:bg-amber-900/30 border border-amber-300 dark:border-amber-700 space-y-3">
              <h3 className="font-bold text-base">收到共同帳本邀請</h3>
              {invitations.map((inv) => (
                <div key={inv.id} className="flex items-center justify-between gap-2">
                  <span><strong>{inv.inviter_nickname}</strong> 邀請您加入「<strong>{inv.ledger_name}</strong>」</span>
                  <button onClick={() => acceptInvitation(inv)} className="px-4 py-1.5 rounded-xl bg-latte-600 text-white font-semibold">接受加入</button>
                </div>
              ))}
            </div>
          )}

          {/* 個人暱稱與介面主題 */}
          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">個人設定與外觀</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={nicknameInput}
                onChange={(e) => setNicknameInput(e.target.value)}
                placeholder="設定顯示暱稱"
                className="flex-1 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
              />
              <button onClick={saveNickname} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">更新暱稱</button>
            </div>
            <div className="flex items-center justify-between pt-2">
              <span>顯示主題模式</span>
              <div className="flex gap-2">
                {[['light', '淺色'], ['dark', '深色'], ['system', '跟隨系統']].map(([val, lbl]) => (
                  <button
                    key={val}
                    onClick={() => setTheme(val)}
                    className={`px-3 py-1.5 rounded-xl border ${theme === val ? 'bg-latte-600 text-white border-latte-600' : 'border-latte-300 dark:border-neutral-600'}`}
                  >
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* 帳本管理與情侶共同帳本 */}
          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">帳本管理與情侶共同帳本</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={newCoupleLedgerName}
                onChange={(e) => setNewCoupleLedgerName(e.target.value)}
                placeholder="輸入新的情侶共同帳本名稱..."
                className="flex-1 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
              />
              <button onClick={createCoupleLedger} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">建立共同帳本</button>
            </div>

            {activeLedger && (
              <div className="p-4 rounded-xl bg-latte-50 dark:bg-neutral-700/50 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="font-bold">目前帳本：{activeLedger.name}</span>
                  <div className="flex items-center gap-2">
                    <span>幣別：</span>
                    <select
                      disabled={!isOwner}
                      value={activeLedger.currency}
                      onChange={(e) => changeCurrency(e.target.value)}
                      className="p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600"
                    >
                      {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.name}</option>)}
                    </select>
                  </div>
                </div>

                {activeLedger.type === 'couple' && (
                  <div className="space-y-2 border-t border-latte-200 dark:border-neutral-600 pt-3">
                    <div className="font-semibold">成員列表（{(activeLedger.memberIds || []).length} / 5 人）</div>
                    {Object.entries(activeLedger.members || {}).map(([mUid, mInfo]) => (
                      <div key={mUid} className="flex items-center justify-between">
                        <span>{mInfo.nickname} ({mInfo.email}) {mInfo.role === 'owner' ? '👑 擁有者' : ''}</span>
                        {isOwner && mUid !== user.uid && (
                          <button onClick={() => removeMember(mUid)} className="text-xs text-rose-600 hover:underline">移除成員</button>
                        )}
                      </div>
                    ))}
                    {isOwner && (
                      <div className="flex gap-2 pt-2">
                        <input
                          type="email"
                          value={inviteEmail}
                          onChange={(e) => setInviteEmail(e.target.value)}
                          placeholder="輸入伴侶的 Google Email 發送邀請..."
                          className="flex-1 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
                        />
                        <button onClick={sendInvitation} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">邀請</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            <div className="space-y-2 pt-2">
              <div className="font-semibold text-xs text-latte-500">所有帳本（修改名稱 / 封存 / 還原 / 永久刪除）</div>
              {ledgers.map((l) => (
                <div key={l.id} className="flex items-center justify-between p-3 rounded-xl border border-latte-200 dark:border-neutral-700">
                  <span>{l.name} {l.is_archived ? '（已封存）' : ''}</span>
                  {l.owner_id === user.uid && (
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => updateLedgerName(l)}
                        className="px-3 py-1 rounded-lg bg-latte-200 dark:bg-neutral-700 text-xs"
                      >
                        改名
                      </button>
                      <button
                        type="button"
                        onClick={() => toggleArchiveLedger(l, !l.is_archived)}
                        className="px-3 py-1 rounded-lg bg-latte-200 dark:bg-neutral-700 text-xs"
                      >
                        {l.is_archived ? '解除封存' : '封存'}
                      </button>
                      <button
                        type="button"
                        onClick={() => permanentlyDeleteLedger(l)}
                        className="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs"
                      >
                        永久刪除
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* 自訂收支分類管理 */}
          {activeLedger && (
          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">自訂收支分類（目前帳本）</h3>
            <div className="flex flex-wrap gap-2">
              <select value={catType} onChange={(e) => setCatType(e.target.value)} className="p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600">
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
              <input type="text" placeholder="大分類名稱" value={catMajor} onChange={(e) => setCatMajor(e.target.value)} className="p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600" />
              <input type="text" placeholder="子分類名稱" value={catSub} onChange={(e) => setCatSub(e.target.value)} className="p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600" />
              <button
                type="button"
                onClick={async () => {
                  if (!catMajor.trim() || !catSub.trim()) {
                    showToast('請輸入大分類與子分類名稱');
                    return;
                  }
                  try {
                    await firebase.firestore().collection('categories').add({
                      ledger_id: activeLedger.id,
                      type: catType,
                      major: catMajor.trim(),
                      sub: catSub.trim(),
                      is_archived: false,
                    });
                    setCatSub('');
                    showToast('已新增分類');
                  } catch (err) {
                    showToast('新增分類失敗：' + err.message);
                  }
                }}
                className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold"
              >
                新增分類
              </button>
            </div>
            <div className="flex flex-wrap gap-2">
              {categories.filter((c) => !c.is_archived).map((c) => (
                <span key={c.id} className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-latte-100 dark:bg-neutral-700 text-xs">
                  {c.type === 'expense' ? '支' : '收'}｜{c.major}/{c.sub}
                  <button
                    type="button"
                    onClick={async () => {
                      try {
                        await firebase.firestore().collection('categories').doc(c.id).update({ is_archived: true });
                        showToast('已封存該分類（歷史紀錄完整保留）');
                      } catch (err) {
                        showToast('封存分類失敗：' + err.message);
                      }
                    }}
                    className="text-rose-600 font-bold ml-1"
                    title="封存分類（不影響舊交易）"
                  >
                    ×
                  </button>
                </span>
              ))}
            </div>
          </div>
          )}

          {/* 付款方式管理 */}
          {activeLedger && (
          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">付款方式管理</h3>
            <div className="flex gap-2">
              <input type="text" placeholder="新增付款方式（如：Line Pay、悠遊卡）" value={newPmName} onChange={(e) => setNewPmName(e.target.value)} className="flex-1 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600" />
              <button
                type="button"
                onClick={async () => {
                  if (!newPmName.trim()) {
                    showToast('請輸入付款方式名稱');
                    return;
                  }
                  try {
                    await firebase.firestore().collection('payment_methods').add({
                      ledger_id: activeLedger.id,
                      name: newPmName.trim(),
                      is_active: true,
                    });
                    setNewPmName('');
                    showToast('已新增付款方式');
                  } catch (err) {
                    showToast('新增付款方式失敗：' + err.message);
                  }
                }}
                className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold"
              >
                新增
              </button>
            </div>
            <div className="space-y-2">
              {paymentMethods.map((pm) => (
                <div key={pm.id} className="flex items-center justify-between p-2.5 rounded-xl bg-latte-50 dark:bg-neutral-700/50">
                  <span className={!pm.is_active ? 'line-through text-neutral-400' : ''}>{pm.name}</span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={async () => {
                        const edited = await askPrompt({
                          title: '修改付款方式名稱',
                          defaultValue: pm.name,
                        });
                        if (edited && edited.trim()) {
                          try {
                            await firebase.firestore().collection('payment_methods').doc(pm.id).update({ name: edited.trim() });
                            showToast('已更新付款方式名稱');
                          } catch (err) {
                            showToast('更新失敗：' + err.message);
                          }
                        }
                      }}
                      className="text-xs text-latte-600 hover:underline"
                    >
                      編輯
                    </button>
                    <button
                      type="button"
                      onClick={async () => {
                        try {
                          await firebase.firestore().collection('payment_methods').doc(pm.id).update({ is_active: !pm.is_active });
                          showToast(pm.is_active ? '已停用該付款方式' : '已重新啟用');
                        } catch (err) {
                          showToast('狀態切換失敗：' + err.message);
                        }
                      }}
                      className="text-xs text-amber-700 hover:underline"
                    >
                      {pm.is_active ? '停用' : '啟用'}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          )}

          {/* 匯出 Excel/CSV 與 備份還原 */}
          {activeLedger && (
          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">資料匯出、備份與還原</h3>
            <div className="flex flex-wrap items-center gap-2">
              <span>匯出區間（留空為全部）：</span>
              <input type="date" value={exportStart} onChange={(e) => setExportStart(e.target.value)} className="p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600" />
              <span>至</span>
              <input type="date" value={exportEnd} onChange={(e) => setExportEnd(e.target.value)} className="p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600" />
              <button onClick={() => handleExport('xlsx')} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold">匯出 Excel (.xlsx)</button>
              <button onClick={() => handleExport('csv')} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">匯出 CSV (.csv)</button>
            </div>

            <div className="border-t border-latte-100 dark:border-neutral-700 pt-4 space-y-3">
              <div className="flex flex-wrap items-center gap-3">
                <button onClick={handleBackupDownload} className="px-4 py-2 rounded-xl bg-latte-700 text-white font-semibold">下載完整帳本備份 (.json)</button>
                <label className="px-4 py-2 rounded-xl border border-latte-400 cursor-pointer font-semibold">
                  上傳備份檔案還原
                  <input type="file" accept=".json" onChange={handleBackupFileSelect} className="hidden" />
                </label>
              </div>

              {restorePreview && (
                <div className="p-4 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-300 space-y-2">
                  <div className="font-bold">備份檔案預覽（來源帳本：{restorePreview.ledger_name}）</div>
                  <div>包含交易紀錄：{restorePreview.transactions.length} 筆｜分類設定：{restorePreview.categories.length} 項｜付款方式：{restorePreview.payment_methods.length} 項</div>
                  <div className="text-rose-600 font-medium">注意：執行還原將會覆蓋目前「{activeLedger.name}」內現有的所有資料！</div>
                  <div className="flex gap-2 pt-1">
                    <button onClick={executeRestore} className="px-4 py-2 rounded-xl bg-rose-600 text-white font-semibold">確認覆蓋並還原</button>
                    <button onClick={() => setRestorePreview(null)} className="px-4 py-2 rounded-xl bg-neutral-200 dark:bg-neutral-700">取消</button>
                  </div>
                </div>
              )}
            </div>
          </div>
          )}

          <button
            onClick={() => firebase.auth().signOut()}
            className="md:hidden w-full py-3 rounded-xl border border-rose-300 text-rose-600 font-semibold"
          >
            登出帳號
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
