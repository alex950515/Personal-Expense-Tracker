<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人與情侶共同記帳系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            latte: {
              50: '#FAF8F5',
              100: '#F3EFEA',
              200: '#E6DDD3',
              300: '#D4C5B4',
              400: '#B8A28B',
              500: '#9C8267',
              600: '#7D654D',
              700: '#5E4B38',
              800: '#3D3126',
              900: '#261F18',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-latte-50 text-latte-900 dark:bg-neutral-900 dark:text-latte-100 transition-colors">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_CATEGORIES = [
      { type: 'expense', emoji: '🍔', major: '吃喝', subs: ['早餐', '午餐', '晚餐', '飲料', '點心', '宵夜'] },
      { type: 'expense', emoji: '🚗', major: '交通', subs: ['大眾運輸', '計程車', '加油', '停車', '其他交通'] },
      { type: 'expense', emoji: '🎉', major: '娛樂', subs: ['電影', '遊戲', '休閒活動'] },
      { type: 'expense', emoji: '🛍️', major: '購物', subs: ['服飾', '生活用品', '電子產品'] },
      { type: 'income', emoji: '💰', major: '工作收入', subs: ['薪水', '兼職', '獎金'] },
      { type: 'income', emoji: '🧧', major: '其他收入', subs: ['獎學金', '紅包', '利息', '其他收入'] },
    ];

    const DEFAULT_PAYMENT_METHODS = ['現金', '信用卡', '銀行轉帳'];

    const CURRENCIES = [
      { code: 'TWD', symbol: 'NT$', name: '新台幣 (TWD)' },
      { code: 'USD', symbol: 'US$', name: '美元 (USD)' },
      { code: 'JPY', symbol: '¥', name: '日圓 (JPY)' },
      { code: 'EUR', symbol: '€', name: '歐元 (EUR)' },
      { code: 'HKD', symbol: 'HK$', name: '港幣 (HKD)' },
      { code: 'KRW', symbol: '₩', name: '韓元 (KRW)' },
    ];

    function getTodayStr() {
      const now = new Date();
      const offset = 8 * 60;
      const taipei = new Date(now.getTime() + (offset + now.getTimezoneOffset()) * 60000);
      return taipei.toISOString().split('T')[0];
    }

    function getYearMonthStr(dateStr = getTodayStr()) {
      return dateStr.slice(0, 7);
    }

    function parseFirebaseConfig(input) {
      try {
        const normalized = input.replace(/\u00A0/g, ' ').trim();
        if (normalized.startsWith('{')) return JSON.parse(normalized);
        const match = normalized.match(/\{[\s\S]*\}/);
        if (!match) return null;
        const jsonLike = match[0]
          .replace(/([{,]\s*)(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '$1"$3": ')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, '}');
        return JSON.parse(jsonLike);
      } catch (e) {
        return null;
      }
    }

    function CustomModalDialog({ dialog, onClose }) {
      const [inputValue, setInputValue] = useState('');

      useEffect(() => {
        if (dialog?.defaultValue !== undefined) {
          setInputValue(dialog.defaultValue);
        } else {
          setInputValue('');
        }
      }, [dialog]);

      if (!dialog) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-lg text-latte-900 dark:text-white">{dialog.title}</h3>
            {dialog.message && (
              <p className="text-sm text-latte-700 dark:text-neutral-300 whitespace-pre-line leading-relaxed">
                {dialog.message}
              </p>
            )}
            {dialog.mode === 'prompt' && (
              <input
                type="text"
                autoFocus
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 dark:bg-neutral-700 text-sm"
              />
            )}
            <div className="flex justify-end gap-2 pt-2">
              {dialog.mode !== 'alert' && (
                <button
                  type="button"
                  onClick={() => onClose(null)}
                  className="px-4 py-2 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-200 text-sm font-medium"
                >
                  取消
                </button>
              )}
              <button
                type="button"
                onClick={() => onClose(dialog.mode === 'prompt' ? inputValue : true)}
                className={`px-4 py-2 rounded-xl text-white text-sm font-semibold ${
                  dialog.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-latte-600 hover:bg-latte-700'
                }`}
              >
                {dialog.confirmText || '確定'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [toastMsg, setToastMsg] = useState('');
      const [dialogState, setDialogState] = useState(null);

      function showToast(msg) {
        setToastMsg(msg);
        setTimeout(() => setToastMsg((prev) => (prev === msg ? '' : prev)), 3200);
      }

      function askConfirm({ title, message, danger = false, confirmText = '確定' }) {
        return new Promise((resolve) => {
          setDialogState({ mode: 'confirm', title, message, danger, confirmText, resolve });
        });
      }

      function askPrompt({ title, message = '', defaultValue = '' }) {
        return new Promise((resolve) => {
          setDialogState({ mode: 'prompt', title, message, defaultValue, resolve });
        });
      }

      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'system');
      useEffect(() => {
        const root = document.documentElement;
        const applyDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', applyDark);
        localStorage.setItem('theme', theme);
      }, [theme]);

      const [fbConfigText, setFbConfigText] = useState(() => localStorage.getItem('fb_config') || '');
      const [fbReady, setFbReady] = useState(false);
      const [configError, setConfigError] = useState('');
      const [configModalOpen, setConfigModalOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');

      useEffect(() => {
        if (!fbConfigText) {
          setAuthLoading(false);
          return;
        }
        const parsed = parseFirebaseConfig(fbConfigText);
        if (!parsed || !parsed.apiKey || !parsed.projectId) {
          setConfigError('設定格式無法解析，請貼上完整的 firebaseConfig 物件。');
          setAuthLoading(false);
          return;
        }
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(parsed);
          }
          setFbReady(true);
          setConfigError('');

          firebase.auth().getRedirectResult().catch((err) => {
            setAuthError(`登入失敗 (${err.code})：${err.message}`);
          });

          const unsub = firebase.auth().onAuthStateChanged(async (u) => {
            setUser(u);
            if (u) {
              try {
                await ensureUserInitialized(u);
              } catch (e) {
                setAuthError('初始化個人資料失敗：' + e.message);
              }
            }
            setAuthLoading(false);
          });
          return () => unsub();
        } catch (err) {
          setConfigError('Firebase 初始化失敗：' + err.message);
          setAuthLoading(false);
        }
      }, [fbConfigText]);

      async function ensureUserInitialized(u) {
        const db = firebase.firestore();
        const profileRef = db.collection('profiles').doc(u.uid);
        const profileSnap = await profileRef.get();
        const defaultNickname = u.displayName || u.email.split('@')[0];

        if (!profileSnap.exists) {
          await profileRef.set({
            uid: u.uid,
            email: u.email,
            nickname: defaultNickname,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }

        const ledgersSnap = await db.collection('ledgers')
          .where('owner_id', '==', u.uid)
          .where('type', '==', 'personal')
          .get();

        if (ledgersSnap.empty) {
          const ledgerRef = db.collection('ledgers').doc();
          await ledgerRef.set({
            name: '我的個人帳本',
            type: 'personal',
            owner_id: u.uid,
            memberIds: [u.uid],
            members: { [u.uid]: { role: 'owner', email: u.email, nickname: defaultNickname } },
            max_members: 1,
            currency: 'TWD',
            is_archived: false,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });

          const batch = db.batch();
          DEFAULT_CATEGORIES.forEach((cat) => {
            cat.subs.forEach((sub) => {
              const catRef = db.collection('categories').doc();
              batch.set(catRef, {
                ledger_id: ledgerRef.id,
                type: cat.type,
                emoji: cat.emoji || '📝',
                major: cat.major,
                sub: sub,
                is_archived: false,
              });
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            const pmRef = db.collection('payment_methods').doc();
            batch.set(pmRef, {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
        }
      }

      const [profile, setProfile] = useState(null);
      const [ledgers, setLedgers] = useState([]);
      const [activeLedgerId, setActiveLedgerId] = useState('');
      const [invitations, setInvitations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState([]);
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [budgetDoc, setBudgetDoc] = useState(null);

      const [activeTab, setActiveTab] = useState('home');
      const [selectedMonth, setSelectedMonth] = useState(getYearMonthStr());
      const [customDateRange, setCustomDateRange] = useState({ enabled: false, start: '', end: '' });

      const [txModalOpen, setTxModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      useEffect(() => {
        if (!user || !fbReady) return;
        const db = firebase.firestore();

        const unsubProfile = db.collection('profiles').doc(user.uid).onSnapshot((doc) => {
          if (doc.exists) setProfile(doc.data());
        });

        const unsubLedgers = db.collection('ledgers')
          .where('memberIds', 'array-contains', user.uid)
          .onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setLedgers(list);
            const activeList = list.filter((l) => !l.is_archived);
            if (activeList.length > 0 && (!activeLedgerId || !activeList.some((l) => l.id === activeLedgerId))) {
              const personal = activeList.find((l) => l.type === 'personal');
              setActiveLedgerId(personal ? personal.id : activeList[0].id);
            }
          });

        const unsubInvites = db.collection('ledger_invitations')
          .where('invitee_email', '==', (user.email || '').toLowerCase())
          .where('status', '==', 'pending')
          .onSnapshot((snap) => {
            setInvitations(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

        return () => {
          unsubProfile();
          unsubLedgers();
          unsubInvites();
        };
      }, [user, fbReady]);

      const activeLedger = useMemo(() => ledgers.find((l) => l.id === activeLedgerId), [ledgers, activeLedgerId]);
      const currencySymbol = useMemo(() => {
        const found = CURRENCIES.find((c) => c.code === (activeLedger?.currency || 'TWD'));
        return found ? found.symbol : 'NT$';
      }, [activeLedger]);

      useEffect(() => {
        if (!activeLedgerId || !fbReady) return;
        const db = firebase.firestore();

        const unsubTx = db.collection('transactions')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => {
              if (b.date !== a.date) return b.date.localeCompare(a.date);
              return (b.created_ms || 0) - (a.created_ms || 0);
            });
            setTransactions(list);
          });

        const unsubCat = db.collection('categories')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            setCategories(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

        const unsubPm = db.collection('payment_methods')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            setPaymentMethods(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

        return () => {
          unsubTx();
          unsubCat();
          unsubPm();
        };
      }, [activeLedgerId, fbReady]);

      useEffect(() => {
        if (!activeLedgerId || !selectedMonth || !fbReady) return;
        const db = firebase.firestore();
        const budgetId = `${activeLedgerId}_${selectedMonth}`;
        const unsub = db.collection('budgets').doc(budgetId).onSnapshot((doc) => {
          setBudgetDoc(doc.exists ? doc.data() : { total: 0, majors: {}, subs: {} });
        });
        return () => unsub();
      }, [activeLedgerId, selectedMonth, fbReady]);

      async function handleGoogleLogin() {
        setAuthError('');
        if (!fbReady) {
          setConfigModalOpen(true);
          return;
        }
        if (window.location.protocol === 'file:') {
          setAuthError('偵測到您直接雙擊開啟檔案 (file://)，Google 登入必須透過本地伺服器 (http://localhost) 執行。');
          return;
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await firebase.auth().signInWithPopup(provider);
        } catch (err) {
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            await firebase.auth().signInWithRedirect(provider);
          } else if (err.code === 'auth/unauthorized-domain') {
            setAuthError(`網域未授權 (${window.location.hostname})：請前往 Firebase Console → Authentication → Settings → Authorized domains 新增此網域。`);
          } else {
            setAuthError(`登入錯誤 (${err.code})：${err.message}`);
          }
        }
      }

      const periodTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          if (customDateRange.enabled) {
            if (customDateRange.start && tx.date < customDateRange.start) return false;
            if (customDateRange.end && tx.date > customDateRange.end) return false;
            return true;
          }
          return tx.date.startsWith(selectedMonth);
        });
      }, [transactions, selectedMonth, customDateRange]);

      const summary = useMemo(() => {
        let income = 0;
        let expense = 0;
        periodTransactions.forEach((tx) => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'income') income += amt;
          else expense += amt;
        });
        return { income, expense, balance: income - expense };
      }, [periodTransactions]);

      if (authLoading) {
        return <div className="min-h-screen flex items-center justify-center text-latte-600">載入系統資料中...</div>;
      }

      if (!user) {
        return (
          <div className="min-h-screen flex flex-col justify-between bg-latte-50 dark:bg-neutral-900 p-4 sm:p-6">
            <header className="max-w-5xl w-full mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-2xl bg-latte-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                  記
                </div>
                <div>
                  <span className="font-bold text-base text-latte-900 dark:text-white block leading-tight">暖心日常記帳本</span>
                  <span className="text-[11px] text-latte-500 dark:text-neutral-400">Personal & Couple Expense Tracker</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setConfigModalOpen(true)}
                  className="px-3 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-latte-700 dark:text-neutral-300 hover:bg-latte-100 dark:hover:bg-neutral-700 transition flex items-center gap-1.5"
                >
                  <span className={`w-2 h-2 rounded-full ${fbReady ? 'bg-emerald-500' : 'bg-amber-400'}`}></span>
                  {fbReady ? '雲端已連線' : '雲端連線設定'}
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const order = ['light', 'dark', 'system'];
                    setTheme(order[(order.indexOf(theme) + 1) % order.length]);
                  }}
                  className="px-2.5 py-1.5 rounded-xl text-xs bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-latte-600 dark:text-neutral-300"
                >
                  {theme === 'light' ? '淺色' : theme === 'dark' ? '深色' : '自動'}
                </button>
              </div>
            </header>

            <main className="max-w-md w-full mx-auto my-auto py-6">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl shadow-xl p-7 sm:p-8 border border-latte-200 dark:border-neutral-700 space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-16 h-16 mx-auto rounded-2xl bg-latte-100 dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 flex items-center justify-center text-2xl font-bold text-latte-700 dark:text-latte-200 shadow-xs">
                    記
                  </div>
                  <h1 className="text-2xl font-bold text-latte-900 dark:text-white pt-1">個人與情侶共同記帳</h1>
                  <p className="text-sm text-latte-600 dark:text-neutral-400 leading-relaxed">
                    簡單直覺的日常收支管理，讓個人儲蓄與伴侶共同生活開銷都井井有條。
                  </p>
                </div>

                <div className="bg-latte-50 dark:bg-neutral-900/60 rounded-2xl p-4 border border-latte-100 dark:border-neutral-700/80 space-y-2.5 text-xs text-latte-700 dark:text-neutral-300">
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-lg bg-latte-200/80 dark:bg-neutral-700 text-latte-700 dark:text-latte-200 flex items-center justify-center font-bold shrink-0">✓</span>
                    <span>個人帳本私密獨立，共同帳本支援最多 5 人即時同步</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-lg bg-latte-200/80 dark:bg-neutral-700 text-latte-700 dark:text-latte-200 flex items-center justify-center font-bold shrink-0">✓</span>
                    <span>自動記錄每筆支出付款人，雙方分攤與支出明細一目了然</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-lg bg-latte-200/80 dark:bg-neutral-700 text-latte-700 dark:text-latte-200 flex items-center justify-center font-bold shrink-0">✓</span>
                    <span>支援多幣別管理、月度預算進度追蹤與備份管理</span>
                  </div>
                </div>

                {authError && (
                  <div className="p-3.5 rounded-xl bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300 text-left leading-relaxed">
                    {authError}
                  </div>
                )}

                <div className="space-y-3">
                  <button
                    type="button"
                    onClick={handleGoogleLogin}
                    className="w-full py-3.5 px-5 rounded-2xl bg-latte-700 hover:bg-latte-800 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition flex items-center justify-center gap-3"
                  >
                    <svg className="w-5 h-5 bg-white rounded-full p-0.5 shrink-0" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z" />
                      <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z" />
                      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z" />
                    </svg>
                    <span>使用 Google 帳號登入</span>
                  </button>
                </div>
              </div>
            </main>

            <footer className="text-center text-xs text-latte-500 dark:text-neutral-500">
              資料加密儲存於您的專屬雲端空間 • 支援手機與電腦跨裝置同步
            </footer>

            {configModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="max-w-lg w-full bg-white dark:bg-neutral-800 rounded-2xl shadow-xl p-6 border border-latte-200 dark:border-neutral-700 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-lg font-bold text-latte-900 dark:text-white">Firebase 雲端資料庫連線設定</h2>
                    <button
                      type="button"
                      onClick={() => setConfigModalOpen(false)}

    function SwipeableTransactionItem({ tx, currencySymbol, activeLedger, onEditClick, onDeleteClick }) {
      const [swipeOffset, setSwipeOffset] = useState(0);
      const touchStartX = useRef(0);
      const isDragging = useRef(false);

      function handleTouchStart(e) {
        touchStartX.current = e.touches[0].clientX;
        isDragging.current = true;
      }

      function handleTouchMove(e) {
        if (!isDragging.current) return;
        const currentX = e.touches[0].clientX;
        const diff = currentX - touchStartX.current;
        if (diff < 0) {
          setSwipeOffset(Math.max(diff, -130));
        } else {
          setSwipeOffset(0);
        }
      }

      function handleTouchEnd() {
        isDragging.current = false;
        if (swipeOffset < -65) {
          setSwipeOffset(-130);
        } else {
          setSwipeOffset(0);
        }
      }

      function handleMouseDown(e) {
        touchStartX.current = e.clientX;
        isDragging.current = true;
      }

      function handleMouseMove(e) {
        if (!isDragging.current) return;
        const diff = e.clientX - touchStartX.current;
        if (diff < 0) {
          setSwipeOffset(Math.max(diff, -130));
        } else {
          setSwipeOffset(0);
        }
      }

      function handleMouseUp() {
        if (!isDragging.current) return;
        isDragging.current = false;
        if (swipeOffset < -65) {
          setSwipeOffset(-130);
        } else {
          setSwipeOffset(0);
        }
      }

      return (
        <div className="relative overflow-hidden border-b border-latte-100 dark:border-neutral-700/60 last:border-b-0">
          <div className="absolute inset-y-0 right-0 flex items-center bg-latte-100 dark:bg-neutral-800 z-0">
            <button
              type="button"
              onClick={() => { setSwipeOffset(0); onEditClick(tx); }}
              className="h-full px-4 bg-latte-600 hover:bg-latte-700 text-white text-xs font-semibold flex items-center justify-center transition"
            >
              編輯
            </button>
            <button
              type="button"
              onClick={() => { setSwipeOffset(0); onDeleteClick(tx); }}
              className="h-full px-4 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold flex items-center justify-center transition"
            >
              刪除
            </button>
          </div>

          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            style={{ transform: `translateX(${swipeOffset}px)` }}
            className="relative z-10 bg-white dark:bg-neutral-800 px-5 py-4 flex items-center justify-between gap-3 transition-transform duration-200 select-none cursor-grab active:cursor-grabbing"
          >
            <div className="space-y-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-xs sm:text-sm text-latte-900 dark:text-white truncate">
                  {tx.emoji || '📝'} {tx.sub_category} {tx.item_name ? `- ${tx.item_name}` : ''}
                </span>
                <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-latte-300">
                  {tx.major_category}
                </span>
                {activeLedger?.type === 'couple' && (
                  <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300">
                    {tx.payer_nickname}
                  </span>
                )}
              </div>
              <div className="text-[11px] sm:text-xs text-latte-500 dark:text-neutral-400 flex gap-2.5 flex-wrap">
                <span>{tx.date}</span>
                <span>{tx.payment_method}</span>
                {tx.note && <span className="truncate">備註：{tx.note}</span>}
              </div>
            </div>

            <div className="flex items-center gap-3 shrink-0">
              <span className={`font-bold text-sm sm:text-base ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                {tx.type === 'income' ? `+${currencySymbol}${Number(tx.amount).toLocaleString()}` : `-${currencySymbol}${Number(tx.amount).toLocaleString()}`}
              </span>
            </div>
          </div>
        </div>
      );
    }

    function TransactionModal({ user, profile, activeLedger, categories, paymentMethods, editingTx, showToast, onClose }) {
      const [type, setType] = useState(editingTx?.type || 'expense');
      const [amountStr, setAmountStr] = useState(editingTx ? String(editingTx.amount) : '0');
      const [date, setDate] = useState(editingTx?.date || getTodayStr());
      const [itemName, setItemName] = useState(editingTx?.item_name || '');
      const [note, setNote] = useState(editingTx?.note || '');

      const filteredCats = useMemo(() => categories.filter((c) => c.type === type && !c.is_archived), [categories, type]);
      const majors = useMemo(() => [...new Set(filteredCats.map((c) => c.major))], [filteredCats]);

      const [selectedMajor, setSelectedMajor] = useState(editingTx?.major_category || (majors.length > 0 ? majors[0] : ''));
      const [selectedSubCat, setSelectedSubCat] = useState(editingTx ? { major: editingTx.major_category, sub: editingTx.sub_category, emoji: editingTx.emoji || '📝' } : null);

      useEffect(() => {
        if (majors.length > 0 && (!selectedMajor || !majors.includes(selectedMajor))) {
          setSelectedMajor(majors[0]);
        }
      }, [type, majors]);

      useEffect(() => {
        if (!selectedSubCat && majors.length > 0) {
          const firstCat = filteredCats.find((c) => c.major === majors[0]);
          if (firstCat) {
            setSelectedSubCat({ major: firstCat.major, sub: firstCat.sub, emoji: firstCat.emoji || '📝' });
          }
        }
      }, [majors, filteredCats]);

      const currentMajorSubs = useMemo(() => {
        return filteredCats.filter((c) => c.major === selectedMajor);
      }, [filteredCats, selectedMajor]);

      const activePms = useMemo(() => paymentMethods.filter((p) => p.is_active), [paymentMethods]);
      const [paymentMethod, setPaymentMethod] = useState(editingTx?.payment_method || '');
      const [saving, setSaving] = useState(false);

      const [dateModalOpen, setDateModalOpen] = useState(false);
      const [pmModalOpen, setPmModalOpen] = useState(false);

      useEffect(() => {
        if (activePms.length > 0 && !activePms.some((p) => p.name === paymentMethod)) {
          const defaultCash = activePms.find((p) => p.name === '現金');
          setPaymentMethod(defaultCash ? defaultCash.name : activePms[0].name);
        }
      }, [activePms]);

      function handleKeyPress(val) {
        if (val === 'AC') {
          setAmountStr('0');
          return;
        }
        if (val === 'backspace') {
          setAmountStr((prev) => (prev.length > 1 ? prev.slice(0, -1) : '0'));
          return;
        }
        if (val === '=') {
          try {
            const sanitized = amountStr.replace(/×/g, '*').replace(/÷/g, '/');
            const result = Function(`return ${sanitized}`)();
            if (!isNaN(result) && isFinite(result)) {
              setAmountStr(String(Number(result.toFixed(2))));
            }
          } catch (e) {}
          return;
        }
        if (['+', '-', '×', '÷'].includes(val)) {
          if (['+', '-', '×', '÷'].some((op) => amountStr.endsWith(op))) return;
          setAmountStr((prev) => prev + val);
          return;
        }
        if (val === '.') {
          const parts = amountStr.split(/[\+\-×÷]/);
          const currentPart = parts[parts.length - 1];
          if (currentPart.includes('.')) return;
          setAmountStr((prev) => prev + '.');
          return;
        }
        setAmountStr((prev) => {
          if (prev === '0' && val !== '00') return val;
          if (prev === '0' && val === '00') return '0';
          return prev + val;
        });
      }

      async function handleSubmit() {
        let finalAmount = 0;
        try {
          const sanitized = amountStr.replace(/×/g, '*').replace(/÷/g, '/');
          finalAmount = Number(Function(`return ${sanitized}`)());
        } catch (e) {
          finalAmount = Number(amountStr) || 0;
        }

        if (!finalAmount || finalAmount <= 0) {
          showToast('請輸入大於 0 的有效金額');
          return;
        }
        if (!selectedSubCat) {
          showToast('請選擇子分類');
          return;
        }
        if (!date) {
          showToast('請選擇日期');
          return;
        }
        if (!paymentMethod) {
          showToast('請先選擇付款方式');
          return;
        }
        setSaving(true);
        const db = firebase.firestore();
        try {
          if (editingTx) {
            await db.collection('transactions').doc(editingTx.id).update({
              type,
              amount: finalAmount,
              major_category: selectedSubCat.major,
              sub_category: selectedSubCat.sub,
              date,
              item_name: itemName.trim(),
              note: note.trim(),
              payment_method: paymentMethod,
            });
            showToast('已更新交易紀錄');
          } else {
            await db.collection('transactions').add({
              ledger_id: activeLedger.id,
              type,
              amount: finalAmount,
              major_category: selectedSubCat.major,
              sub_category: selectedSubCat.sub,
              date,
              item_name: itemName.trim(),
              note: note.trim(),
              payment_method: paymentMethod,
              payer_id: user.uid,
              payer_nickname: profile?.nickname || user.email.split('@')[0],
              created_ms: Date.now(),
            });
            showToast('已新增交易紀錄');
          }
          onClose();
        } catch (err) {
          showToast('儲存失敗：' + err.message);
        } finally {
          setSaving(false);
        }
      }

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-4 sm:p-6 space-y-3.5 shadow-2xl max-h-[96vh] overflow-y-auto">
            
            <div className="flex justify-end items-center pb-1">
              <button type="button" onClick={onClose} className="p-1.5 rounded-full text-neutral-400 hover:bg-latte-100 dark:hover:bg-neutral-800 shrink-0">✕</button>
            </div>

            {/* 固定為兩行高度的分類選擇區塊，支援橫向滾輪滑動查看更多分類 */}
            <div className="bg-latte-50 dark:bg-neutral-800/50 p-3 rounded-2xl space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-latte-600 dark:text-neutral-400">選擇記帳分類</span>
                {selectedSubCat && (
                  <span className="text-xs font-bold text-latte-900 dark:text-white bg-white dark:bg-neutral-700 px-3 py-0.5 rounded-full shadow-2xs border border-latte-200 dark:border-neutral-600">
                    已選：{selectedSubCat.emoji} {selectedSubCat.major} - {selectedSubCat.sub}
                  </span>
                )}
              </div>

              {/* 第一行：大分類滾動列 */}
              <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar shrink-0">
                {majors.map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => setSelectedMajor(m)}
                    className={`px-3 py-1 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                      selectedMajor === m
                        ? 'bg-latte-800 text-white shadow-2xs dark:bg-neutral-100 dark:text-neutral-900'
                        : 'bg-white dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 border border-latte-200 dark:border-neutral-600'
                    }`}
                  >
                    {m}
                  </button>
                ))}
              </div>

              {/* 第二行：子分類滾動網格（固定兩行檢視高度，橫向滾輪滑動） */}
              <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                {currentMajorSubs.map((c) => {
                  const isSelected = selectedSubCat?.major === c.major && selectedSubCat?.sub === c.sub;
                  return (
                    <button
                      key={c.id || c.sub}
                      type="button"
                      onClick={() => setSelectedSubCat({ major: c.major, sub: c.sub, emoji: c.emoji || '📝' })}
                      className={`flex flex-col items-center justify-center p-2 rounded-xl border transition min-w-[70px] shrink-0 ${
                        isSelected
                          ? 'border-latte-600 bg-white dark:bg-neutral-700 ring-2 ring-latte-600/30 font-bold'

                      <span className="text-[10px] text-latte-800 dark:text-neutral-200 truncate w-full text-center">{c.sub}</span>
                    </button>

              </div>
            </div>

            <div>
              <input
                type="text"
                value={itemName}
                onChange={(e) => setItemName(e.target.value)}
                placeholder="點選添加備註/項目名稱 📝"
                className="w-full px-4 py-2.5 rounded-xl bg-latte-50 dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs sm:text-sm text-latte-800 dark:text-neutral-200 focus:outline-none placeholder:text-latte-400 font-medium"
              />
            </div>

            <div className="flex items-center justify-between bg-latte-100 dark:bg-neutral-800 px-4 py-3 rounded-2xl gap-3">
              <div className="text-xl sm:text-2xl font-bold text-latte-900 dark:text-white tracking-tight text-left truncate">
                NT$ {amountStr}
              </div>
              <div className="flex gap-1.5 shrink-0">
                <button
                  type="button"
                  onClick={() => setType('expense')}
                  className={`px-3.5 py-2 rounded-xl font-bold text-xs sm:text-sm transition shadow-xs ${
                    type === 'expense'
                      ? 'bg-rose-600 text-white ring-2 ring-rose-600/30'

            <div className="space-y-3">

                <button type="button" onClick={() => handleKeyPress('4')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">4</button>
                <button type="button" onClick={() => handleKeyPress('5')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">5</button>
                <button type="button" onClick={() => handleKeyPress('6')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">6</button>
                <button
                  type="button"
                  onClick={() => setPmModalOpen(true)}

                <button type="button" onClick={() => handleKeyPress('7')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">7</button>
                <button type="button" onClick={() => handleKeyPress('8')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">8</button>
                <button type="button" onClick={() => handleKeyPress('9')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">9</button>
                <button
                  type="button"
                  onClick={() => setDateModalOpen(true)}
                  className="py-2 px-1 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex flex-col items-center justify-center shadow-sm"
                >
                  <span className="text-[10px] opacity-90">日期</span>
                  <span className="truncate w-full">{date === getTodayStr() ? '今日' : date.slice(5)}</span>
                </button>

                <button type="button" onClick={() => handleKeyPress('.')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">.</button>
                <button type="button" onClick={() => handleKeyPress('0')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">0</button>
                <button type="button" onClick={() => handleKeyPress('00')} className="py-3 rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-100 font-bold text-base shadow-2xs">00</button>
                <button
                  type="button"
                  disabled={saving}
                  onClick={handleSubmit}
                  className="py-3 rounded-xl bg-latte-800 hover:bg-latte-900 active:scale-95 text-white font-bold text-xs shadow-md flex items-center justify-center transition"

                </button>
              </div>

            {pmModalOpen && (
              <div className="fixed inset-0 z-60 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-xs w-full p-5 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-3">
                  <h4 className="font-bold text-sm text-latte-900 dark:text-white">選擇付款方式</h4>
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {activePms.map((p) => (
                      <button
                        key={p.id}
                        type="button"

                        className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-semibold transition ${paymentMethod === p.name ? 'bg-latte-600 text-white' : 'bg-latte-50 dark:bg-neutral-700 text-latte-800 dark:text-neutral-200'}`}

              <div className="fixed inset-0 z-60 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-xs w-full p-5 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-3">
                  <h4 className="font-bold text-sm text-latte-900 dark:text-white">選擇交易日期</h4>

                    </button>

                  />

    function BudgetView({ activeLedger, currencySymbol, selectedMonth, setSelectedMonth, categories, transactions, budgetDoc, showToast }) {
      const [totalInput, setTotalInput] = useState(0);
      const [majorsInput, setMajorsInput] = useState({});
      const [subsInput, setSubsInput] = useState({});
      const [expandedMajors, setExpandedMajors] = useState({});

      useEffect(() => {
        if (budgetDoc) {
          setTotalInput(budgetDoc.total || 0);
          setMajorsInput(budgetDoc.majors || {});
          setSubsInput(budgetDoc.subs || {});
        }
      }, [budgetDoc]);

      const toggleMajorExpand = (majorName) => {
        setExpandedMajors((prev) => ({
          ...prev,
          [majorName]: !prev[majorName],
        }));
      };

      const expenseCats = useMemo(() => categories.filter((c) => c.type === 'expense' && !c.is_archived), [categories]);
      const majors = useMemo(() => [...new Set(expenseCats.map((c) => c.major))], [expenseCats]);

      const actualTotal = useMemo(() => transactions.reduce((acc, t) => acc + (Number(t.amount) || 0), 0), [transactions]);
      const actualByMajor = useMemo(() => {
        const map = {};
        transactions.forEach((t) => { map[t.major_category] = (map[t.major_category] || 0) + (Number(t.amount) || 0); });
        return map;
      }, [transactions]);
      const actualBySub = useMemo(() => {
        const map = {};
        transactions.forEach((t) => {
          const key = `${t.major_category}::${t.sub_category}`;
          map[key] = (map[key] || 0) + (Number(t.amount) || 0);
        });
        return map;
      }, [transactions]);

      async function saveBudgets() {
        if (!activeLedger) return;
        try {
          const budgetId = `${activeLedger.id}_${selectedMonth}`;
          await firebase.firestore().collection('budgets').doc(budgetId).set({
            ledger_id: activeLedger.id,
            month: selectedMonth,
            total: Number(totalInput) || 0,
            majors: majorsInput,
            subs: subsInput,
          });
          showToast('本月預算設定已儲存');
        } catch (err) {
          showToast('儲存預算失敗：' + err.message);
        }
      }

      function renderProgressBar(label, budgetAmt, usedAmt) {
        const b = Number(budgetAmt) || 0;
        if (b <= 0) return null;
        const pct = Math.round((usedAmt / b) * 100);
        const remaining = b - usedAmt;
        let barColor = 'bg-emerald-500';
        if (pct >= 100) barColor = 'bg-rose-600';
        else if (pct >= 70) barColor = 'bg-amber-500';

        return (
          <div key={label} className="p-4 rounded-xl bg-latte-50 dark:bg-neutral-700/50 space-y-2 text-sm">
            <div className="flex justify-between font-semibold">
              <span>{label}</span>
              <span>使用率：{pct}%</span>
            </div>
            <div className="w-full h-3 rounded-full bg-latte-200 dark:bg-neutral-600 overflow-hidden">
              <div className={`h-full ${barColor} transition-all`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
            </div>
            <div className="flex justify-between text-xs text-latte-600 dark:text-neutral-300">
              <span>預算：{currencySymbol}{b.toLocaleString()}</span>
              <span>已用：{currencySymbol}{usedAmt.toLocaleString()}</span>
              <span>剩餘：{currencySymbol}{remaining.toLocaleString()}</span>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <input
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="px-3 py-2 rounded-xl bg-white dark:bg-neutral-800 border border-latte-300 dark:border-neutral-600 text-sm font-semibold"
              />
            </div>
            <button onClick={saveBudgets} className="px-4 py-2 rounded-xl bg-latte-600 text-white text-sm font-semibold">儲存預算設定</button>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-3">
            <h3 className="font-bold text-base">本月預算執行進度</h3>
            {renderProgressBar('每月總支出預算', totalInput, actualTotal)}
            {majors.map((m) => renderProgressBar(`大分類：${m}`, majorsInput[m], actualByMajor[m] || 0))}
            {expenseCats.map((c) => {
              const key = `${c.major}::${c.sub}`;
              return renderProgressBar(`子分類：${c.major} - ${c.sub}`, subsInput[key], actualBySub[key] || 0);
            })}
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4 text-sm">
            <h3 className="font-bold text-base">設定預算上限（點擊大分類展開子分類）</h3>
            <div className="flex items-center justify-between gap-4 border-b border-latte-100 dark:border-neutral-700 pb-3">
              <span className="font-bold">每月總支出預算</span>
              <input
                type="number"
                min="0"
                value={totalInput}
                onChange={(e) => setTotalInput(e.target.value)}
                className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
              />
            </div>

            {majors.map((m) => {
              const isExpanded = !!expandedMajors[m];
              const subItems = expenseCats.filter((c) => c.major === m);
              return (
                <div key={m} className="space-y-2 border-b border-latte-100 dark:border-neutral-700 pb-3">
                  <div className="flex items-center justify-between gap-4">
                    <button
                      type="button"
                      onClick={() => toggleMajorExpand(m)}
                      className="flex items-center gap-2 font-semibold text-left hover:text-latte-600 dark:hover:text-latte-300 py-1"
                    >
                      <span className="text-xs w-4 inline-block text-latte-500">
                        {isExpanded ? '▼' : '▶'}
                      </span>
                      <span>大分類：{m}</span>
                      <span className="text-xs font-normal text-latte-400">
                        ({subItems.length} 項子分類)
                      </span>
                    </button>
                    <input
                      type="number"
                      min="0"
                      value={majorsInput[m] || ''}
                      placeholder="0"
                      onChange={(e) => setMajorsInput({ ...majorsInput, [m]: Number(e.target.value) || 0 })}
                      className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                    />
                  </div>
                  {isExpanded && (
                    <div className="pl-6 space-y-1.5 pt-1">
                      {subItems.map((c) => {
                        const key = `${c.major}::${c.sub}`;
                        return (
                          <div key={key} className="flex items-center justify-between gap-4 text-xs text-latte-600 dark:text-neutral-300">
                            <span>- 子分類：{c.sub}</span>
                            <input
                              type="number"
                              min="0"
                              value={subsInput[key] || ''}
                              placeholder="0"
                              onChange={(e) => setSubsInput({ ...subsInput, [key]: Number(e.target.value) || 0 })}
                              className="w-32 p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                            />
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SettingsView({ user, profile, ledgers, activeLedger, setActiveLedgerId, invitations, categories, paymentMethods, transactions, theme, setTheme, showToast, askConfirm, askPrompt }) {
      const [nicknameInput, setNicknameInput] = useState(profile?.nickname || '');
      const [newCoupleLedgerName, setNewCoupleLedgerName] = useState('');
      const [inviteEmail, setInviteEmail] = useState('');

      const [catType, setCatType] = useState('expense');
      const [catEmoji, setCatEmoji] = useState('🍔');
      const [catMajor, setCatMajor] = useState('');
      const [catSub, setCatSub] = useState('');
      const [newPmName, setNewPmName] = useState('');

      useEffect(() => {
        if (profile?.nickname) setNicknameInput(profile.nickname);
      }, [profile]);

      const isOwner = activeLedger?.owner_id === user.uid;

      async function saveNickname() {
        if (!nicknameInput.trim()) return;
        try {
          await firebase.firestore().collection('profiles').doc(user.uid).update({ nickname: nicknameInput.trim() });
          showToast('顯示暱稱已更新');
        } catch (err) {
          showToast('更新暱稱失敗：' + err.message);
        }
      }

      async function updateLedgerName(ledger) {
        if (ledger.owner_id !== user.uid) {
          showToast('只有帳本擁有者可以修改帳本名稱');
          return;
        }
        const newName = await askPrompt({
          title: '修改帳本名稱',
          defaultValue: ledger.name,
        });
        if (!newName || !newName.trim()) return;
        try {
          await firebase.firestore().collection('ledgers').doc(ledger.id).update({
            name: newName.trim(),
            updated_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          showToast('帳本名稱已更新');
        } catch (err) {
          showToast('更新帳本名稱失敗：' + err.message);
        }
      }

      async function createCoupleLedger() {
        if (!newCoupleLedgerName.trim()) {
          showToast('請先輸入共同帳本名稱');
          return;
        }
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc();
          const myNick = profile?.nickname || user.email.split('@')[0];

          await ledgerRef.set({
            name: newCoupleLedgerName.trim(),
            type: 'couple',
            owner_id: user.uid,
            memberIds: [user.uid],
            members: { [user.uid]: { role: 'owner', email: user.email, nickname: myNick } },
            max_members: 5,
            currency: 'TWD',
            is_archived: false,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });

          const batch = db.batch();
          DEFAULT_CATEGORIES.forEach((cat) => {
            cat.subs.forEach((sub) => {
              batch.set(db.collection('categories').doc(), {
                ledger_id: ledgerRef.id,
                type: cat.type,
                emoji: cat.emoji || '📝',
                major: cat.major,
                sub,
                is_archived: false,
              });
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            batch.set(db.collection('payment_methods').doc(), {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
          setNewCoupleLedgerName('');
          setActiveLedgerId(ledgerRef.id);
          showToast('已建立情侶共同帳本');
        } catch (err) {
          showToast('建立共同帳本失敗：' + err.message);
        }
      }

      async function sendInvitation() {
        if (!inviteEmail.trim()) {
          showToast('請輸入邀請對象的 Google Email');
          return;
        }
        if (!isOwner || activeLedger?.type !== 'couple') return;
        if ((activeLedger.memberIds || []).length >= 5) {
          showToast('共同帳本最多只能有 5 位成員（含擁有者）');
          return;
        }
        try {
          await firebase.firestore().collection('ledger_invitations').add({
            ledger_id: activeLedger.id,
            ledger_name: activeLedger.name,
            inviter_id: user.uid,
            inviter_nickname: profile?.nickname || user.email,
            invitee_email: inviteEmail.trim().toLowerCase(),
            status: 'pending',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setInviteEmail('');
          showToast('已發送邀請！對方登入後即可接受加入');
        } catch (err) {
          showToast('發送邀請失敗：' + err.message);
        }
      }

      async function acceptInvitation(inv) {
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc(inv.ledger_id);
          const snap = await ledgerRef.get();
          if (!snap.exists) {
            showToast('找不到該共同帳本（可能已被刪除）');
            return;
          }
          const data = snap.data();
          if ((data.memberIds || []).length >= 5) {
            showToast('此共同帳本成員已滿 5 人上限');
            return;
          }
          const myNick = profile?.nickname || user.email.split('@')[0];
          await ledgerRef.update({
            memberIds: firebase.firestore.FieldValue.arrayUnion(user.uid),
            [`members.${user.uid}`]: { role: 'member', email: user.email, nickname: myNick },
          });
          await db.collection('ledger_invitations').doc(inv.id).update({ status: 'accepted' });
          setActiveLedgerId(inv.ledger_id);
          showToast(`已成功加入「${inv.ledger_name}」`);
        } catch (err) {
          showToast('加入帳本失敗：' + err.message);
        }
      }

      async function removeMember(targetUid) {
        if (!isOwner || targetUid === user.uid) return;
        const ok = await askConfirm({
          title: '移除共同帳本成員',
          message: '確定要移除此成員嗎？移除後對方將立即失去存取權限，但歷史交易紀錄會完整保留。',
          danger: true,
          confirmText: '確認移除',
        });
        if (!ok) return;
        try {
          const updatedMembers = { ...(activeLedger.members || {}) };
          delete updatedMembers[targetUid];
          await firebase.firestore().collection('ledgers').doc(activeLedger.id).update({
            memberIds: firebase.firestore.FieldValue.arrayRemove(targetUid),
            members: updatedMembers,
          });
          showToast('已移除該成員');
        } catch (err) {
          showToast('移除成員失敗：' + err.message);
        }
      }

      async function changeCurrency(newCode) {
        if (!isOwner) return;
        const ok = await askConfirm({
          title: '變更帳本幣別',
          message: `確定將幣別改為 ${newCode} 嗎？\n提醒：原有交易金額不會自動進行匯率換算。`,
          confirmText: '確認變更',
        });
        if (!ok) return;
        try {
          await firebase.firestore().collection('ledgers').doc(activeLedger.id).update({ currency: newCode });
          showToast(`幣別已變更為 ${newCode}`);
        } catch (err) {
          showToast('變更幣別失敗：' + err.message);
        }
      }

      async function toggleArchiveLedger(ledger, archiveState) {
        try {
          await firebase.firestore().collection('ledgers').doc(ledger.id).update({ is_archived: archiveState });
          showToast(archiveState ? '已封存帳本' : '已解除封存');
        } catch (err) {
          showToast('操作失敗：' + err.message);
        }
      }

      async function permanentlyDeleteLedger(ledger) {
        if (ledger.owner_id !== user.uid) return;
        const ok1 = await askConfirm({
          title: `永久刪除「${ledger.name}」`,
          message: '【警告】所有交易、分類與預算將一併刪除且無法復原！確定要繼續嗎？',
          danger: true,
          confirmText: '繼續刪除',
        });
        if (!ok1) return;
        const ok2 = await askConfirm({
          title: '最後確認：不可逆操作',
          message: `請再次確認：真的要永久刪除「${ledger.name}」？`,
          danger: true,
          confirmText: '確認永久刪除',
        });
        if (!ok2) return;

        try {
          const db = firebase.firestore();
          const collections = ['transactions', 'categories', 'payment_methods', 'budgets'];
          for (const col of collections) {
            const snap = await db.collection(col).where('ledger_id', '==', ledger.id).get();
            const batch = db.batch();
            snap.docs.forEach((d) => batch.delete(d.ref));
            await batch.commit();
          }
          await db.collection('ledgers').doc(ledger.id).delete();
          showToast(`已永久刪除「${ledger.name}」`);
        } catch (err) {
          showToast('永久刪除失敗：' + err.message);
        }
      }

      async function addCategory(e) {
        e.preventDefault();
        if (!catMajor.trim() || !catSub.trim()) {
          showToast('請完整輸入大分類與子分類名稱');
          return;
        }
        try {
          await firebase.firestore().collection('categories').add({
            ledger_id: activeLedger.id,
            type: catType,
            emoji: catEmoji.trim() || '📝',
            major: catMajor.trim(),
            sub: catSub.trim(),
            is_archived: false,
          });
          setCatSub('');
          showToast('已新增自訂分類');
        } catch (err) {
          showToast('新增分類失敗：' + err.message);
        }
      }

      async function deleteCategory(cat) {
        const ok = await askConfirm({
          title: '刪除分類',
          message: `確定要永久刪除「${cat.major} / ${cat.sub}」分類嗎？`,
          danger: true,
          confirmText: '確認刪除',
        });
        if (!ok) return;
        try {
          await firebase.firestore().collection('categories').doc(cat.id).delete();
          showToast('已刪除該分類');
        } catch (err) {
          showToast('刪除分類失敗：' + err.message);
        }
      }

      async function addPaymentMethod(e) {
        e.preventDefault();
        if (!newPmName.trim()) return;
        try {
          await firebase.firestore().collection('payment_methods').add({
            ledger_id: activeLedger.id,
            name: newPmName.trim(),
            is_active: true,
          });
          setNewPmName('');
          showToast('已新增付款方式');
        } catch (err) {
          showToast('新增付款方式失敗：' + err.message);
        }
      }

      async function togglePaymentMethodActive(pm) {
        try {
          await firebase.firestore().collection('payment_methods').doc(pm.id).update({ is_active: !pm.is_active });
          showToast('付款方式狀態已更新');
        } catch (err) {
          showToast('更新失敗：' + err.message);
        }
      }

      return (
        <div className="space-y-6 text-sm">
          {invitations.length > 0 && (
            <div className="p-5 rounded-2xl bg-amber-50 dark:bg-amber-900/30 border border-amber-300 dark:border-amber-700 space-y-3">
              <h3 className="font-bold text-base">收到共同帳本邀請</h3>
              {invitations.map((inv) => (
                <div key={inv.id} className="flex items-center justify-between gap-2">
                  <span><strong>{inv.inviter_nickname}</strong> 邀請您加入「<strong>{inv.ledger_name}</strong>」</span>
                  <button onClick={() => acceptInvitation(inv)} className="px-4 py-1.5 rounded-xl bg-latte-600 text-white font-semibold">接受加入</button>
                </div>
              ))}
            </div>
          )}

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">個人設定與外觀</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={nicknameInput}
                onChange={(e) => setNicknameInput(e.target.value)}
                placeholder="設定顯示暱稱"
                className="flex-1 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
              />
              <button onClick={saveNickname} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">更新暱稱</button>
            </div>
            <div className="flex items-center justify-between pt-2">
              <span>顯示主題模式</span>
              <div className="flex gap-2">
                {[['light', '淺色'], ['dark', '深色'], ['system', '跟隨系統']].map(([val, lbl]) => (
                  <button
                    key={val}
                    onClick={() => setTheme(val)}
                    className={`px-3 py-1.5 rounded-xl border ${theme === val ? 'bg-latte-600 text-white border-latte-600' : 'border-latte-300 dark:border-neutral-600'}`}
                  >
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">帳本管理與情侶共同帳本</h3>
            <div className="flex gap-2">
              <input
                type="text"
                value={newCoupleLedgerName}
                onChange={(e) => setNewCoupleLedgerName(e.target.value)}
                placeholder="輸入新的情侶共同帳本名稱..."
                className="flex-1 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
              />
              <button onClick={createCoupleLedger} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">建立共同帳本</button>
            </div>

            {activeLedger && (
              <div className="p-4 rounded-xl bg-latte-50 dark:bg-neutral-700/50 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="font-bold">目前帳本：{activeLedger.name}</span>
                  <div className="flex items-center gap-2">
                    <span>幣別：</span>
                    <select
                      disabled={!isOwner}
                      value={activeLedger.currency}
                      onChange={(e) => changeCurrency(e.target.value)}
                      className="p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600"
                    >
                      {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.name}</option>)}
                    </select>
                  </div>
                </div>

                {activeLedger.type === 'couple' && (
                  <div className="space-y-2 border-t border-latte-200 dark:border-neutral-600 pt-3">
                    <div className="font-semibold">成員列表（{(activeLedger.memberIds || []).length} / 5 人）</div>
                    {Object.entries(activeLedger.members || {}).map(([mUid, mInfo]) => (
                      <div key={mUid} className="flex items-center justify-between">
                        <span>{mInfo.nickname} ({mInfo.email}) {mInfo.role === 'owner' ? '👑 擁有者' : ''}</span>
                        {isOwner && mUid !== user.uid && (
                          <button onClick={() => removeMember(mUid)} className="text-xs text-rose-600 hover:underline">移除成員</button>
                        )}
                      </div>
                    ))}
                    {isOwner && (
                      <div className="flex gap-2 pt-2">
                        <input
                          type="email"
                          value={inviteEmail}
                          onChange={(e) => setInviteEmail(e.target.value)}
                          placeholder="輸入伴侶的 Google Email 發送邀請..."
                          className="flex-1 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600"
                        />
                        <button onClick={sendInvitation} className="px-4 py-2 rounded-xl bg-latte-600 text-white font-semibold">邀請</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            <div className="space-y-2 pt-2">
              <div className="font-semibold text-xs text-latte-500">所有帳本（更改名稱 / 封存 / 還原 / 永久刪除）</div>
              {ledgers.map((l) => (
                <div key={l.id} className="flex items-center justify-between p-3 rounded-xl border border-latte-200 dark:border-neutral-700">
                  <span>{l.name} {l.is_archived ? '（已封存）' : ''}</span>
                  {l.owner_id === user.uid && (
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => updateLedgerName(l)}
                        className="px-3 py-1 rounded-lg bg-latte-200 dark:bg-neutral-700 text-xs font-semibold"
                      >
                        更改名稱
                      </button>
                      <button
                        type="button"
                        onClick={() => toggleArchiveLedger(l, !l.is_archived)}
                        className="px-3 py-1 rounded-lg bg-latte-200 dark:bg-neutral-700 text-xs"
                      >
                        {l.is_archived ? '解除封存' : '封存'}
                      </button>
                      <button
                        type="button"
                        onClick={() => permanentlyDeleteLedger(l)}
                        className="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs"
                      >
                        永久刪除
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">自訂收支分類與 Emoji 圖示（目前帳本）</h3>
            <form onSubmit={addCategory} className="flex flex-wrap gap-2">
              <select
                value={catType}
                onChange={(e) => setCatType(e.target.value)}
                className="p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-xs"
              >
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
              <input
                type="text"
                placeholder="Emoji (例: 🍔)"
                value={catEmoji}
                onChange={(e) => setCatEmoji(e.target.value)}
                className="w-18 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-center text-xs"
              />
              <input
                type="text"
                placeholder="大分類名稱"
                value={catMajor}
                onChange={(e) => setCatMajor(e.target.value)}
                className="flex-1 min-w-[90px] p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-xs"
              />
              <input
                type="text"
                placeholder="子分類名稱"
                value={catSub}
                onChange={(e) => setCatSub(e.target.value)}
                className="flex-1 min-w-[90px] p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-xs"
              />
              <button type="submit" className="px-4 py-2.5 rounded-xl bg-latte-600 text-white font-semibold text-xs">新增分類</button>
            </form>
            <div className="flex flex-wrap gap-2 pt-2">
              {categories.map((c) => (
                <div key={c.id} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs border bg-latte-50 dark:bg-neutral-700/50">
                  <span>{c.emoji || '📝'} {c.type === 'income' ? '收' : '支'} | {c.major} / {c.sub}</span>
                  <button type="button" onClick={() => deleteCategory(c)} className="text-rose-600 hover:font-bold ml-1" title="刪除分類">×</button>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">付款方式管理（目前帳本）</h3>
            <form onSubmit={addPaymentMethod} className="flex gap-2">
              <input
                type="text"
                placeholder="新增付款方式（如：悠遊卡、街口支付）"
                value={newPmName}
                onChange={(e) => setNewPmName(e.target.value)}
                className="flex-1 p-2.5 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-xs"
              />
              <button type="submit" className="px-4 py-2.5 rounded-xl bg-latte-600 text-white font-semibold text-xs">新增</button>
            </form>
            <div className="flex flex-wrap gap-2 pt-2">
              {paymentMethods.map((pm) => (
                <div key={pm.id} className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs border ${!pm.is_active ? 'opacity-50' : ''}`}>
                  <span>{pm.name}</span>
                  <button type="button" onClick={() => togglePaymentMethodActive(pm)} className="text-xs text-latte-500 hover:underline">
                    {pm.is_active ? '停用' : '啟用'}
                  </button>
                </div>
              ))}
            </div>
          </div>

          <button
            onClick={() => firebase.auth().signOut()}
            className="md:hidden w-full py-3 rounded-xl border border-rose-300 text-rose-600 font-semibold"
          >
            登出帳號
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
