        try {
          return window.localStorage.getItem(key) ?? fallback;
        } catch (e) {
          return fallback;
        }

      set(key, value) {
        try {
          window.localStorage.setItem(key, value);

    function getTodayStr() {
      try {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        }).formatToParts(new Date());
        const y = parts.find((p) => p.type === 'year')?.value;
        const m = parts.find((p) => p.type === 'month')?.value;
        const d = parts.find((p) => p.type === 'day')?.value;
        if (y && m && d) return `${y}-${m}-${d}`;
      } catch (e) {}
      const now = new Date();
      const taipei = new Date(now.getTime() + (8 * 60 + now.getTimezoneOffset()) * 60000);
      const yyyy = taipei.getFullYear();
      const mm = String(taipei.getMonth() + 1).padStart(2, '0');
      const dd = String(taipei.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getYearMonthStr(dateStr = getTodayStr()) {

    function evaluateMathExpression(expr) {
      try {
        const sanitized = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
        if (!sanitized) return 0;
        const cleaned = sanitized.replace(/[+\-*/.]+$/, '');
        if (!cleaned) return 0;
        const tokens = cleaned.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
        if (!tokens || tokens.length === 0) return 0;

        const stack = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prev = parseFloat(stack.pop() || '0');
            const next = parseFloat(tokens[i + 1] || '0');
            if (token === '*') stack.push(prev * next);
            else stack.push(next !== 0 ? prev / next : 0);
            i += 2;
          } else {
            stack.push(token);
            i += 1;
          }
        }

        let result = parseFloat(stack[0] || '0');
        for (let j = 1; j < stack.length; j += 2) {
          const op = stack[j];
          const val = parseFloat(stack[j + 1] || '0');
          if (op === '+') result += val;
          else if (op === '-') result -= val;
        }
        return isNaN(result) || !isFinite(result) ? 0 : result;
      } catch (e) {
        return 0;
      }
    }

    function parseFirebaseConfig(input) {
      try {
        const normalized = input.replace(/\u00A0/g, ' ').trim();
        if (normalized.startsWith('{')) return JSON.parse(normalized);
        const match = normalized.match(/\{[\s\S]*\}/);
        if (!match) return null;
        const jsonLike = match[0]
          .replace(/([{,]\s*)(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '$1"$3": ')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, '}');
        return JSON.parse(jsonLike);
      } catch (e) {
        return null;
      }
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-latte-50 dark:bg-neutral-900">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-6 max-w-md w-full shadow-xl border border-rose-200 dark:border-rose-800 text-center space-y-4">

            </div>
          );
        }
        return this.props.children;
      }

    function CustomModalDialog({ dialog, onClose }) {
      const [inputValue, setInputValue] = useState('');

      useEffect(() => {
        if (dialog?.defaultValue !== undefined) {
          setInputValue(dialog.defaultValue);
        } else {
          setInputValue('');
        }
      }, [dialog]);

      if (!dialog) return null;

      return (
        <div className="fixed inset-0 z-[999] bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-lg text-latte-900 dark:text-white">{dialog.title}</h3>
            {dialog.message && (
              <p className="text-sm text-latte-700 dark:text-neutral-300 whitespace-pre-line leading-relaxed">
                {dialog.message}
              </p>
            )}
            {dialog.mode === 'prompt' && (
              <input
                type="text"
                autoFocus
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 dark:bg-neutral-700 text-sm"

            )}
            <div className="flex justify-end gap-2 pt-2">

                  className="px-4 py-2 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-200 text-sm font-medium"
                >
                  取消
                </button>
              )}
              <button
                type="button"
                onClick={() => onClose(dialog.mode === 'prompt' ? inputValue : true)}
                className={`px-4 py-2 rounded-xl text-white text-sm font-semibold ${
                  dialog.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-latte-600 hover:bg-latte-700'
                }`}
              >
                {dialog.confirmText || '確定'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CustomDatePicker({ value, onChange, onClose, title = '選擇記帳日期' }) {
      const todayStr = getTodayStr();
      const initialDate = value || todayStr;
      const [viewYear, setViewYear] = useState(() => parseInt(initialDate.slice(0, 4), 10) || new Date().getFullYear());
      const [viewMonth, setViewMonth] = useState(() => parseInt(initialDate.slice(5, 7), 10) || (new Date().getMonth() + 1));

      function shiftDays(offset) {
        const currentToday = getTodayStr();
        const [y, m, day] = currentToday.split('-').map(Number);
        const d = new Date(Date.UTC(y, m - 1, day + offset));
        const yyyy = d.getUTCFullYear();
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(d.getUTCDate()).padStart(2, '0');
        onChange(`${yyyy}-${mm}-${dd}`);
        onClose();
      }

      function prevMonth() {
        if (viewMonth === 1) {
          setViewYear((y) => y - 1);
          setViewMonth(12);
        } else {
          setViewMonth((m) => m - 1);
        }
      }

      function nextMonth() {
        if (viewMonth === 12) {
          setViewYear((y) => y + 1);
          setViewMonth(1);
        } else {
          setViewMonth((m) => m + 1);
        }
      }

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(viewYear, viewMonth - 1, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dd = String(d).padStart(2, '0');
          const mm = String(viewMonth).padStart(2, '0');
          cells.push({ day: d, dateStr: `${viewYear}-${mm}-${dd}` });
        }
        return cells;
      }, [viewYear, viewMonth]);

      return (
        <div className="fixed inset-0 z-[60] bg-black/55 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-latte-50 dark:bg-neutral-800 rounded-3xl p-5 max-w-xs w-full space-y-3.5 shadow-2xl border border-latte-200 dark:border-neutral-700">

              <button
                type="button"
                onClick={onClose}
                className="w-7 h-7 rounded-full bg-latte-200/70 dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 text-xs flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="grid grid-cols-3 gap-1.5">
              {[
                { label: '前天', offset: -2 },
                { label: '昨天', offset: -1 },
                { label: '今天', offset: 0 },
              ].map((q) => (
                <button
                  key={q.label}
                  type="button"
                  onClick={() => shiftDays(q.offset)}
                  className="py-1.5 rounded-xl bg-white dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 text-xs font-semibold text-latte-800 dark:text-neutral-200 hover:bg-latte-200/70 transition"
                >
                  {q.label}
                </button>
              ))}
            </div>

            <div className="flex items-center justify-between bg-white dark:bg-neutral-700/70 px-3 py-2 rounded-2xl border border-latte-200/80 dark:border-neutral-600">
              <button
                type="button"
                onClick={prevMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ‹
              </button>
              <span className="font-bold text-sm text-latte-900 dark:text-white">
                {viewYear} 年 {String(viewMonth).padStart(2, '0')} 月
              </span>
              <button
                type="button"
                onClick={nextMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ›
              </button>
            </div>

            <div className="bg-white dark:bg-neutral-900/50 p-2.5 rounded-2xl border border-latte-200/70 dark:border-neutral-700">
              <div className="grid grid-cols-7 text-center text-[11px] font-bold text-latte-500 dark:text-neutral-400 mb-1.5">
                {['日', '一', '二', '三', '四', '五', '六'].map((w) => (
                  <div key={w}>{w}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 gap-1 text-center">
                {calendarCells.map((cell, idx) => {
                  if (!cell) return <div key={`empty-${idx}`} className="h-8" />;
                  const isSelected = cell.dateStr === initialDate;
                  const isToday = cell.dateStr === todayStr;
                  return (
                    <button
                      key={cell.dateStr}
                      type="button"
                      onClick={() => {
                        onChange(cell.dateStr);
                        onClose();
                      }}
                      className={`h-8 rounded-xl text-xs font-semibold transition flex items-center justify-center ${
                        isSelected
                          ? 'bg-latte-600 text-white shadow-xs font-bold'
                          : isToday
                          ? 'bg-latte-200/80 dark:bg-neutral-700 text-latte-900 dark:text-white ring-1 ring-latte-500'
                          : 'text-latte-800 dark:text-neutral-200 hover:bg-latte-100 dark:hover:bg-neutral-700'
                      }`}
                    >
                      {cell.day}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TransactionModal({ isDemoMode, onDemoSaveTx, onDemoReorderCategories, user, profile, activeLedger, currencySymbol = 'NT$', categories, paymentMethods, editingTx, showToast, onClose }) {
      const [type, setType] = useState(editingTx?.type || 'expense');
      const [amountStr, setAmountStr] = useState(editingTx?.amount ? String(editingTx.amount) : '0');
      const [date, setDate] = useState(() => editingTx?.date || getTodayStr());
      const [itemName, setItemName] = useState(editingTx?.item_name || '');
      const [note, setNote] = useState(editingTx?.note || '');

      useEffect(() => {
        if (!editingTx) {
          setDate(getTodayStr());
        }
      }, [editingTx]);

      const safeCategories = useMemo(() => {
        const list = Array.isArray(categories) ? categories.filter((c) => !c.is_archived) : [];
        if (list.length > 0) return list;
        const fallback = [];
        DEFAULT_CATEGORIES.forEach((cat) => {
          cat.subs.forEach((subItem, idx) => {
            const subName = typeof subItem === 'string' ? subItem : subItem.name;
            const subEmoji = typeof subItem === 'string' ? cat.emoji : (subItem.emoji || cat.emoji);
            fallback.push({
              id: `default_${cat.type}_${cat.major}_${idx}`,
              type: cat.type,
              emoji: subEmoji,
              major: cat.major,
              sub: subName,
            });
          });
        });
        return fallback;
      }, [categories]);

      const filteredCats = useMemo(() => safeCategories.filter((c) => c.type === type), [safeCategories, type]);
      const majors = useMemo(() => [...new Set(filteredCats.map((c) => c.major))], [filteredCats]);
      const majorsKey = majors.join('|');

      const [selectedMajor, setSelectedMajor] = useState(editingTx?.major_category || '');
      const currentMajorSubs = useMemo(() => filteredCats.filter((c) => c.major === selectedMajor), [filteredCats, selectedMajor]);
      const [selectedSubCat, setSelectedSubCat] = useState(
        editingTx ? { major: editingTx.major_category, sub: editingTx.sub_category, emoji: '📝' } : null
      );

      const activePms = useMemo(() => {
        const list = Array.isArray(paymentMethods) ? paymentMethods.filter((p) => p.is_active) : [];
        if (list.length > 0) return list;
        return DEFAULT_PAYMENT_METHODS.map((name, i) => ({ id: `default_pm_${i}`, name, is_active: true }));
      }, [paymentMethods]);

      const [paymentMethod, setPaymentMethod] = useState(editingTx?.payment_method || '');
      const [saving, setSaving] = useState(false);

      const [dateModalOpen, setDateModalOpen] = useState(false);
      const [pmModalOpen, setPmModalOpen] = useState(false);

      const [orderedMajors, setOrderedMajors] = useState([]);
      const orderedMajorsRef = useRef([]);
      const [draggingMajor, setDraggingMajor] = useState(null);
      const majorPressTimerRef = useRef(null);

      const [orderedSubs, setOrderedSubs] = useState([]);
      const orderedSubsRef = useRef([]);
      const [draggingSubId, setDraggingSubId] = useState(null);
      const subPressTimerRef = useRef(null);

      useEffect(() => {
        setOrderedMajors(majors);
        orderedMajorsRef.current = majors;
      }, [majorsKey]);

      const currentMajorSubsKey = currentMajorSubs.map((c) => `${c.id || c.sub}:${c.sort_order ?? ''}`).join('|');
      useEffect(() => {
        setOrderedSubs(currentMajorSubs);
        orderedSubsRef.current = currentMajorSubs;
      }, [currentMajorSubsKey]);

      function moveMajorItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedMajors((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedMajorsRef.current = next;
          return next;
        });
      }

      async function persistMajorOrder(newMajorOrder) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        if (isDemoMode) {
          onDemoReorderCategories?.(type, newMajorOrder, null);
          showToast('已更新大分類順序');
          return;
        }
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          let orderIdx = 0;
          newMajorOrder.forEach((m) => {
            const groupItems = categories.filter((c) => c.type === type && c.major === m);
            groupItems.forEach((item) => {
              if (item.id && !String(item.id).startsWith('default_')) {
                batch.update(db.collection('categories').doc(item.id), { sort_order: orderIdx++ });
              }
            });
          });
          await batch.commit();
          showToast('已更新大分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleMajorPointerDown(m) {
        if (majorPressTimerRef.current) clearTimeout(majorPressTimerRef.current);
        majorPressTimerRef.current = setTimeout(() => {
          setDraggingMajor(m);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 1000);
      }

      function handleMajorTouchMove(e) {
        if (!draggingMajor) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const btnEl = target?.closest('[data-major-name]');
        const overMajor = btnEl?.getAttribute('data-major-name');
        if (overMajor && overMajor !== draggingMajor) {
          const fromIdx = orderedMajorsRef.current.indexOf(draggingMajor);
          const toIdx = orderedMajorsRef.current.indexOf(overMajor);
          moveMajorItem(fromIdx, toIdx);
        }
      }

      function handleMajorPointerUp() {
        if (majorPressTimerRef.current) {
          clearTimeout(majorPressTimerRef.current);
          majorPressTimerRef.current = null;
        }
        if (draggingMajor) {
          setDraggingMajor(null);
          persistMajorOrder(orderedMajorsRef.current);
        }
      }

      function moveSubItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedSubs((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedSubsRef.current = next;
          return next;
        });
      }

      async function persistSubOrder(newSubList) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        if (isDemoMode) {
          onDemoReorderCategories?.(type, null, newSubList);
          showToast('已更新子分類順序');
          return;
        }
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          const baseOrders = newSubList.map((c) => Number(c.sort_order) || 0);
          const minOrder = baseOrders.length > 0 ? Math.min(...baseOrders) : 0;
          newSubList.forEach((item, idx) => {
            if (item.id && !String(item.id).startsWith('default_')) {
              batch.update(db.collection('categories').doc(item.id), { sort_order: minOrder + idx });
            }
          });
          await batch.commit();
          showToast('已更新子分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleSubPointerDown(subKey) {
        if (subPressTimerRef.current) clearTimeout(subPressTimerRef.current);
        subPressTimerRef.current = setTimeout(() => {
          setDraggingSubId(subKey);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 1000);
      }

      function handleSubTouchMove(e) {
        if (!draggingSubId) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const btnEl = target?.closest('[data-sub-key]');
        const overKey = btnEl?.getAttribute('data-sub-key');
        if (overKey && overKey !== draggingSubId) {
          const fromIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === draggingSubId);
          const toIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === overKey);
          moveSubItem(fromIdx, toIdx);
        }
      }

      function handleSubPointerUp() {
        if (subPressTimerRef.current) {
          clearTimeout(subPressTimerRef.current);
          subPressTimerRef.current = null;
        }
        if (draggingSubId) {
          setDraggingSubId(null);
          persistSubOrder(orderedSubsRef.current);
        }
      }

      useEffect(() => {
        if (majors.length > 0 && !majors.includes(selectedMajor)) {
          const nextMajor = majors[0];
          setSelectedMajor(nextMajor);
          const firstSub = filteredCats.find((c) => c.major === nextMajor);
          if (firstSub) {
            setSelectedSubCat({ major: firstSub.major, sub: firstSub.sub, emoji: firstSub.emoji || '📝' });
          }
        }
      }, [type, majorsKey]);

      useEffect(() => {
        if (activePms.length > 0 && !activePms.some((p) => p.name === paymentMethod)) {
          const defaultCash = activePms.find((p) => p.name === '現金');
          setPaymentMethod(defaultCash ? defaultCash.name : activePms[0].name);
        }
      }, [activePms.length]);

      function handleSelectMajor(m) {
        setSelectedMajor(m);
        const firstSub = filteredCats.find((c) => c.major === m);
        if (firstSub) {
          setSelectedSubCat({ major: firstSub.major, sub: firstSub.sub, emoji: firstSub.emoji || '📝' });
        }
      }

      function handleKeyPress(key) {
        if (key === 'AC') {
          setAmountStr('0');
          return;
        }
        if (key === 'backspace') {
          setAmountStr((prev) => (prev.length > 1 ? prev.slice(0, -1) : '0'));
          return;
        }
        setAmountStr((prev) => {
          if (key === '.') {
            if (prev.includes('.')) return prev;
            return prev + '.';
          }
          if (prev === '0') {
            return key === '00' ? '0' : key;
          }
          return prev + key;
        });
      }

      async function handleSubmit() {
        const finalAmount = evaluateMathExpression(amountStr);
        if (isNaN(finalAmount) || finalAmount <= 0) {
          showToast('請輸入大於 0 的有效金額');
          return;
        }
        if (!selectedSubCat || !selectedSubCat.major || !selectedSubCat.sub) {
          showToast('請先選擇分類');
          return;
        }
        if (!date) {
          showToast('請選擇日期');
          return;
        }
        if (!paymentMethod) {
          showToast('請先選擇付款方式');
          return;
        }

        const payload = {
          ledger_id: activeLedger.id,
          type,
          amount: finalAmount,
          major_category: selectedSubCat.major,
          sub_category: selectedSubCat.sub,
          date,
          item_name: itemName.trim(),
          note: note.trim(),
          payment_method: paymentMethod,
          payer_id: user.uid,
          payer_nickname: profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者'),
          created_ms: editingTx?.created_ms || Date.now(),
        };

        if (isDemoMode) {
          onDemoSaveTx(payload, editingTx?.id);
          showToast(editingTx ? '已更新交易紀錄' : '已新增交易紀錄');
          onClose();
          return;
        }

        setSaving(true);
        const db = firebase.firestore();
        try {
          if (editingTx) {
            await db.collection('transactions').doc(editingTx.id).update({
              type,
              amount: finalAmount,
              major_category: selectedSubCat.major,
              sub_category: selectedSubCat.sub,
              date,
              item_name: itemName.trim(),
              note: note.trim(),
              payment_method: paymentMethod,
            });
            showToast('已更新交易紀錄');
          } else {
            await db.collection('transactions').add(payload);
            showToast('已新增交易紀錄');
          }
          onClose();
        } catch (err) {
          showToast('儲存失敗：' + err.message);
        } finally {
          setSaving(false);
        }
      }

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl md:rounded-3xl max-w-lg md:max-w-2xl w-full h-[645px] md:h-auto max-h-[95vh] p-4 sm:p-5 md:p-6 flex flex-col justify-between gap-2.5 md:gap-4 shadow-2xl overflow-hidden">
            <div className="flex justify-between items-center shrink-0">
              <span className="text-base md:text-lg font-bold text-latte-800 dark:text-latte-100">{editingTx ? '編輯收支紀錄' : '新增收支紀錄'}</span>
              <button type="button" onClick={onClose} className="w-8 h-8 rounded-full text-neutral-400 hover:bg-latte-100 dark:hover:bg-neutral-800 flex items-center justify-center shrink-0">✕</button>
            </div>

            <div className="bg-latte-50 dark:bg-neutral-800/50 p-2.5 md:p-3.5 rounded-2xl space-y-2 shrink-0 border border-latte-200/60 dark:border-neutral-700/60">
              <div className="flex items-center justify-between px-0.5">
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold text-latte-600 dark:text-neutral-400">選擇記帳分類</span>
                  <span className="text-[10px] text-latte-400 dark:text-neutral-500">（長按可調順序）</span>
                </div>
                {selectedSubCat && (
                  <span className="text-xs font-bold text-latte-900 dark:text-white bg-white dark:bg-neutral-700 px-3 py-0.5 rounded-full shadow-2xs border border-latte-200 dark:border-neutral-600 truncate max-w-[190px]">
                    已選：{selectedSubCat.emoji} {selectedSubCat.major} - {selectedSubCat.sub}
                  </span>
                )}
              </div>

              <div
                onTouchMove={handleMajorTouchMove}
                onTouchEnd={handleMajorPointerUp}
                onMouseUp={handleMajorPointerUp}
                className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 px-0.5 select-none"
              >
                {orderedMajors.map((m) => {
                  const isDragging = draggingMajor === m;
                  return (
                    <button
                      key={m}
                      type="button"
                      data-major-name={m}
                      onTouchStart={() => handleMajorPointerDown(m)}
                      onMouseDown={() => handleMajorPointerDown(m)}
                      onMouseEnter={() => {
                        if (draggingMajor && draggingMajor !== m) {
                          const fromIdx = orderedMajorsRef.current.indexOf(draggingMajor);
                          const toIdx = orderedMajorsRef.current.indexOf(m);
                          moveMajorItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingMajor) handleSelectMajor(m);
                      }}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shrink-0 transition cursor-grab active:cursor-grabbing ${
                        isDragging
                          ? 'scale-105 bg-latte-600 text-white shadow-md ring-2 ring-latte-400 z-10'
                          : selectedMajor === m
                          ? 'bg-latte-800 text-white shadow-2xs dark:bg-neutral-100 dark:text-neutral-900'
                          : 'bg-white dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 border border-latte-200 dark:border-neutral-600 hover:bg-latte-100'
                      }`}
                    >
                      {m}
                    </button>
                  );
                })}
              </div>

              <div
                onTouchMove={handleSubTouchMove}
                onTouchEnd={handleSubPointerUp}
                onMouseUp={handleSubPointerUp}
                className="h-[88px] md:h-[112px] overflow-y-auto no-scrollbar grid grid-cols-3 md:grid-cols-4 content-start gap-2 p-1.5 bg-white/70 dark:bg-neutral-900/40 rounded-xl border border-latte-200/60 dark:border-neutral-700/60 select-none"
              >
                {orderedSubs.map((c) => {
                  const subKey = c.id || c.sub;
                  const isSelected = selectedSubCat?.major === c.major && selectedSubCat?.sub === c.sub;
                  const isDragging = draggingSubId === subKey;
                  return (
                    <button
                      key={subKey}
                      type="button"
                      data-sub-key={subKey}
                      onTouchStart={() => handleSubPointerDown(subKey)}
                      onMouseDown={() => handleSubPointerDown(subKey)}
                      onMouseEnter={() => {
                        if (draggingSubId && draggingSubId !== subKey) {
                          const fromIdx = orderedSubsRef.current.findIndex((item) => (item.id || item.sub) === draggingSubId);
                          const toIdx = orderedSubsRef.current.findIndex((item) => (item.id || item.sub) === subKey);
                          moveSubItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingSubId) setSelectedSubCat({ major: c.major, sub: c.sub, emoji: c.emoji || '📝' });
                      }}
                      className={`flex items-center gap-1.5 p-2 rounded-xl border transition text-left cursor-grab active:cursor-grabbing ${
                        isDragging
                          ? 'scale-105 border-latte-600 bg-latte-100 dark:bg-neutral-600 shadow-md z-10'
                          : isSelected
                          ? 'border-latte-600 bg-white dark:bg-neutral-700 ring-2 ring-latte-600/30 font-bold'
                          : 'border-latte-200 dark:border-neutral-700 bg-white/80 dark:bg-neutral-800 hover:bg-white'
                      }`}
                    >
                      <span className="text-base shrink-0">{c.emoji || '📝'}</span>
                      <span className="text-xs text-latte-800 dark:text-neutral-200 truncate">{c.sub}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2.5 md:gap-3 shrink-0">
              <input
                type="text"
                value={itemName}
                onChange={(e) => setItemName(e.target.value)}
                placeholder="項目名稱 (選填)"
                className="p-2 md:p-2.5 rounded-xl border border-latte-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-xs md:text-sm"
              />
              <input
                type="text"
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="備註 (選填)"
                className="p-2 md:p-2.5 rounded-xl border border-latte-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-xs md:text-sm"
              />
            </div>

            <div className="md:hidden flex flex-col gap-2.5 flex-1 min-h-0">
              <div className="bg-latte-100/70 dark:bg-neutral-800 px-3.5 py-2 rounded-2xl flex items-center justify-between border border-latte-200 dark:border-neutral-700 shrink-0">
                <div className="min-w-0 flex items-baseline gap-2">
                  <span className="text-[11px] text-latte-500 shrink-0">金額</span>
                  <div className="text-xl font-extrabold text-latte-900 dark:text-white truncate tracking-tight">
                    {currencySymbol} {amountStr}
                  </div>
                </div>
                <div className="flex bg-white dark:bg-neutral-700 p-0.5 rounded-xl border border-latte-200 dark:border-neutral-600 shrink-0">
                  <button
                    type="button"
                    onClick={() => setType('expense')}
                    className={`px-3.5 py-1.5 rounded-lg font-bold text-xs transition ${type === 'expense' ? 'bg-rose-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                  >
                    支出
                  </button>
                  <button
                    type="button"
                    onClick={() => setType('income')}
                    className={`px-3.5 py-1.5 rounded-lg font-bold text-xs transition ${type === 'income' ? 'bg-emerald-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                  >
                    收入
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-4 grid-rows-4 gap-1.5 flex-1 min-h-[218px]">
                {[
                  ['1', '2', '3'],
                  ['4', '5', '6'],
                  ['7', '8', '9'],
                  ['.', '0', '00']
                ].map((row, rIdx) => (
                  <React.Fragment key={rIdx}>
                    {row.map((btn) => (
                      <button
                        key={btn}
                        type="button"
                        onClick={() => handleKeyPress(btn)}
                        className="h-full w-full rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-200 dark:hover:bg-neutral-700 text-latte-900 dark:text-white font-bold text-lg shadow-2xs border border-latte-200/80 dark:border-neutral-700 transition active:scale-95 flex items-center justify-center touch-manipulation"
                      >
                        {btn}
                      </button>
                    ))}
                    {rIdx === 0 && (
                      <button
                        type="button"
                        onClick={() => setPmModalOpen(true)}
                        className="h-full w-full px-1 rounded-xl bg-latte-200/80 dark:bg-neutral-700 text-latte-800 dark:text-neutral-100 font-bold text-xs shadow-2xs transition active:scale-95 flex flex-col items-center justify-center leading-tight border border-latte-300 dark:border-neutral-600 touch-manipulation"
                      >
                        <span>付款方式</span>
                        <span className="text-[10px] font-normal truncate max-w-full mt-0.5">{paymentMethod || '現金'}</span>
                      </button>
                    )}
                    {rIdx === 1 && (
                      <div className="h-full w-full grid grid-cols-2 gap-1.5">
                        <button
                          type="button"
                          onClick={() => handleKeyPress('backspace')}
                          className="h-full w-full rounded-xl bg-latte-100 dark:bg-neutral-800 text-latte-800 dark:text-neutral-200 font-bold text-sm shadow-2xs border border-latte-200 dark:border-neutral-700 transition active:scale-95 flex items-center justify-center touch-manipulation"
                          title="倒退刪除"
                        >
                          ⌫
                        </button>
                        <button
                          type="button"
                          onClick={() => handleKeyPress('AC')}
                          className="h-full w-full rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 font-bold text-xs border border-amber-200 dark:border-amber-800 shadow-2xs transition active:scale-95 flex items-center justify-center touch-manipulation"
                          title="全部清除"
                        >
                          AC
                        </button>
                      </div>
                    )}
                    {rIdx === 2 && (
                      <button
                        type="button"
                        onClick={() => setDateModalOpen(true)}
                        className="h-full w-full px-1 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-2xs transition active:scale-95 flex flex-col items-center justify-center leading-tight touch-manipulation"
                      >
                        <span>日期</span>
                        <span className="text-[10px] font-normal opacity-95 truncate max-w-full mt-0.5">{date}</span>
                      </button>
                    )}
                    {rIdx === 3 && (
                      <button
                        type="button"
                        onClick={() => handleSubmit()}
                        disabled={saving}
                        className="h-full w-full rounded-xl bg-latte-700 hover:bg-latte-800 text-white font-bold text-sm shadow-md transition active:scale-95 flex items-center justify-center touch-manipulation"
                      >
                        {saving ? '儲存中' : '確定'}

    function StatsView({ activeLedger, currencySymbol = 'NT$', selectedMonth, setSelectedMonth, allTransactions }) {
      const [statType, setStatType] = useState('expense');
      const [periodMode, setPeriodMode] = useState('month');
      const [selectedYear, setSelectedYear] = useState(() => (selectedMonth ? selectedMonth.slice(0, 4) : getTodayStr().slice(0, 4)));

      useEffect(() => {
        if (selectedMonth) {
          setSelectedYear(selectedMonth.slice(0, 4));
        }
      }, [selectedMonth]);

      const availableYears = useMemo(() => {
        const years = new Set([getTodayStr().slice(0, 4), selectedMonth.slice(0, 4)]);
        (allTransactions || []).forEach((t) => {
          if (t.date && t.date.length >= 4) years.add(t.date.slice(0, 4));
        });
        return Array.from(years).sort((a, b) => b.localeCompare(a));
      }, [allTransactions, selectedMonth]);

      const periodTx = useMemo(() => {
        return (allTransactions || []).filter((t) => {
          if (!t.date) return false;
          if (periodMode === 'year') return t.date.startsWith(selectedYear);
          return t.date.startsWith(selectedMonth);
        });
      }, [allTransactions, periodMode, selectedYear, selectedMonth]);

      const yearSummary = useMemo(() => {
        let income = 0;
        let expense = 0;
        periodTx.forEach((t) => {
          const amt = Number(t.amount) || 0;
          if (t.type === 'income') income += amt;
          else expense += amt;
        });
        return { income, expense, balance: income - expense };
      }, [periodTx]);

      const filteredTx = useMemo(() => {
        return periodTx.filter((t) => t.type === statType);
      }, [periodTx, statType]);

      const totalAmount = useMemo(() => {
        return filteredTx.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
      }, [filteredTx]);

      const byMajor = useMemo(() => {
        const map = {};
        filteredTx.forEach((t) => {
          map[t.major_category] = (map[t.major_category] || 0) + (Number(t.amount) || 0);
        });
        return Object.entries(map)
          .map(([name, amount]) => ({
            name,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [filteredTx, totalAmount]);

      const byMember = useMemo(() => {
        if (activeLedger?.type !== 'couple') return [];
        const map = {};
        filteredTx.forEach((t) => {
          const nick = t.payer_nickname || '成員';
          map[nick] = (map[nick] || 0) + (Number(t.amount) || 0);
        });
        return Object.entries(map)
          .map(([nickname, amount]) => ({
            nickname,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [filteredTx, totalAmount, activeLedger]);

      return (

              {periodMode === 'month' ? (

                  type="month"

              ) : (
                <select

                >
                  {availableYears.map((y) => (
                    <option key={y} value={y}>{y} 年</option>

            <div className="flex bg-white dark:bg-neutral-800 p-1 rounded-xl border border-latte-200 dark:border-neutral-700">
              <button

              <button

            </div>
          </div>

          {periodMode === 'year' && (
            <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
              <div className="p-3.5 rounded-2xl bg-white dark:bg-neutral-800 border border-latte-200/80 dark:border-neutral-700 shadow-2xs">
                <div className="text-[11px] font-medium text-latte-500 dark:text-neutral-400">{selectedYear} 年總收入</div>

                </div>
              </div>
            </div>
          )}

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <div className="flex items-center justify-between border-b border-latte-100 dark:border-neutral-700 pb-3">
              <span className="font-bold text-sm sm:text-base">
                {periodMode === 'year'
                  ? (statType === 'expense' ? `${selectedYear} 年總支出` : `${selectedYear} 年總收入`)
                  : (statType === 'expense' ? '本月總支出' : '本月總收入')}
              </span>
              <span className={`font-extrabold text-lg ${statType === 'expense' ? 'text-rose-600' : 'text-emerald-600'}`}>
                {currencySymbol}{totalAmount.toLocaleString()}
              </span>
            </div>

            {byMajor.length === 0 ? (
              <div className="py-6 text-center text-xs text-latte-500">
                {periodMode === 'year' ? '本年度' : '本月'}尚無{statType === 'expense' ? '支出' : '收入'}統計資料
              </div>
            ) : (
              <div className="space-y-3">
                {byMajor.map((item) => (
                  <div key={item.name} className="space-y-1.5 text-xs sm:text-sm">
                    <div className="flex justify-between font-semibold">
                      <span>{item.name} ({item.pct}%)</span>
                      <span>{currencySymbol}{item.amount.toLocaleString()}</span>
                    </div>
                    <div className="w-full h-2.5 rounded-full bg-latte-100 dark:bg-neutral-700 overflow-hidden">
                      <div
                        className={`h-full ${statType === 'expense' ? 'bg-rose-500' : 'bg-emerald-500'}`}
                        style={{ width: `${item.pct}%` }}
                      ></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {activeLedger?.type === 'couple' && byMember.length > 0 && (
            <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-3">
              <h3 className="font-bold text-sm sm:text-base">共同帳本成員{statType === 'expense' ? '付款' : '入帳'}佔比</h3>
              {byMember.map((m) => (
                <div key={m.nickname} className="space-y-1.5 text-xs sm:text-sm">
                  <div className="flex justify-between font-semibold">
                    <span>{m.nickname} ({m.pct}%)</span>

                  </div>
                  <div className="w-full h-2.5 rounded-full bg-latte-100 dark:bg-neutral-700 overflow-hidden">
                    <div className="h-full bg-latte-600" style={{ width: `${m.pct}%` }}></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function SwipeableTransactionItem({ tx, activeLedger, currencySymbol, categoryEmoji, onEditClick, onDeleteClick }) {
      const [offsetX, setOffsetX] = useState(0);
      const startXRef = useRef(0);
      const isSwipingRef = useRef(false);

      function handleTouchStart(e) {
        startXRef.current = e.touches[0].clientX;
        isSwipingRef.current = true;
      }

      function handleTouchMove(e) {
        if (!isSwipingRef.current) return;
        const diff = e.touches[0].clientX - startXRef.current;
        if (diff < 0) {
          setOffsetX(Math.max(diff, -120));
        } else {
          setOffsetX(0);
        }
      }

      function handleTouchEnd() {
        isSwipingRef.current = false;
        if (offsetX < -45) {
          setOffsetX(-116);
        } else {
          setOffsetX(0);
        }
      }

      return (
        <div className="relative overflow-hidden bg-latte-100 dark:bg-neutral-900">
          <div className="absolute inset-y-0 right-0 flex items-center">
            <button
              type="button"
              onClick={() => { setOffsetX(0); onEditClick(tx); }}
              className="h-full px-4 bg-latte-600 text-white text-xs font-semibold flex items-center justify-center"
            >
              編輯
            </button>
            <button
              type="button"
              onClick={() => { setOffsetX(0); onDeleteClick(tx); }}
              className="h-full px-4 bg-rose-600 text-white text-xs font-semibold flex items-center justify-center"
            >
              刪除
            </button>
          </div>

          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onClick={() => { if (offsetX !== 0) setOffsetX(0); }}
            style={{ transform: `translateX(${offsetX}px)` }}
            className="relative bg-white dark:bg-neutral-800 px-5 py-4 flex items-center justify-between gap-3 transition-transform duration-150 group"
          >
            <div className="flex items-center gap-3.5 min-w-0">
              <div className="w-11 h-11 rounded-2xl bg-latte-100 dark:bg-neutral-700 flex items-center justify-center text-xl shrink-0">
                {categoryEmoji || '📝'}
              </div>
              <div className="space-y-1 min-w-0">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="font-bold text-[16px] leading-snug text-latte-900 dark:text-white">
                    {tx.sub_category}
                  </span>
                  {tx.item_name && (
                    <span className="text-[16px] leading-snug text-latte-700 dark:text-neutral-300 truncate">
                      · {tx.item_name}
                    </span>
                  )}
                  {activeLedger?.type === 'couple' && (
                    <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300">
                      {tx.payer_nickname}
                    </span>
                  )}
                </div>
                <div className="text-xs text-latte-500 dark:text-neutral-400 flex gap-2.5 flex-wrap">
                  <span>{tx.payment_method}</span>
                  {tx.note && <span className="truncate">備註：{tx.note}</span>}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <span className={`font-bold text-[16px] leading-snug ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                {tx.type === 'income' ? `+${currencySymbol}${Number(tx.amount).toLocaleString()}` : `-${currencySymbol}${Number(tx.amount).toLocaleString()}`}
              </span>
              <div className="hidden md:flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                <button type="button" onClick={() => onEditClick(tx)} className="text-xs text-latte-600 dark:text-neutral-300 hover:underline px-1">編輯</button>
                <button type="button" onClick={() => onDeleteClick(tx)} className="text-xs text-rose-600 hover:underline px-1">刪除</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function HomeView({ activeLedger, currencySymbol, selectedMonth, setSelectedMonth, customDateRange, setCustomDateRange, summary, transactions, categories, onAddClick, onEditClick, onDeleteClick }) {
      const [showCustom, setShowCustom] = useState(false);
      const [rangePickerTarget, setRangePickerTarget] = useState(null); // 'start' | 'end' | null

      const emojiMap = useMemo(() => {
        const map = {};
        (categories || []).forEach((c) => {
          map[`${c.type}::${c.major}::${c.sub}`] = c.emoji || '📝';
        });
        DEFAULT_CATEGORIES.forEach((cat) => {
          cat.subs.forEach((subItem) => {
            const subName = typeof subItem === 'string' ? subItem : subItem.name;
            const subEmoji = typeof subItem === 'string' ? cat.emoji : (subItem.emoji || cat.emoji);
            const key = `${cat.type}::${cat.major}::${subName}`;
            if (!map[key]) map[key] = subEmoji;
          });
        });
        return map;
      }, [categories]);

      const groupedTransactions = useMemo(() => {
        const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
        const groups = {};
        transactions.forEach((tx) => {
          const d = tx.date || '未知日期';
          if (!groups[d]) {
            let weekLabel = '';
            const parsedDate = new Date(d + 'T00:00:00');
            if (!isNaN(parsedDate.getTime())) {
              weekLabel = weekDays[parsedDate.getDay()];
            }
            groups[d] = { date: d, weekLabel, income: 0, expense: 0, items: [] };
          }
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'income') groups[d].income += amt;
          else groups[d].expense += amt;
          groups[d].items.push(tx);
        });
        return Object.values(groups)
          .sort((a, b) => b.date.localeCompare(a.date))
          .map((group) => ({
            ...group,
            items: [...group.items].sort((a, b) => {
              if (a.type !== b.type) {
                return a.type === 'income' ? -1 : 1;
              }
              return (b.created_ms || 0) - (a.created_ms || 0);
            }),
          }));
      }, [transactions]);

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-2.5">
            <div className="flex items-center gap-2">
              <input
                type="month"
                value={selectedMonth}
                onChange={(e) => {
                  setSelectedMonth(e.target.value);
                  setCustomDateRange({ ...customDateRange, enabled: false });
                  setShowCustom(false);

                className="px-3 py-2 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs sm:text-sm font-semibold shadow-2xs"
              />

                onClick={() => {
                  const next = !showCustom;
                  setShowCustom(next);
                  if (!next) setCustomDateRange({ ...customDateRange, enabled: false });
                }}
                className={`px-3 py-2 rounded-xl text-xs font-medium border transition ${
                  customDateRange.enabled
                    ? 'bg-latte-600 text-white border-latte-600'
                    : 'bg-white dark:bg-neutral-800 border-latte-200 dark:border-neutral-700 text-latte-700 dark:text-neutral-300'
                }`}
              >
                自訂區間

            </div>

            <button
              type="button"
              onClick={onAddClick}
              className="hidden md:inline-flex px-4 py-2.5 rounded-xl bg-latte-600 hover:bg-latte-700 text-white font-semibold text-sm shadow-xs transition"
            >

            </button>
          </div>

          {showCustom && (
            <div className="p-2.5 sm:p-3 rounded-2xl bg-latte-100/80 dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 flex items-center gap-1.5 sm:gap-2 flex-nowrap overflow-x-auto no-scrollbar text-xs">
              <button
                type="button"
                onClick={() => setRangePickerTarget('start')}

                <div className="text-[11px] font-medium text-latte-500 dark:text-neutral-400">本月收入</div>
                <div className="text-sm sm:text-base font-bold mt-0.5 text-emerald-600 dark:text-emerald-400 tracking-tight">
                  +{currencySymbol}{summary.income.toLocaleString()}
                </div>
              </div>
              <div className="p-3 sm:p-3.5 rounded-2xl bg-white dark:bg-neutral-800 border border-latte-200/80 dark:border-neutral-700 shadow-2xs">
                <div className="text-[11px] font-medium text-latte-500 dark:text-neutral-400">本月支出</div>
                <div className="text-sm sm:text-base font-bold mt-0.5 text-rose-600 dark:text-rose-400 tracking-tight">
                  -{currencySymbol}{summary.expense.toLocaleString()}
                </div>
              </div>
            </div>
            {(() => {
              const hasIncome = summary.income > 0;
              const remainingPct = hasIncome ? Math.round((summary.balance / summary.income) * 100) : (summary.balance < 0 ? 0 : 0);
              const clampedWidth = Math.max(0, Math.min(remainingPct, 100));

              let statusZone = 'green';
              if (!hasIncome && summary.expense > 0) {
                statusZone = 'red';
              } else if (remainingPct <= 20) {
                statusZone = 'red';
              } else if (remainingPct <= 45) {
                statusZone = 'orange';
              } else {
                statusZone = 'green';
              }

              const badgeColorClass =
                statusZone === 'red'
                  ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'
                  : statusZone === 'orange'
                  ? 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300'
                  : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300';

              const amountColorClass =
                statusZone === 'red'
                  ? 'text-rose-600 dark:text-rose-400'
                  : statusZone === 'orange'
                  ? 'text-orange-500 dark:text-orange-400'
                  : 'text-emerald-600 dark:text-emerald-400';

              const barColorClass =
                statusZone === 'red'
                  ? 'bg-rose-500'
                  : statusZone === 'orange'
                  ? 'bg-orange-500'
                  : 'bg-emerald-500';

              return (
                <div className="px-4 py-3.5 rounded-2xl bg-white dark:bg-neutral-800 border border-latte-200/80 dark:border-neutral-700 shadow-2xs space-y-2.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-medium text-latte-600 dark:text-neutral-400">本月結餘</span>
                      {(summary.income > 0 || summary.expense > 0) && (
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${badgeColorClass}`}>
                          {hasIncome ? `剩餘 ${remainingPct}%` : '尚無收入（已超支）'}
                        </span>
                      )}
                    </div>
                    <span className={`text-sm sm:text-base font-bold tracking-tight ${summary.income === 0 && summary.expense === 0 ? 'text-emerald-600 dark:text-emerald-400' : amountColorClass}`}>
                      {summary.balance >= 0 ? `+${currencySymbol}${summary.balance.toLocaleString()}` : `-${currencySymbol}${Math.abs(summary.balance).toLocaleString()}`}
                    </span>
                  </div>
                  <div className="w-full h-2.5 rounded-full bg-latte-100 dark:bg-neutral-700 overflow-hidden">
                    {summary.income === 0 && summary.expense === 0 ? (
                      <div className="h-full w-0" />
                    ) : (
                      <div
                        className={`h-full ${barColorClass} transition-all duration-300 rounded-full`}
                        style={{ width: `${clampedWidth}%` }}
                        title={`本月剩餘比例 ${remainingPct}%`}
                      />
                    )}
                  </div>
                </div>
              );
            })()}
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl border border-latte-200/80 dark:border-neutral-700 overflow-hidden shadow-2xs">
            <div className="px-5 py-3.5 border-b border-latte-100 dark:border-neutral-700/80 font-semibold text-sm flex justify-between">
              <span>收支明細（共 {transactions.length} 筆）</span>
            </div>
            {transactions.length === 0 ? (
              <div className="p-8 text-center text-sm text-latte-500 dark:text-neutral-400">此期間尚無收支紀錄</div>
            ) : (
              <div>
                {groupedTransactions.map((group) => (
                  <div key={group.date}>
                    <div className="px-5 py-2.5 bg-latte-100/80 dark:bg-neutral-700/60 border-y border-latte-200/60 dark:border-neutral-700 flex items-center justify-between text-xs sm:text-sm font-semibold text-latte-700 dark:text-neutral-200">
                      <div className="flex items-center gap-2">
                        <span>{group.date}</span>
                        {group.weekLabel && <span className="text-latte-500 dark:text-neutral-400 font-normal">{group.weekLabel}</span>}
                      </div>
                      <div className="flex items-center gap-3">
                        {group.income > 0 && (
                          <span className="text-emerald-600 dark:text-emerald-400">+{currencySymbol}{group.income.toLocaleString()}</span>
                        )}
                        {group.expense > 0 && (
                          <span className="text-rose-600 dark:text-rose-400">-{currencySymbol}{group.expense.toLocaleString()}</span>
                        )}
                      </div>
                    </div>
                    <div className="divide-y divide-latte-100 dark:divide-neutral-700/60">
                      {group.items.map((tx) => (
                        <SwipeableTransactionItem
                          key={tx.id}
                          tx={tx}
                          activeLedger={activeLedger}
                          currencySymbol={currencySymbol}
                          categoryEmoji={emojiMap[`${tx.type}::${tx.major_category}::${tx.sub_category}`]}

                          onDeleteClick={onDeleteClick}
                        />
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function BudgetView({ isDemoMode, onDemoSaveBudget, activeLedger, currencySymbol, selectedMonth, setSelectedMonth, categories, transactions, budgetDoc, showToast }) {
      const [totalInput, setTotalInput] = useState(0);
      const [majorsInput, setMajorsInput] = useState({});
      const [subsInput, setSubsInput] = useState({});
      const [expandedMajors, setExpandedMajors] = useState({});

      useEffect(() => {
        if (budgetDoc) {
          setTotalInput(budgetDoc.total || 0);
          setMajorsInput(budgetDoc.majors || {});
          setSubsInput(budgetDoc.subs || {});
        }
      }, [budgetDoc]);

      const toggleMajorExpand = (majorName) => {
        setExpandedMajors((prev) => ({
          ...prev,
          [majorName]: !prev[majorName],
        }));
      };

      const expenseCats = useMemo(() => categories.filter((c) => c.type === 'expense' && !c.is_archived), [categories]);
      const majors = useMemo(() => [...new Set(expenseCats.map((c) => c.major))], [expenseCats]);

      const actualTotal = useMemo(() => transactions.reduce((acc, t) => acc + (Number(t.amount) || 0), 0), [transactions]);
      const actualByMajor = useMemo(() => {
        const map = {};
        transactions.forEach((t) => { map[t.major_category] = (map[t.major_category] || 0) + (Number(t.amount) || 0); });
        return map;
      }, [transactions]);
      const actualBySub = useMemo(() => {
        const map = {};
        transactions.forEach((t) => {
          const key = `${t.major_category}::${t.sub_category}`;
          map[key] = (map[key] || 0) + (Number(t.amount) || 0);
        });
        return map;
      }, [transactions]);

      async function saveBudgets() {
        if (!activeLedger) return;
        const payload = {
          ledger_id: activeLedger.id,
          month: selectedMonth,
          total: Number(totalInput) || 0,
          majors: majorsInput,
          subs: subsInput,
        };
        if (isDemoMode) {
          onDemoSaveBudget?.(`${activeLedger.id}_${selectedMonth}`, payload);
          showToast('本月預算設定已儲存');
          return;
        }
        try {
          const budgetId = `${activeLedger.id}_${selectedMonth}`;
          await firebase.firestore().collection('budgets').doc(budgetId).set(payload);
          showToast('本月預算設定已儲存');
        } catch (err) {
          showToast('儲存預算失敗：' + err.message);
        }
      }

      function renderProgressBar(label, budgetAmt, usedAmt) {
        const b = Number(budgetAmt) || 0;
        if (b <= 0) return null;
        const pct = Math.round((usedAmt / b) * 100);
        const remaining = b - usedAmt;
        let barColor = 'bg-emerald-500';
        if (pct >= 100) barColor = 'bg-rose-600';
        else if (pct >= 70) barColor = 'bg-amber-500';

        return (
          <div key={label} className="p-4 rounded-xl bg-latte-50 dark:bg-neutral-700/50 space-y-2 text-sm">
            <div className="flex justify-between font-semibold">
              <span>{label}</span>
              <span>使用率：{pct}%</span>
            </div>
            <div className="w-full h-3 rounded-full bg-latte-200 dark:bg-neutral-600 overflow-hidden">
              <div className={`h-full ${barColor} transition-all`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
            </div>
            <div className="flex justify-between text-xs text-latte-600 dark:text-neutral-300">
              <span>預算：{currencySymbol}{b.toLocaleString()}</span>
              <span>已用：{currencySymbol}{usedAmt.toLocaleString()}</span>
              <span>剩餘：{currencySymbol}{remaining.toLocaleString()}</span>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <input
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="px-3 py-2 rounded-xl bg-white dark:bg-neutral-800 border border-latte-300 dark:border-neutral-600 text-sm font-semibold"
              />
            </div>
            <button type="button" onClick={saveBudgets} className="px-4 py-2 rounded-xl bg-latte-600 text-white text-sm font-semibold">儲存預算設定</button>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-3">
            <h3 className="font-bold text-base">本月預算執行進度</h3>
            {renderProgressBar('每月總支出預算', totalInput, actualTotal)}
            {majors.map((m) => renderProgressBar(`大分類：${m}`, majorsInput[m], actualByMajor[m] || 0))}
            {expenseCats.map((c) => {
              const key = `${c.major}::${c.sub}`;
              return renderProgressBar(`子分類：${c.major} - ${c.sub}`, subsInput[key], actualBySub[key] || 0);
            })}
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4 text-sm">
            <h3 className="font-bold text-base">設定預算上限（點擊大分類展開子分類）</h3>
            <div className="flex items-center justify-between gap-4 border-b border-latte-100 dark:border-neutral-700 pb-3">
              <span className="font-bold">每月總支出預算</span>
              <input
                type="number"
                min="0"
                value={totalInput}
                onChange={(e) => setTotalInput(e.target.value)}
                className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
              />
            </div>

            {majors.map((m) => {
              const isExpanded = !!expandedMajors[m];
              const subItems = expenseCats.filter((c) => c.major === m);
              return (
                <div key={m} className="space-y-2 border-b border-latte-100 dark:border-neutral-700 pb-3">
                  <div className="flex items-center justify-between gap-4">
                    <button
                      type="button"
                      onClick={() => toggleMajorExpand(m)}
                      className="flex items-center gap-2 font-semibold text-left hover:text-latte-600 dark:hover:text-latte-300 py-1"
                    >
                      <span className="text-xs w-4 inline-block text-latte-500">
                        {isExpanded ? '▼' : '▶'}
                      </span>
                      <span>大分類：{m}</span>
                      <span className="text-xs font-normal text-latte-400">
                        ({subItems.length} 項子分類)
                      </span>
                    </button>
                    <input
                      type="number"
                      min="0"
                      value={majorsInput[m] || ''}
                      placeholder="0"
                      onChange={(e) => setMajorsInput({ ...majorsInput, [m]: Number(e.target.value) || 0 })}
                      className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                    />
                  </div>
                  {isExpanded && (
                    <div className="pl-6 space-y-1.5 pt-1">
                      {subItems.map((c) => {
                        const key = `${c.major}::${c.sub}`;
                        return (
                          <div key={key} className="flex items-center justify-between gap-4 text-xs text-latte-600 dark:text-neutral-300">
                            <span>- 子分類：{c.sub}</span>
                            <input
                              type="number"
                              min="0"
                              value={subsInput[key] || ''}
                              placeholder="0"
                              onChange={(e) => setSubsInput({ ...subsInput, [key]: Number(e.target.value) || 0 })}
                              className="w-32 p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                            />
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SettingsView({ isDemoMode, onDemoUpdate, onOpenConfigModal, onExitDemo, user, profile, ledgers, activeLedger, setActiveLedgerId, invitations, categories, paymentMethods, transactions, theme, setTheme, showToast, askConfirm, askPrompt, onInstallApp, isStandalone }) {
      const [nicknameInput, setNicknameInput] = useState(profile?.nickname || '');
      const [newCoupleLedgerName, setNewCoupleLedgerName] = useState('');
      const [inviteEmail, setInviteEmail] = useState('');

      const csvFileInputRef = useRef(null);
      const jsonFileInputRef = useRef(null);

      const [mobileExpandedSection, setMobileExpandedSection] = useState('profile');
      const toggleMobileSection = (sectionKey) => {
        setMobileExpandedSection((prev) => (prev === sectionKey ? '' : sectionKey));
      };

      const [catType, setCatType] = useState('expense');
      const [catEmoji, setCatEmoji] = useState('📝');
      const [catMajor, setCatMajor] = useState('');
      const [catSub, setCatSub] = useState('');
      const [newPmName, setNewPmName] = useState('');

      const [editingCategory, setEditingCategory] = useState(null);
      const [editCatForm, setEditCatForm] = useState({ type: 'expense', emoji: '📝', major: '', sub: '' });
      const [orderedCats, setOrderedCats] = useState([]);
      const [draggingCatId, setDraggingCatId] = useState(null);
      const longPressTimerRef = useRef(null);
      const orderedCatsRef = useRef([]);

      useEffect(() => {
        setOrderedCats(categories || []);
        orderedCatsRef.current = categories || [];
      }, [categories]);

      useEffect(() => {
        if (profile?.nickname) setNicknameInput(profile.nickname);
      }, [profile]);

      const isOwner = activeLedger?.owner_id === user.uid;

      async function saveNickname() {
        if (!nicknameInput.trim()) return;
        if (isDemoMode) {
          onDemoUpdate?.('nickname', nicknameInput.trim());
          showToast('顯示暱稱已更新');
          return;
        }
        try {
          await firebase.firestore().collection('profiles').doc(user.uid).update({ nickname: nicknameInput.trim() });
          showToast('顯示暱稱已更新');
        } catch (err) {
          showToast('更新暱稱失敗：' + err.message);
        }
      }

      async function updateLedgerName(ledger) {
        if (ledger.owner_id !== user.uid) {
          showToast('只有帳本擁有者可以修改帳本名稱');
          return;
        }
        const newName = await askPrompt({
          title: '修改帳本名稱',
          defaultValue: ledger.name,
        });
        if (!newName || !newName.trim()) return;
        if (isDemoMode) {
          onDemoUpdate?.('ledgerName', { id: ledger.id, name: newName.trim() });
          showToast('帳本名稱已更新');
          return;
        }
        try {
          await firebase.firestore().collection('ledgers').doc(ledger.id).update({
            name: newName.trim(),
            updated_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          showToast('帳本名稱已更新');
        } catch (err) {
          showToast('更新帳本名稱失敗：' + err.message);
        }
      }

      async function createCoupleLedger() {
        if (!newCoupleLedgerName.trim()) {
          showToast('請先輸入共同帳本名稱');
          return;
        }
        if (isDemoMode) {
          const newId = `demo_couple_${Date.now()}`;
          onDemoUpdate?.('createCoupleLedger', { id: newId, name: newCoupleLedgerName.trim() });
          setNewCoupleLedgerName('');
          setActiveLedgerId(newId);
          showToast('已建立情侶共同帳本');
          return;
        }
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc();
          const myNick = profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者');

          await ledgerRef.set({
            name: newCoupleLedgerName.trim(),
            type: 'couple',
            owner_id: user.uid,
            memberIds: [user.uid],
            members: { [user.uid]: { role: 'owner', email: user.email || '', nickname: myNick } },
            max_members: 5,
            currency: 'TWD',
            is_archived: false,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });

          const batch = db.batch();
          let sortIdx = 0;
          DEFAULT_CATEGORIES.forEach((cat) => {
            cat.subs.forEach((subItem) => {
              const subName = typeof subItem === 'string' ? subItem : subItem.name;
              const subEmoji = typeof subItem === 'string' ? cat.emoji : (subItem.emoji || cat.emoji);
              batch.set(db.collection('categories').doc(), {
                ledger_id: ledgerRef.id,
                type: cat.type,
                emoji: subEmoji || '📝',
                major: cat.major,
                sub: subName,
                sort_order: sortIdx++,
                is_archived: false,
              });
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            batch.set(db.collection('payment_methods').doc(), {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
          setNewCoupleLedgerName('');
          setActiveLedgerId(ledgerRef.id);
          showToast('已建立情侶共同帳本');
        } catch (err) {
          showToast('建立共同帳本失敗：' + err.message);
        }
      }

      async function sendInvitation() {
        if (!inviteEmail.trim()) {
          showToast('請輸入邀請對象的 Google Email');
          return;
        }
        if (isDemoMode) {
          setInviteEmail('');
          showToast('体験模式提示：已模擬發送邀請（連接 Firebase 後可真實跨帳號同步）');
          return;
        }
        if (!isOwner || activeLedger?.type !== 'couple') return;
        if ((activeLedger.memberIds || []).length >= 5) {
          showToast('共同帳本最多只能有 5 位成員（含擁有者）');
          return;
        }
        try {
          await firebase.firestore().collection('ledger_invitations').add({
            ledger_id: activeLedger.id,
            ledger_name: activeLedger.name,
            inviter_id: user.uid,
            inviter_nickname: profile?.nickname || user.email,
            invitee_email: inviteEmail.trim().toLowerCase(),
            status: 'pending',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setInviteEmail('');
          showToast('已發送邀請！對方登入後即可接受加入');
        } catch (err) {
          showToast('發送邀請失敗：' + err.message);
        }
      }

      async function acceptInvitation(inv) {
        if (isDemoMode) return;
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc(inv.ledger_id);
          const snap = await ledgerRef.get();
          if (!snap.exists) {
            showToast('找不到該共同帳本（可能已被刪除）');
            return;
          }
          const data = snap.data();
          if ((data.memberIds || []).length >= 5) {
            showToast('此共同帳本成員已滿 5 人上限');
            return;
          }
          const myNick = profile?.nickname || (user.email ? user.email.split('@')[0] : '成員');
          await ledgerRef.update({
            memberIds: firebase.firestore.FieldValue.arrayUnion(user.uid),
            [`members.${user.uid}`]: { role: 'member', email: user.email || '', nickname: myNick },
          });
          await db.collection('ledger_invitations').doc(inv.id).update({ status: 'accepted' });
          setActiveLedgerId(inv.ledger_id);
          showToast(`已成功加入「${inv.ledger_name}」`);
        } catch (err) {
          showToast('加入帳本失敗：' + err.message);
        }
      }

      async function declineInvitation(inv) {
        if (isDemoMode) return;

      function moveCategoryItem(fromIdx, toIdx) {

          orderedCatsRef.current = next;
          return next;
        });

      function handleCatTouchMove(e) {
        if (!draggingCatId) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const chipEl = target?.closest('[data-cat-id]');
        const overId = chipEl?.getAttribute('data-cat-id');
        if (overId && overId !== draggingCatId) {
          const fromIdx = orderedCatsRef.current.findIndex((c) => c.id === draggingCatId);
          const toIdx = orderedCatsRef.current.findIndex((c) => c.id === overId);
          moveCategoryItem(fromIdx, toIdx);
        }
      }

        if (longPressTimerRef.current) {

      function exportCsv() {
        if (!transactions || transactions.length === 0) {
          showToast('目前帳本尚無可匯出的交易紀錄');
          return;
        }
        const headers = ['日期', '類型', '大分類', '子分類', '項目名稱', '金額', '付款方式', '付款人', '備註'];
        const rows = transactions.map((t) => [
          t.date || '',
          t.type === 'income' ? '收入' : '支出',
          t.major_category || '',
          t.sub_category || '',
          `"${String(t.item_name || '').replace(/"/g, '""')}"`,
          t.amount || 0,
          t.payment_method || '',
          t.payer_nickname || '',
          `"${String(t.note || '').replace(/"/g, '""')}"`,
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeLedger?.name || '記帳明細'}_${getTodayStr()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已匯出 CSV 交易明細');
      }

      function parseCsvLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current);
        return result.map((s) => s.trim());
      }

      async function handleImportCsvFile(e) {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file || !activeLedger) return;
        try {
          const text = await file.text();
          const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter((l) => l.trim());
          if (lines.length < 2) {
            showToast('CSV 檔案內容為空或缺少資料列');
            return;
          }
          const importedList = [];
          const myNick = profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者');
          for (let i = 1; i < lines.length; i++) {
            const cols = parseCsvLine(lines[i]);
            if (cols.length < 6) continue;
            const [dateCol, typeCol, majorCol, subCol, itemCol, amtCol, pmCol, payerCol, noteCol] = cols;
            const amount = parseFloat(String(amtCol).replace(/[^0-9.-]/g, ''));
            if (!dateCol || isNaN(amount) || amount <= 0) continue;
            importedList.push({
              ledger_id: activeLedger.id,
              type: typeCol === '收入' || typeCol === 'income' ? 'income' : 'expense',
              amount,
              major_category: majorCol || '吃吃喝喝',
              sub_category: subCol || '其他',
              date: dateCol.slice(0, 10),
              item_name: itemCol || '',
              payment_method: pmCol || '現金',
              payer_id: user.uid,
              payer_nickname: payerCol || myNick,
              note: noteCol || '',
              created_ms: Date.now() + i,
            });
          }
          if (importedList.length === 0) {
            showToast('未解析到有效的收支紀錄，請確認 CSV 格式');
            return;
          }
          const ok = await askConfirm({
            title: '確認匯入 CSV 報表',
            message: `共解析出 ${importedList.length} 筆收支紀錄，確定匯入至「${activeLedger.name}」嗎？`,
            confirmText: '確認匯入',
          });
          if (!ok) return;

          if (isDemoMode) {
            onDemoUpdate?.('importTransactions', importedList.map((item, idx) => ({ id: `demo_imp_${Date.now()}_${idx}`, ...item })));
            showToast(`已成功匯入 ${importedList.length} 筆紀錄`);
            return;
          }

          const db = firebase.firestore();
          for (let i = 0; i < importedList.length; i += 400) {
            const batch = db.batch();
            importedList.slice(i, i + 400).forEach((item) => {
              batch.set(db.collection('transactions').doc(), item);
            });
            await batch.commit();
          }
          showToast(`已成功匯入 ${importedList.length} 筆紀錄`);
        } catch (err) {
          showToast('匯入 CSV 失敗：' + err.message);
        }
      }

            return;

          const txCount = parsed.transactions.length;
