<body class="bg-latte-50 text-latte-900 dark:bg-neutral-900 dark:text-latte-100 transition-colors">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_CATEGORIES = [
      { type: 'expense', emoji: '🥪', major: '吃吃喝喝', sub: '早餐' },
      { type: 'expense', emoji: '🍱', major: '吃吃喝喝', sub: '午餐' },
      { type: 'expense', emoji: '🍜', major: '吃吃喝喝', sub: '晚餐' },
      { type: 'expense', emoji: '🧃', major: '吃吃喝喝', sub: '飲料' },
      { type: 'expense', emoji: '🌃', major: '吃吃喝喝', sub: '宵夜/點心' },
      { type: 'income', emoji: '💵', major: '提款ATM', sub: '郵局' },
      { type: 'expense', emoji: '🍽️', major: '吃吃喝喝', sub: '其他' },
      { type: 'expense', emoji: '🥘', major: '吃吃喝喝', sub: '火鍋' },
      { type: 'expense', emoji: '🥬', major: '購物', sub: '生鮮食材' },
      { type: 'expense', emoji: '💳', major: '生活', sub: '悠遊卡' },
      { type: 'income', emoji: '💰', major: '收入', sub: '其他' },
      { type: 'expense', emoji: '🛵', major: '交通', sub: '機油' },
      { type: 'expense', emoji: '🕹️', major: '娛樂', sub: '夾娃娃機' },
      { type: 'expense', emoji: '🖨️', major: '生活', sub: '影印' },
    ];

    const DEFAULT_PAYMENT_METHODS = ['現金', '信用卡', '銀行轉帳'];

    const CURRENCIES = [
      { code: 'TWD', symbol: 'NT$', name: '新台幣 (TWD)' },
      { code: 'USD', symbol: 'US$', name: '美元 (USD)' },
      { code: 'JPY', symbol: '¥', name: '日圓 (JPY)' },
      { code: 'EUR', symbol: '€', name: '歐元 (EUR)' },
      { code: 'HKD', symbol: 'HK$', name: '港幣 (HKD)' },
      { code: 'KRW', symbol: '₩', name: '韓元 (KRW)' },
    ];

    function getTodayStr() {
      const now = new Date();
      const offset = 8 * 60;
      const taipei = new Date(now.getTime() + (offset + now.getTimezoneOffset()) * 60000);
      return taipei.toISOString().split('T')[0];
    }

    function getYearMonthStr(dateStr = getTodayStr()) {
      return dateStr.slice(0, 7);
    }

    function evaluateMathExpression(expr) {
      try {
        const sanitized = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
        if (!sanitized) return 0;
        const cleaned = sanitized.replace(/[+\-*/.]+$/, '');
        if (!cleaned) return 0;
        const tokens = cleaned.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
        if (!tokens || tokens.length === 0) return 0;

        const stack = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prev = parseFloat(stack.pop() || '0');
            const next = parseFloat(tokens[i + 1] || '0');
            if (token === '*') stack.push(prev * next);
            else stack.push(next !== 0 ? prev / next : 0);
            i += 2;
          } else {
            stack.push(token);
            i += 1;
          }
        }

        let result = parseFloat(stack[0] || '0');
        for (let j = 1; j < stack.length; j += 2) {
          const op = stack[j];
          const val = parseFloat(stack[j + 1] || '0');
          if (op === '+') result += val;
          else if (op === '-') result -= val;
        }
        return isNaN(result) || !isFinite(result) ? 0 : result;
      } catch (e) {
        return 0;
      }
    }

    function parseFirebaseConfig(input) {
      try {
        const normalized = input.replace(/\u00A0/g, ' ').trim();
        if (normalized.startsWith('{')) return JSON.parse(normalized);
        const match = normalized.match(/\{[\s\S]*\}/);
        if (!match) return null;
        const jsonLike = match[0]
          .replace(/([{,]\s*)(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '$1"$3": ')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, '}');
        return JSON.parse(jsonLike);
      } catch (e) {
        return null;
      }
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-latte-50 dark:bg-neutral-900">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-6 max-w-md w-full shadow-xl border border-rose-200 dark:border-rose-800 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto font-bold text-xl">!</div>
                <h2 className="font-bold text-lg text-latte-900 dark:text-white">系統發生預期外的錯誤</h2>
                <p className="text-xs text-rose-600 dark:text-rose-400 font-mono bg-rose-50 dark:bg-rose-900/30 p-3 rounded-xl break-all text-left">
                  {this.state.error?.toString()}
                </p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="w-full py-3 rounded-xl bg-latte-700 text-white font-semibold text-sm"
                >
                  重新載入頁面
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function CustomModalDialog({ dialog, onClose }) {
      const [inputValue, setInputValue] = useState('');

      useEffect(() => {
        if (dialog?.defaultValue !== undefined) {
          setInputValue(dialog.defaultValue);
        } else {
          setInputValue('');
        }
      }, [dialog]);

      if (!dialog) return null;

      return (
        <div className="fixed inset-0 z-[999] bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-lg text-latte-900 dark:text-white">{dialog.title}</h3>
            {dialog.message && (
              <p className="text-sm text-latte-700 dark:text-neutral-300 whitespace-pre-line leading-relaxed">
                {dialog.message}
              </p>
            )}
            {dialog.mode === 'prompt' && (
              <input
                type="text"
                autoFocus
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 dark:bg-neutral-700 text-sm"
              />
            )}
            <div className="flex justify-end gap-2 pt-2">
              {dialog.mode !== 'alert' && (
                <button
                  type="button"
                  onClick={() => onClose(null)}
                  className="px-4 py-2 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-200 text-sm font-medium"
                >
                  取消
                </button>
              )}
              <button
                type="button"
                onClick={() => onClose(dialog.mode === 'prompt' ? inputValue : true)}
                className={`px-4 py-2 rounded-xl text-white text-sm font-semibold ${
                  dialog.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-latte-600 hover:bg-latte-700'
                }`}
              >
                {dialog.confirmText || '確定'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CustomDatePicker({ value, onChange, onClose }) {
      const todayStr = getTodayStr();
      const initialDate = value || todayStr;
      const [viewYear, setViewYear] = useState(() => parseInt(initialDate.slice(0, 4), 10) || new Date().getFullYear());
      const [viewMonth, setViewMonth] = useState(() => parseInt(initialDate.slice(5, 7), 10) || (new Date().getMonth() + 1));

      function shiftDays(offset) {
        const d = new Date(todayStr + 'T00:00:00');
        d.setDate(d.getDate() + offset);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        onChange(`${yyyy}-${mm}-${dd}`);
        onClose();
      }

      function prevMonth() {
        if (viewMonth === 1) {
          setViewYear((y) => y - 1);
          setViewMonth(12);
        } else {
          setViewMonth((m) => m - 1);
        }
      }

      function nextMonth() {
        if (viewMonth === 12) {
          setViewYear((y) => y + 1);
          setViewMonth(1);
        } else {
          setViewMonth((m) => m + 1);
        }
      }

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(viewYear, viewMonth - 1, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dd = String(d).padStart(2, '0');
          const mm = String(viewMonth).padStart(2, '0');
          cells.push({ day: d, dateStr: `${viewYear}-${mm}-${dd}` });
        }
        return cells;
      }, [viewYear, viewMonth]);

      return (
        <div className="fixed inset-0 z-[60] bg-black/55 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-latte-50 dark:bg-neutral-800 rounded-3xl p-5 max-w-xs w-full space-y-3.5 shadow-2xl border border-latte-200 dark:border-neutral-700">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-latte-900 dark:text-white">選擇記帳日期</h3>
              <button
                type="button"
                onClick={onClose}
                className="w-7 h-7 rounded-full bg-latte-200/70 dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 text-xs flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="grid grid-cols-3 gap-1.5">
              {[
                { label: '前天', offset: -2 },
                { label: '昨天', offset: -1 },
                { label: '今天', offset: 0 },
              ].map((q) => (
                <button
                  key={q.label}
                  type="button"
                  onClick={() => shiftDays(q.offset)}
                  className="py-1.5 rounded-xl bg-white dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 text-xs font-semibold text-latte-800 dark:text-neutral-200 hover:bg-latte-200/70 transition"
                >
                  {q.label}
                </button>
              ))}
            </div>

            <div className="flex items-center justify-between bg-white dark:bg-neutral-700/70 px-3 py-2 rounded-2xl border border-latte-200/80 dark:border-neutral-600">
              <button
                type="button"
                onClick={prevMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ‹
              </button>
              <span className="font-bold text-sm text-latte-900 dark:text-white">
                {viewYear} 年 {String(viewMonth).padStart(2, '0')} 月
              </span>
              <button
                type="button"
                onClick={nextMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ›
              </button>
            </div>

            <div className="bg-white dark:bg-neutral-900/50 p-2.5 rounded-2xl border border-latte-200/70 dark:border-neutral-700">
              <div className="grid grid-cols-7 text-center text-[11px] font-bold text-latte-500 dark:text-neutral-400 mb-1.5">
                {['日', '一', '二', '三', '四', '五', '六'].map((w) => (
                  <div key={w}>{w}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 gap-1 text-center">
                {calendarCells.map((cell, idx) => {
                  if (!cell) return <div key={`empty-${idx}`} className="h-8" />;
                  const isSelected = cell.dateStr === initialDate;
                  const isToday = cell.dateStr === todayStr;
                  return (
                    <button
                      key={cell.dateStr}
                      type="button"
                      onClick={() => {
                        onChange(cell.dateStr);
                        onClose();
                      }}
                      className={`h-8 rounded-xl text-xs font-semibold transition flex items-center justify-center ${
                        isSelected
                          ? 'bg-latte-600 text-white shadow-xs font-bold'
                          : isToday
                          ? 'bg-latte-200/80 dark:bg-neutral-700 text-latte-900 dark:text-white ring-1 ring-latte-500'
                          : 'text-latte-800 dark:text-neutral-200 hover:bg-latte-100 dark:hover:bg-neutral-700'
                      }`}
                    >
                      {cell.day}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TransactionModal({ user, profile, activeLedger, currencySymbol = 'NT$', categories, paymentMethods, editingTx, showToast, onClose }) {
      const [type, setType] = useState(editingTx?.type || 'expense');
      const [amountStr, setAmountStr] = useState(editingTx?.amount ? String(editingTx.amount) : '0');
      const [date, setDate] = useState(editingTx?.date || getTodayStr());
      const [itemName, setItemName] = useState(editingTx?.item_name || '');
      const [note, setNote] = useState(editingTx?.note || '');

      const safeCategories = useMemo(() => {
        const list = Array.isArray(categories) ? categories.filter((c) => !c.is_archived) : [];
        if (list.length > 0) return list;
        return DEFAULT_CATEGORIES.map((cat, idx) => ({
          id: `default_${cat.type}_${cat.major}_${idx}`,
          type: cat.type,
          emoji: cat.emoji,
          major: cat.major,
          sub: cat.sub,
        }));
      }, [categories]);

      const filteredCats = useMemo(() => safeCategories.filter((c) => c.type === type), [safeCategories, type]);
      const majors = useMemo(() => [...new Set(filteredCats.map((c) => c.major))], [filteredCats]);
      const majorsKey = majors.join('|');

      const [selectedMajor, setSelectedMajor] = useState(editingTx?.major_category || '');
      const currentMajorSubs = useMemo(() => filteredCats.filter((c) => c.major === selectedMajor), [filteredCats, selectedMajor]);
      const [selectedSubCat, setSelectedSubCat] = useState(
        editingTx ? { major: editingTx.major_category, sub: editingTx.sub_category, emoji: '📝' } : null
      );

      const activePms = useMemo(() => {
        const list = Array.isArray(paymentMethods) ? paymentMethods.filter((p) => p.is_active) : [];
        if (list.length > 0) return list;
        return DEFAULT_PAYMENT_METHODS.map((name, i) => ({ id: `default_pm_${i}`, name, is_active: true }));
      }, [paymentMethods]);

      const [paymentMethod, setPaymentMethod] = useState(editingTx?.payment_method || '');
      const [saving, setSaving] = useState(false);

      const [dateModalOpen, setDateModalOpen] = useState(false);
      const [pmModalOpen, setPmModalOpen] = useState(false);

      const [orderedMajors, setOrderedMajors] = useState([]);
      const orderedMajorsRef = useRef([]);
      const [draggingMajor, setDraggingMajor] = useState(null);
      const majorPressTimerRef = useRef(null);

      const [orderedSubs, setOrderedSubs] = useState([]);
      const orderedSubsRef = useRef([]);
      const [draggingSubId, setDraggingSubId] = useState(null);
      const subPressTimerRef = useRef(null);

      useEffect(() => {
        setOrderedMajors(majors);
        orderedMajorsRef.current = majors;
      }, [majorsKey]);

      const currentMajorSubsKey = currentMajorSubs.map((c) => `${c.id || c.sub}:${c.sort_order ?? ''}`).join('|');
      useEffect(() => {
        setOrderedSubs(currentMajorSubs);
        orderedSubsRef.current = currentMajorSubs;
      }, [currentMajorSubsKey]);

      function moveMajorItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedMajors((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedMajorsRef.current = next;
          return next;
        });
      }

      async function persistMajorOrder(newMajorOrder) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          let orderIdx = 0;
          newMajorOrder.forEach((m) => {
            const groupItems = categories.filter((c) => c.type === type && c.major === m);
            groupItems.forEach((item) => {
              if (item.id && !String(item.id).startsWith('default_')) {
                batch.update(db.collection('categories').doc(item.id), { sort_order: orderIdx++ });
              }
            });
          });
          await batch.commit();
          showToast('已更新大分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleMajorPointerDown(m) {
        if (majorPressTimerRef.current) clearTimeout(majorPressTimerRef.current);
        majorPressTimerRef.current = setTimeout(() => {
          setDraggingMajor(m);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 650);
      }

      function handleMajorTouchMove(e) {
        if (!draggingMajor) {
          if (majorPressTimerRef.current) {
            clearTimeout(majorPressTimerRef.current);
            majorPressTimerRef.current = null;
          }
          return;
        }
        if (e.cancelable) e.preventDefault();
        const touch = e.touches && e.touches[0];
        if (!touch) return;
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const pill = el?.closest('[data-major-item]');
        if (pill) {
          const targetM = pill.getAttribute('data-major-item');
          const fromIdx = orderedMajorsRef.current.indexOf(draggingMajor);
          const toIdx = orderedMajorsRef.current.indexOf(targetM);
          if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
            moveMajorItem(fromIdx, toIdx);
          }
        }
      }

      function handleMajorPointerUp() {
        if (majorPressTimerRef.current) {
          clearTimeout(majorPressTimerRef.current);
          majorPressTimerRef.current = null;
        }
        if (draggingMajor) {
          const finalOrder = [...orderedMajorsRef.current];
          setDraggingMajor(null);
          persistMajorOrder(finalOrder);
        }
      }

      function moveSubItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedSubs((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedSubsRef.current = next;
          return next;
        });
      }

      async function persistSubOrder(newSubOrder) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          newSubOrder.forEach((item, idx) => {
            if (item.id && !String(item.id).startsWith('default_')) {
              batch.update(db.collection('categories').doc(item.id), { sort_order: idx });
            }
          });
          await batch.commit();
          showToast('已更新子分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleSubPointerDown(subKey) {
        if (subPressTimerRef.current) clearTimeout(subPressTimerRef.current);
        subPressTimerRef.current = setTimeout(() => {
          setDraggingSubId(subKey);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 650);
      }

      function handleSubTouchMove(e) {
        if (!draggingSubId) {
          if (subPressTimerRef.current) {
            clearTimeout(subPressTimerRef.current);
            subPressTimerRef.current = null;
          }
          return;
        }
        if (e.cancelable) e.preventDefault();
        const touch = e.touches && e.touches[0];
        if (!touch) return;
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const card = el?.closest('[data-sub-key]');
        if (card) {
          const targetKey = card.getAttribute('data-sub-key');
          const fromIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === draggingSubId);
          const toIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === targetKey);
          if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
            moveSubItem(fromIdx, toIdx);
          }
        }
      }

      function handleSubPointerUp() {
        if (subPressTimerRef.current) {
          clearTimeout(subPressTimerRef.current);
          subPressTimerRef.current = null;
        }
        if (draggingSubId) {
          const finalOrder = [...orderedSubsRef.current];
          setDraggingSubId(null);
          persistSubOrder(finalOrder);
        }
      }

      useEffect(() => {
        if (!majors.length) return;
        if (!selectedMajor || !majors.includes(selectedMajor)) {
          setSelectedMajor(majors[0]);
        }
      }, [type, majorsKey]);

      useEffect(() => {
        if (!currentMajorSubs.length) return;
        if (!selectedSubCat || selectedSubCat.major !== selectedMajor) {
          const first = currentMajorSubs[0];
          setSelectedSubCat({ major: first.major, sub: first.sub, emoji: first.emoji || '📝' });
        } else {
          const matched = currentMajorSubs.find((c) => c.sub === selectedSubCat.sub);
          if (matched && matched.emoji !== selectedSubCat.emoji) {
            setSelectedSubCat({ major: matched.major, sub: matched.sub, emoji: matched.emoji || '📝' });
          }
        }
      }, [selectedMajor, currentMajorSubs]);

      useEffect(() => {
        if (!paymentMethod && activePms.length > 0) {
          setPaymentMethod(activePms[0].name);
        }
      }, [activePms]);

      function handleKeyPress(key) {
        if (key === 'AC') {
          setAmountStr('0');
          return;
        }
        if (key === 'DEL') {
          setAmountStr((prev) => (prev.length <= 1 ? '0' : prev.slice(0, -1)));
          return;
        }
        if (key === 'OK') {
          handleSave();
          return;
        }
        setAmountStr((prev) => {
          if (prev === '0' && key !== '.') return key;
          if (key === '.') {
            const parts = prev.split(/[+\-*/]/);
            if (parts[parts.length - 1].includes('.')) return prev;
          }
          return prev + key;
        });
      }

      async function handleSave() {
        const finalAmount = Math.round(evaluateMathExpression(amountStr) * 100) / 100;
        if (isNaN(finalAmount) || finalAmount <= 0) {
          showToast('請輸入大於 0 的有效金額');
          return;
        }
        if (!selectedSubCat) {
          showToast('請選擇分類');
          return;
        }
        if (!paymentMethod) {
          showToast('請選擇付款方式');
          return;
        }

        setSaving(true);
        try {
          const db = firebase.firestore();
          const payload = {
            ledger_id: activeLedger.id,
            type,
            amount: finalAmount,
            major_category: selectedSubCat.major,
            sub_category: selectedSubCat.sub,
            date,
            month: date.slice(0, 7),
            item_name: itemName.trim(),
            note: note.trim(),
            payment_method: paymentMethod,
            updated_at: firebase.firestore.FieldValue.serverTimestamp(),
          };

          if (editingTx) {
            await db.collection('transactions').doc(editingTx.id).update(payload);
            showToast('已更新交易紀錄');
          } else {
            await db.collection('transactions').add({
              ...payload,
              payer_id: user.uid,
              payer_nickname: profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者'),
              created_at: firebase.firestore.FieldValue.serverTimestamp(),
              created_ms: Date.now(),
            });
            showToast('已成功儲存記帳紀錄');
          }
          onClose();
        } catch (err) {
          showToast('儲存失敗：' + err.message);
        } finally {
          setSaving(false);
        }
      }

      const keypadButtons = [
        ['7', '8', '9', 'DEL'],
        ['4', '5', '6', 'AC'],
        ['1', '2', '3', 'DATE'],
        ['0', '00', '.', 'OK'],
      ];

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end md:items-center justify-center sm:p-4">
          <div className="bg-latte-50 dark:bg-neutral-900 w-full max-w-md h-[650px] max-h-[92vh] md:h-auto md:max-h-[88vh] rounded-t-3xl md:rounded-3xl p-4 sm:p-5 flex flex-col gap-3.5 shadow-2xl border border-latte-200 dark:border-neutral-700 overflow-hidden">
            <div className="flex items-center justify-between shrink-0 pt-0.5">
              <span className="font-bold text-base text-latte-900 dark:text-white">
                {editingTx ? '編輯收支紀錄' : '新增收支紀錄'}
              </span>
              <button
                type="button"
                onClick={onClose}

            </div>

            <div className="flex items-center gap-2.5 shrink-0">
              <div className="flex gap-1 bg-latte-200/70 dark:bg-neutral-800 p-1 rounded-2xl shrink-0">
                <button
                  type="button"
                  onClick={() => setType('expense')}
                  className={`px-3 py-1.5 rounded-xl font-semibold text-xs transition ${
                    type === 'expense'
                      ? 'bg-rose-600 text-white shadow-xs'
                      : 'text-latte-700 dark:text-neutral-400 hover:bg-latte-100/50'

                >
                  支出
                </button>
                <button
                  type="button"
                  onClick={() => setType('income')}
                  className={`px-3 py-1.5 rounded-xl font-semibold text-xs transition ${
                    type === 'income'
                      ? 'bg-emerald-600 text-white shadow-xs'
                      : 'text-latte-700 dark:text-neutral-400 hover:bg-latte-100/50'
                  }`}
                >
                  收入
                </button>
              </div>

              <div className="flex-1 min-w-0 bg-white dark:bg-neutral-800 px-3 py-1.5 rounded-2xl border border-latte-200 dark:border-neutral-700 flex items-center justify-between shadow-2xs">
                <span className="text-[11px] font-semibold text-latte-500 dark:text-neutral-400 shrink-0 mr-1.5">
                  {currencySymbol}
                </span>
                <span className="md:hidden text-xl font-extrabold tracking-tight text-latte-900 dark:text-white truncate">
                  {amountStr}
                </span>
                <input
                  type="text"
                  inputMode="decimal"
                  value={amountStr}
                  onChange={(e) => {
                    const cleaned = e.target.value.replace(/[^0-9.]/g, '');
                    setAmountStr(cleaned === '' ? '0' : cleaned);
                  }}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') {
                      e.preventDefault();
                      handleSave();
                    }
                  }}
                  className="hidden md:block w-full text-right text-xl font-extrabold tracking-tight text-latte-900 dark:text-white bg-transparent focus:outline-none"
                  placeholder="0"
                />
              </div>
            </div>

            <div className="bg-white dark:bg-neutral-800 p-3 rounded-2xl border border-latte-200/80 dark:border-neutral-700 flex flex-col gap-2.5 shrink-0">
              <div
                onTouchMove={handleMajorTouchMove}
                onTouchEnd={handleMajorPointerUp}
                onMouseUp={handleMajorPointerUp}
                onMouseLeave={handleMajorPointerUp}
                className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1.5 border-b border-latte-100 dark:border-neutral-700/70 select-none"
              >
                {orderedMajors.map((m) => {
                  const isDragging = draggingMajor === m;
                  return (
                    <button
                      key={m}
                      type="button"
                      data-major-item={m}
                      onMouseDown={() => handleMajorPointerDown(m)}
                      onTouchStart={() => handleMajorPointerDown(m)}
                      onMouseEnter={() => {
                        if (draggingMajor && draggingMajor !== m) {
                          const fromIdx = orderedMajors.indexOf(draggingMajor);
                          const toIdx = orderedMajors.indexOf(m);
                          moveMajorItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingMajor) setSelectedMajor(m);
                      }}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shrink-0 transition cursor-pointer ${
                        isDragging
                          ? 'bg-amber-500 text-white scale-105 shadow-md ring-2 ring-amber-300'
                          : selectedMajor === m
                          ? 'bg-latte-600 text-white shadow-2xs'
                          : 'bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 hover:bg-latte-200/70'

              <div

              >
                {orderedSubs.map((cat) => {

                  const isDragging = draggingSubId === subKey;
                  return (
                    <button
                      key={subKey}
                      type="button"
                      data-sub-key={subKey}
                      onMouseDown={() => handleSubPointerDown(subKey)}
                      onTouchStart={() => handleSubPointerDown(subKey)}
                      onMouseEnter={() => {
                        if (draggingSubId && draggingSubId !== subKey) {
                          const fromIdx = orderedSubs.findIndex((c) => (c.id || c.sub) === draggingSubId);
                          const toIdx = orderedSubs.findIndex((c) => (c.id || c.sub) === subKey);
                          moveSubItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingSubId) {
                          setSelectedSubCat({ major: cat.major, sub: cat.sub, emoji: cat.emoji || '📝' });
                        }
                      }}
                      className={`py-2 px-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs transition border cursor-pointer ${
                        isDragging
                          ? 'bg-amber-100 dark:bg-amber-900/40 border-amber-500 scale-105 shadow-md'
                          : isSelected
                          ? 'bg-latte-200/90 dark:bg-latte-700/60 border-latte-600 font-bold text-latte-900 dark:text-white'
                          : 'bg-latte-50/70 dark:bg-neutral-700/40 border-transparent text-latte-700 dark:text-neutral-300 hover:bg-latte-100/70'
                      }`}
                    >
                      <span className="text-base leading-none">{cat.emoji || '📝'}</span>
                      <span className="truncate w-full text-center text-[11px]">{cat.sub}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2.5 shrink-0">
              <input
                type="text"
                placeholder="項目名稱（選填）"
                value={itemName}
                onChange={(e) => setItemName(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs focus:outline-none focus:border-latte-500"
              />
              <input
                type="text"
                placeholder="備註說明（選填）"
                value={note}
                onChange={(e) => setNote(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs focus:outline-none focus:border-latte-500"
              />
            </div>

            <div className="hidden md:flex flex-col gap-3 pt-1">
              <div className="grid grid-cols-2 gap-2.5">
                <button
                  type="button"
                  onClick={() => setDateModalOpen(true)}
                  className="px-3.5 py-2.5 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs font-semibold text-latte-800 dark:text-neutral-200 flex items-center justify-between hover:border-latte-500 transition"
                >
                  <span className="text-latte-500 dark:text-neutral-400">日期</span>
                  <span>{date}</span>
                </button>
                <select
                  value={paymentMethod}
                  onChange={(e) => setPaymentMethod(e.target.value)}
                  className="px-3.5 py-2.5 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs font-semibold text-latte-800 dark:text-neutral-200 focus:outline-none focus:border-latte-500"
                >
                  {activePms.map((pm) => (
                    <option key={pm.id || pm.name} value={pm.name}>
                      {pm.name}
                    </option>
                  ))}
                </select>
              </div>
              <div className="flex items-center justify-end gap-2 pt-1">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-latte-200/70 dark:bg-neutral-800 text-latte-800 dark:text-neutral-200 text-xs font-semibold hover:bg-latte-200 transition"
                >
                  取消
                </button>
                <button
                  type="button"
                  disabled={saving}
                  onClick={handleSave}
                  className="px-6 py-2.5 rounded-xl bg-latte-600 hover:bg-latte-700 text-white text-xs font-bold shadow-sm transition disabled:opacity-50"
                >
                  {saving ? '儲存中...' : '確定儲存'}
                </button>
              </div>

            <div className="md:hidden flex-1 flex flex-col gap-2 min-h-0">
              <div className="flex items-center justify-between px-1 shrink-0">
                <span className="text-[11px] font-medium text-latte-500 dark:text-neutral-400">
                  長按分類可拖曳調順序
                </span>
                <button
                  type="button"
                  onClick={() => setPmModalOpen(true)}
                  className="px-3 py-1 rounded-full bg-latte-200/80 dark:bg-neutral-800 text-latte-800 dark:text-neutral-200 text-[11px] font-semibold"
                >
                  付款：{paymentMethod || '選擇'} ▾
                </button>
              </div>

              <div className="grid grid-cols-4 grid-rows-4 gap-2 flex-1 min-h-[212px]">
                {keypadButtons.flat().map((key) => {
                  const isOk = key === 'OK';
                  const isDate = key === 'DATE';
                  const isAction = key === 'DEL' || key === 'AC';
                  return (
                    <button
                      key={key}
                      type="button"
                      disabled={saving && isOk}
                      onClick={() => {
                        if (isDate) setDateModalOpen(true);
                        else handleKeyPress(key);
                      }}
                      className={`rounded-2xl font-bold transition active:scale-95 flex flex-col items-center justify-center shadow-2xs select-none ${
                        isOk
                          ? 'bg-latte-600 hover:bg-latte-700 text-white text-base'
                          : isDate
                          ? 'bg-latte-200 dark:bg-neutral-700 text-latte-800 dark:text-neutral-200 text-xs leading-tight px-1'
                          : isAction
                          ? 'bg-latte-200/70 dark:bg-neutral-800 text-latte-800 dark:text-neutral-200 text-sm'
                          : 'bg-white dark:bg-neutral-800 text-latte-900 dark:text-white border border-latte-200/70 dark:border-neutral-700 text-lg'
                      }`}
                    >
                      {isDate ? (
                        <>
                          <span className="text-[10px] opacity-75">日期</span>
                          <span className="font-bold">{date.slice(5)}</span>
                        </>
                      ) : isOk ? (
                        saving ? '...' : '確定'
                      ) : key === 'DEL' ? (
                        '⌫'
                      ) : (
                        key
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {dateModalOpen && (
            <CustomDatePicker
              value={date}
              onChange={(newDate) => setDate(newDate)}
              onClose={() => setDateModalOpen(false)}
            />
          )}

          {pmModalOpen && (
            <div className="fixed inset-0 z-[60] bg-black/55 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-5 max-w-xs w-full space-y-3 shadow-2xl border border-latte-200 dark:border-neutral-700">
                <h3 className="font-bold text-base text-latte-900 dark:text-white">選擇付款方式</h3>
                <div className="space-y-1.5 max-h-60 overflow-y-auto">
                  {activePms.map((pm) => (
                    <button
                      key={pm.id || pm.name}
                      type="button"
                      onClick={() => {
                        setPaymentMethod(pm.name);
                        setPmModalOpen(false);
                      }}
                      className={`w-full py-2.5 px-3.5 rounded-xl text-left text-sm font-semibold transition flex items-center justify-between ${
                        paymentMethod === pm.name
                          ? 'bg-latte-600 text-white'
                          : 'bg-latte-50 dark:bg-neutral-700 text-latte-800 dark:text-neutral-200 hover:bg-latte-100'

                    >

                      {paymentMethod === pm.name && <span>✓</span>}

                  ))}

                <button
                  type="button"
                  onClick={() => setPmModalOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-800 dark:text-neutral-200 font-semibold text-sm"
                >
                  取消
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SwipeableTransactionItem({ tx, activeLedger, currencySymbol, categoryEmoji, onEditClick, onDeleteClick }) {
      const [offsetX, setOffsetX] = useState(0);
      const startXRef = useRef(null);
      const isDraggingRef = useRef(false);

      function handleTouchStart(e) {
        startXRef.current = e.touches[0].clientX;
        isDraggingRef.current = true;
      }

      function handleTouchMove(e) {
        if (!isDraggingRef.current || startXRef.current === null) return;
        const diff = e.touches[0].clientX - startXRef.current;
        if (diff < 0) {
          setOffsetX(Math.max(diff, -84));
        } else {
          setOffsetX(0);
        }
      }

      function handleTouchEnd() {
        isDraggingRef.current = false;
        if (offsetX < -42) {
          setOffsetX(-80);
        } else {
          setOffsetX(0);
        }
      }

      return (
        <div className="relative overflow-hidden bg-rose-600">
          <button
            type="button"
            onClick={() => {
              setOffsetX(0);
              onDeleteClick(tx);
            }}
            className="absolute right-0 top-0 bottom-0 w-20 bg-rose-600 text-white font-bold text-xs flex items-center justify-center"
          >
            刪除
          </button>
          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onClick={() => {
              if (offsetX !== 0) {
                setOffsetX(0);
                return;
              }
              onEditClick(tx);
            }}
            style={{ transform: `translateX(${offsetX}px)` }}
            className="relative bg-white dark:bg-neutral-800 px-5 py-3.5 flex items-center justify-between gap-3 transition-transform duration-150 cursor-pointer hover:bg-latte-50/70 dark:hover:bg-neutral-700/40"
          >
            <div className="flex items-center gap-3 min-w-0">
              <div className="w-10 h-10 rounded-2xl bg-latte-100 dark:bg-neutral-700 flex items-center justify-center text-lg shrink-0">
                {categoryEmoji || '📝'}
              </div>
              <div className="min-w-0">
                <div className="font-semibold text-xs sm:text-sm text-latte-900 dark:text-white truncate">
                  {tx.item_name ? `${tx.item_name} · ${tx.sub_category}` : `${tx.major_category} - ${tx.sub_category}`}
                </div>
                <div className="text-[11px] text-latte-500 dark:text-neutral-400 truncate mt-0.5">
                  {tx.payment_method}
                  {activeLedger?.type === 'couple' && tx.payer_nickname ? ` · ${tx.payer_nickname}` : ''}
                  {tx.note ? ` · ${tx.note}` : ''}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2.5 shrink-0">
              <span className={`font-bold text-sm sm:text-base ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                {tx.type === 'income' ? '+' : '-'}{currencySymbol}{Number(tx.amount || 0).toLocaleString()}
              </span>
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  onDeleteClick(tx);
                }}
                className="hidden sm:inline-flex px-2 py-1 rounded-lg text-[11px] text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30"
              >
                刪除
              </button>
            </div>
          </div>
        </div>
      );
    }

    function HomeView({ activeLedger, currencySymbol, transactions, categories, viewMode, setViewMode, selectedDate, setSelectedDate, selectedMonth, setSelectedMonth, onEditClick, onDeleteClick }) {
      const emojiMap = useMemo(() => {
        const map = {};
        (categories || []).forEach((c) => {
          map[`${c.type}::${c.major}::${c.sub}`] = c.emoji || '📝';
        });
        return map;
      }, [categories]);

      const summary = useMemo(() => {
        let income = 0;
        let expense = 0;
        transactions.forEach((tx) => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'income') income += amt;
          else expense += amt;
        });
        return { income, expense, balance: income - expense };
      }, [transactions]);

      const groupedTransactions = useMemo(() => {
        const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
        const groups = {};
        transactions.forEach((tx) => {
          const d = tx.date || '未知日期';
          if (!groups[d]) {
            let weekLabel = '';
            const parsed = new Date(d + 'T00:00:00');
            if (!isNaN(parsed.getTime())) weekLabel = weekDays[parsed.getDay()];
            groups[d] = { date: d, weekLabel, items: [], income: 0, expense: 0 };
          }
          groups[d].items.push(tx);
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'income') groups[d].income += amt;
          else groups[d].expense += amt;
        });
        const sortedGroups = Object.values(groups).sort((a, b) => b.date.localeCompare(a.date));
        sortedGroups.forEach((g) => {
          g.items.sort((a, b) => {
            if (a.type !== b.type) {
              return a.type === 'income' ? -1 : 1;
            }
            return (b.created_ms || 0) - (a.created_ms || 0);
          });
        });
        return sortedGroups;
      }, [transactions]);

      return (
        <div className="space-y-4 sm:space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-neutral-800 p-3 rounded-2xl border border-latte-200/80 dark:border-neutral-700 shadow-2xs">
            <div className="flex gap-1 bg-latte-100 dark:bg-neutral-700 p-1 rounded-xl text-xs font-semibold">
              <button
                type="button"
                onClick={() => setViewMode('month')}
                className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'month' ? 'bg-latte-600 text-white' : 'text-latte-700 dark:text-neutral-300'}`}
              >
                按月份
              </button>
              <button
                type="button"
                onClick={() => setViewMode('day')}
                className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'day' ? 'bg-latte-600 text-white' : 'text-latte-700 dark:text-neutral-300'}`}
              >
                按單日
              </button>
            </div>

            {viewMode === 'month' ? (
              <input
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-latte-50 dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 text-xs font-semibold"
              />
            ) : (
              <input
                type="date"
                value={selectedDate}
                onChange={(e) => setSelectedDate(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-latte-50 dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 text-xs font-semibold"
              />
            )}
          </div>

          <div className="space-y-2.5 sm:space-y-3">
            <div className="grid grid-cols-2 gap-2.5 sm:gap-3">

      );

        [filteredTx]
      );

      const majorBreakdown = useMemo(() => {
        const map = {};
        filteredTx.forEach((t) => {
          const key = t.major_category || '未分類';
          map[key] = (map[key] || 0) + (Number(t.amount) || 0);
        });
        return Object.entries(map)
          .map(([major, amount]) => ({
            major,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [filteredTx, totalAmount]);

          const nick = t.payer_nickname || '成員';
          map[nick] = (map[nick] || 0) + (Number(t.amount) || 0);
        });

          .map(([nickname, amount]) => ({
            nickname,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,

            />
            <div className="flex gap-1 bg-latte-100 dark:bg-neutral-700 p-1 rounded-xl text-xs font-semibold">
              <button

              <span className="text-sm font-bold text-latte-700 dark:text-latte-200">
                總計：{currencySymbol}{totalAmount.toLocaleString()}
              </span>
            </div>
            {majorBreakdown.length === 0 ? (
              <p className="text-xs text-latte-500 text-center py-6">本月尚無相關紀錄</p>

              <div className="space-y-3">
                {majorBreakdown.map((item) => (
                  <div key={item.major} className="space-y-1">
                    <div className="flex justify-between text-xs font-semibold">
                      <span>{item.major}</span>
                      <span>
                        {currencySymbol}{item.amount.toLocaleString()} ({item.pct}%)
                      </span>
                    </div>
                    <div className="w-full h-2.5 rounded-full bg-latte-100 dark:bg-neutral-700 overflow-hidden">
                      <div

              <h3 className="font-bold text-base">情侶共同帳本成員比例</h3>
              {memberBreakdown.length === 0 ? (

    function BudgetView({ activeLedger, currencySymbol, selectedMonth, setSelectedMonth, categories, transactions, budgetDoc, showToast }) {
      const [totalInput, setTotalInput] = useState(0);
      const [majorsInput, setMajorsInput] = useState({});
      const [subsInput, setSubsInput] = useState({});
      const [expandedMajors, setExpandedMajors] = useState({});

      useEffect(() => {
        if (budgetDoc) {
          setTotalInput(budgetDoc.total || 0);
          setMajorsInput(budgetDoc.majors || {});
          setSubsInput(budgetDoc.subs || {});
        }
      }, [budgetDoc]);

      const toggleMajorExpand = (majorName) => {
        setExpandedMajors((prev) => ({
          ...prev,
          [majorName]: !prev[majorName],
        }));
      };

      const expenseCats = useMemo(() => categories.filter((c) => c.type === 'expense' && !c.is_archived), [categories]);
      const majors = useMemo(() => [...new Set(expenseCats.map((c) => c.major))], [expenseCats]);

      const actualTotal = useMemo(() => transactions.reduce((acc, t) => acc + (Number(t.amount) || 0), 0), [transactions]);
      const actualByMajor = useMemo(() => {
        const map = {};
        transactions.forEach((t) => { map[t.major_category] = (map[t.major_category] || 0) + (Number(t.amount) || 0); });
        return map;
      }, [transactions]);
      const actualBySub = useMemo(() => {
        const map = {};
        transactions.forEach((t) => {
          const key = `${t.major_category}::${t.sub_category}`;
          map[key] = (map[key] || 0) + (Number(t.amount) || 0);
        });
        return map;
      }, [transactions]);

      async function saveBudgets() {
        if (!activeLedger) return;
        try {
          const budgetId = `${activeLedger.id}_${selectedMonth}`;
          await firebase.firestore().collection('budgets').doc(budgetId).set({
            ledger_id: activeLedger.id,
            month: selectedMonth,
            total: Number(totalInput) || 0,
            majors: majorsInput,
            subs: subsInput,
          });
          showToast('本月預算設定已儲存');
        } catch (err) {
          showToast('儲存預算失敗：' + err.message);
        }
      }

      function renderProgressBar(label, budgetAmt, usedAmt) {
        const b = Number(budgetAmt) || 0;
        if (b <= 0) return null;
        const pct = Math.round((usedAmt / b) * 100);
        const remaining = b - usedAmt;
        let barColor = 'bg-emerald-500';
        if (pct >= 100) barColor = 'bg-rose-600';
        else if (pct >= 70) barColor = 'bg-amber-500';

        return (
          <div key={label} className="p-4 rounded-xl bg-latte-50 dark:bg-neutral-700/50 space-y-2 text-sm">
            <div className="flex justify-between font-semibold">
              <span>{label}</span>
              <span>使用率：{pct}%</span>
            </div>
            <div className="w-full h-3 rounded-full bg-latte-200 dark:bg-neutral-600 overflow-hidden">
              <div className={`h-full ${barColor} transition-all`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
            </div>
            <div className="flex justify-between text-xs text-latte-600 dark:text-neutral-300">
              <span>預算：{currencySymbol}{b.toLocaleString()}</span>
              <span>已用：{currencySymbol}{usedAmt.toLocaleString()}</span>
              <span>剩餘：{currencySymbol}{remaining.toLocaleString()}</span>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <input
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="px-3 py-2 rounded-xl bg-white dark:bg-neutral-800 border border-latte-300 dark:border-neutral-600 text-sm font-semibold"
              />
            </div>
            <button type="button" onClick={saveBudgets} className="px-4 py-2 rounded-xl bg-latte-600 text-white text-sm font-semibold">儲存預算設定</button>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-3">
            <h3 className="font-bold text-base">本月預算執行進度</h3>
            {renderProgressBar('每月總支出預算', totalInput, actualTotal)}
            {majors.map((m) => renderProgressBar(`大分類：${m}`, majorsInput[m], actualByMajor[m] || 0))}
            {expenseCats.map((c) => {
              const key = `${c.major}::${c.sub}`;
              return renderProgressBar(`子分類：${c.major} - ${c.sub}`, subsInput[key], actualBySub[key] || 0);
            })}
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4 text-sm">
            <h3 className="font-bold text-base">設定預算上限（點擊大分類展開子分類）</h3>
            <div className="flex items-center justify-between gap-4 border-b border-latte-100 dark:border-neutral-700 pb-3">
              <span className="font-bold">每月總支出預算</span>
              <input
                type="number"
                min="0"
                value={totalInput}
                onChange={(e) => setTotalInput(e.target.value)}
                className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
              />
            </div>

            {majors.map((m) => {
              const isExpanded = !!expandedMajors[m];
              const subItems = expenseCats.filter((c) => c.major === m);
              return (
                <div key={m} className="space-y-2 border-b border-latte-100 dark:border-neutral-700 pb-3">
                  <div className="flex items-center justify-between gap-4">
                    <button
                      type="button"
                      onClick={() => toggleMajorExpand(m)}
                      className="flex items-center gap-2 font-semibold text-left hover:text-latte-600 dark:hover:text-latte-300 py-1"
                    >
                      <span className="text-xs w-4 inline-block text-latte-500">
                        {isExpanded ? '▼' : '▶'}
                      </span>
                      <span>大分類：{m}</span>
                      <span className="text-xs font-normal text-latte-400">
                        ({subItems.length} 項子分類)
                      </span>
                    </button>
                    <input
                      type="number"
                      min="0"
                      value={majorsInput[m] || ''}
                      placeholder="0"
                      onChange={(e) => setMajorsInput({ ...majorsInput, [m]: Number(e.target.value) || 0 })}
                      className="w-36 p-2 rounded-xl border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                    />
                  </div>
                  {isExpanded && (
                    <div className="pl-6 space-y-1.5 pt-1">
                      {subItems.map((c) => {
                        const key = `${c.major}::${c.sub}`;
                        return (
                          <div key={key} className="flex items-center justify-between gap-4 text-xs text-latte-600 dark:text-neutral-300">
                            <span>- 子分類：{c.sub}</span>
                            <input
                              type="number"
                              min="0"
                              value={subsInput[key] || ''}
                              placeholder="0"
                              onChange={(e) => setSubsInput({ ...subsInput, [key]: Number(e.target.value) || 0 })}
                              className="w-32 p-1.5 rounded-lg border dark:bg-neutral-700 dark:border-neutral-600 text-right"
                            />
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SettingsView({ user, profile, ledgers, activeLedger, setActiveLedgerId, invitations, categories, paymentMethods, transactions, theme, setTheme, showToast, askConfirm, askPrompt, deferredPrompt, onInstallApp, isStandalone }) {
      const [nicknameInput, setNicknameInput] = useState(profile?.nickname || '');
      const [newCoupleLedgerName, setNewCoupleLedgerName] = useState('');
      const [inviteEmail, setInviteEmail] = useState('');

      const [catType, setCatType] = useState('expense');
      const [catEmoji, setCatEmoji] = useState('📝');
      const [catMajor, setCatMajor] = useState('');
      const [catSub, setCatSub] = useState('');
      const [newPmName, setNewPmName] = useState('');

      const [editingCategory, setEditingCategory] = useState(null);
      const [editCatForm, setEditCatForm] = useState({ type: 'expense', emoji: '📝', major: '', sub: '' });
      const [orderedCats, setOrderedCats] = useState([]);
      const [draggingCatId, setDraggingCatId] = useState(null);
      const longPressTimerRef = useRef(null);
      const orderedCatsRef = useRef([]);

      useEffect(() => {
        setOrderedCats(categories || []);
        orderedCatsRef.current = categories || [];
      }, [categories]);

      useEffect(() => {
        if (profile?.nickname) setNicknameInput(profile.nickname);
      }, [profile]);

      const isOwner = activeLedger?.owner_id === user.uid;

      async function saveNickname() {
        if (!nicknameInput.trim()) return;
        try {
          await firebase.firestore().collection('profiles').doc(user.uid).update({ nickname: nicknameInput.trim() });
          showToast('顯示暱稱已更新');
        } catch (err) {
          showToast('更新暱稱失敗：' + err.message);
        }
      }

      async function updateLedgerName(ledger) {
        if (ledger.owner_id !== user.uid) {
          showToast('只有帳本擁有者可以修改帳本名稱');
          return;
        }
        const newName = await askPrompt({
          title: '修改帳本名稱',
          defaultValue: ledger.name,
        });
        if (!newName || !newName.trim()) return;
        try {
          await firebase.firestore().collection('ledgers').doc(ledger.id).update({
            name: newName.trim(),
            updated_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          showToast('帳本名稱已更新');
        } catch (err) {
          showToast('更新帳本名稱失敗：' + err.message);
        }
      }

      async function createCoupleLedger() {
        if (!newCoupleLedgerName.trim()) {
          showToast('請先輸入共同帳本名稱');
          return;
        }
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc();
          const myNick = profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者');

          await ledgerRef.set({
            name: newCoupleLedgerName.trim(),
            type: 'couple',
            owner_id: user.uid,
            memberIds: [user.uid],
            members: { [user.uid]: { role: 'owner', email: user.email || '', nickname: myNick } },
            max_members: 5,
            currency: 'TWD',
            is_archived: false,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });

          const batch = db.batch();
          DEFAULT_CATEGORIES.forEach((cat, idx) => {
            batch.set(db.collection('categories').doc(), {
              ledger_id: ledgerRef.id,
              type: cat.type,
              emoji: cat.emoji || '📝',
              major: cat.major,
              sub: cat.sub,
              sort_order: idx,
              is_archived: false,
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            batch.set(db.collection('payment_methods').doc(), {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
          setNewCoupleLedgerName('');
          setActiveLedgerId(ledgerRef.id);
          showToast('已建立情侶共同帳本');
        } catch (err) {
          showToast('建立共同帳本失敗：' + err.message);
        }
      }

      async function sendInvitation() {
        if (!inviteEmail.trim()) {
          showToast('請輸入邀請對象的 Google Email');
          return;
        }
        if (!isOwner || activeLedger?.type !== 'couple') return;
        if ((activeLedger.memberIds || []).length >= 5) {
          showToast('共同帳本最多只能有 5 位成員（含擁有者）');
          return;
        }
        try {
          await firebase.firestore().collection('ledger_invitations').add({
            ledger_id: activeLedger.id,
            ledger_name: activeLedger.name,
            inviter_id: user.uid,
            inviter_nickname: profile?.nickname || user.email,
            invitee_email: inviteEmail.trim().toLowerCase(),
            status: 'pending',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setInviteEmail('');
          showToast('已發送邀請！對方登入後即可接受加入');
        } catch (err) {
          showToast('發送邀請失敗：' + err.message);
        }
      }

      async function acceptInvitation(inv) {
        try {
          const db = firebase.firestore();
          const ledgerRef = db.collection('ledgers').doc(inv.ledger_id);
          const snap = await ledgerRef.get();
          if (!snap.exists) {
            showToast('找不到該共同帳本（可能已被刪除）');
            return;
          }
          const data = snap.data();
          if ((data.memberIds || []).length >= 5) {
            showToast('此共同帳本成員已滿 5 人上限');
            return;
          }
          const myNick = profile?.nickname || (user.email ? user.email.split('@')[0] : '成員');
          await ledgerRef.update({
            memberIds: firebase.firestore.FieldValue.arrayUnion(user.uid),
            [`members.${user.uid}`]: { role: 'member', email: user.email || '', nickname: myNick },
          });
          await db.collection('ledger_invitations').doc(inv.id).update({ status: 'accepted' });
          setActiveLedgerId(inv.ledger_id);
          showToast(`已成功加入「${inv.ledger_name}」`);
        } catch (err) {
          showToast('加入帳本失敗：' + err.message);
        }
      }

      async function declineInvitation(inv) {
        const ok = await askConfirm({
          title: '拒絕共同帳本邀請',
          message: `確定要拒絕「${inv.inviter_nickname}」對共同帳本「${inv.ledger_name}」的邀請嗎？`,
          danger: true,
          confirmText: '確認拒絕',
        });
        if (!ok) return;
        try {
          await firebase.firestore().collection('ledger_invitations').doc(inv.id).update({
            status: 'declined',
            responded_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
          showToast(`已拒絕加入「${inv.ledger_name}」`);
        } catch (err) {
          showToast('拒絕邀請失敗：' + err.message);
        }
      }

      async function removeMember(targetUid) {
        if (!isOwner || targetUid === user.uid) return;
        const ok = await askConfirm({
          title: '移除共同帳本成員',
          message: '確定要移除此成員嗎？移除後對方將立即失去存取權限，但歷史交易紀錄會完整保留。',
          danger: true,
          confirmText: '確認移除',
        });

        try {
          const updatedMembers = { ...(activeLedger.members || {}) };
          delete updatedMembers[targetUid];
          await firebase.firestore().collection('ledgers').doc(activeLedger.id).update({
            memberIds: firebase.firestore.FieldValue.arrayRemove(targetUid),
            members: updatedMembers,

          showToast('移除成員失敗：' + err.message);

      async function permanentlyDeleteLedger(ledger) {
        if (ledger.owner_id !== user.uid) return;
        const ok1 = await askConfirm({
          title: `永久刪除「${ledger.name}」`,
          message: '【警告】所有交易、分類與預算將一併刪除且無法復原！確定要繼續嗎？',
          danger: true,
          confirmText: '繼續刪除',
        });
        if (!ok1) return;
        const ok2 = await askConfirm({
          title: '最後確認：不可逆操作',
          message: `請再次確認：真的要永久刪除「${ledger.name}」？`,
          danger: true,
          confirmText: '確認永久刪除',
        });
        if (!ok2) return;

        try {
          const db = firebase.firestore();
          const collections = ['transactions', 'categories', 'payment_methods', 'budgets'];
          for (const col of collections) {
            const snap = await db.collection(col).where('ledger_id', '==', ledger.id).get();
            const batch = db.batch();
            snap.docs.forEach((d) => batch.delete(d.ref));
            await batch.commit();
          }
          await db.collection('ledgers').doc(ledger.id).delete();
          showToast(`已永久刪除「${ledger.name}」`);
        } catch (err) {
          showToast('永久刪除失敗：' + err.message);
        }
      }

        e.preventDefault();

          showToast('請完整輸入大分類與子分類名稱');

        try {
          const maxOrder = orderedCats.reduce((max, item) => Math.max(max, Number(item.sort_order) || 0), orderedCats.length);
          await firebase.firestore().collection('categories').add({
            ledger_id: activeLedger.id,
            type: catType,
            emoji: catEmoji.trim() || '📝',
            major: catMajor.trim(),
            sub: catSub.trim(),
            sort_order: maxOrder + 1,
            is_archived: false,

      async function persistCategoryOrder(listToSave) {
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          listToSave.forEach((item, idx) => {
            batch.update(db.collection('categories').doc(item.id), { sort_order: idx });
          });
          await batch.commit();
          showToast('已儲存分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function moveCategoryItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedCats((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedCatsRef.current = next;
          return next;
        });
      }

      function handleCatPointerDown(catId) {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        longPressTimerRef.current = setTimeout(() => {
          setDraggingCatId(catId);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 650);
      }

      function handleCatTouchMove(e) {
        if (!draggingCatId) {
          if (longPressTimerRef.current) {
            clearTimeout(longPressTimerRef.current);
            longPressTimerRef.current = null;
          }
          return;
        }
        if (e.cancelable) e.preventDefault();
        const touch = e.touches && e.touches[0];
        if (!touch) return;
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const chip = el?.closest('[data-cat-id]');
        if (chip) {
          const targetId = chip.getAttribute('data-cat-id');
          const fromIdx = orderedCatsRef.current.findIndex((c) => c.id === draggingCatId);
          const toIdx = orderedCatsRef.current.findIndex((c) => c.id === targetId);
          if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
            moveCategoryItem(fromIdx, toIdx);
          }
        }
      }

      function handleCatPointerUp() {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        if (draggingCatId) {
          const finalOrder = [...orderedCatsRef.current];
          setDraggingCatId(null);
          persistCategoryOrder(finalOrder);
        }
      }

      function exportCsv() {
        if (!transactions || transactions.length === 0) {
          showToast('目前無交易明細可匯出');
          return;
        }
        const headers = ['日期', '類型', '大分類', '子分類', '金額', '項目名稱', '付款方式', '付款人', '備註'];
        const rows = transactions.map((t) => [
          t.date || '',
          t.type === 'income' ? '收入' : '支出',
          t.major_category || '',
          t.sub_category || '',
          t.amount || 0,
          (t.item_name || '').replace(/"/g, '""'),
          t.payment_method || '',
          t.payer_nickname || '',
          (t.note || '').replace(/"/g, '""'),
        ]);
        const csvContent =
          '\uFEFF' +
          [headers.join(','), ...rows.map((r) => r.map((v) => `"${v}"`).join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeLedger?.name || '記帳明細'}_${getTodayStr()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已匯出 CSV 交易明細');
      }
