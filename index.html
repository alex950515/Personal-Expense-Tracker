          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-base">付款方式管理</h3>
            <form onSubmit={addPaymentMethod} className="flex gap-2">
              <input
                type="text"
                value={newPmName}
                onChange={(e) => setNewPmName(e.target.value)}
                placeholder="新增付款方式（如：Line Pay、悠遊卡）"
                className="flex-1 px-3 py-2 rounded-xl border border-latte-200 dark:border-neutral-600 dark:bg-neutral-700 text-xs sm:text-sm"
              />
              <button
                type="submit"
                className="px-4 py-2 rounded-xl bg-latte-600 text-white text-xs sm:text-sm font-semibold"
              >
                新增
              </button>
            </form>
            <div className="flex flex-wrap gap-2">
              {paymentMethods.map((pm) => (
                <div
                  key={pm.id}
                  className={`px-3 py-1.5 rounded-xl border text-xs flex items-center gap-2 ${
                    pm.is_active
                      ? 'bg-latte-50 dark:bg-neutral-700 border-latte-200 dark:border-neutral-600'
                      : 'opacity-50 bg-neutral-100 dark:bg-neutral-800 border-neutral-300'
                  }`}
                >
                  <span className="font-semibold">{pm.name}</span>
                  <button
                    type="button"
                    onClick={() => togglePmActive(pm)}
                    className="text-latte-600 dark:text-latte-300 underline"
                  >
                    {pm.is_active ? '停用' : '啟用'}
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 flex items-center justify-between">
            <div>
              <h3 className="font-bold text-base">匯出交易報表</h3>
              <p className="text-xs text-latte-500 dark:text-neutral-400">下載目前檢視期間的 CSV 明細檔</p>
            </div>
            <button
              type="button"
              onClick={exportCsv}
              className="px-4 py-2 rounded-xl bg-latte-600 text-white text-xs sm:text-sm font-semibold"
            >
              匯出 CSV
            </button>
          </div>

          {editingCategory && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <form
                onSubmit={saveEditedCategory}
                className="bg-white dark:bg-neutral-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl border border-latte-200 dark:border-neutral-700"
              >
                <h3 className="font-bold text-base">編輯收支分類</h3>
                <div className="grid grid-cols-3 gap-2">
                  <select
                    value={editCatForm.type}
                    onChange={(e) => setEditCatForm({ ...editCatForm, type: e.target.value })}
                    className="px-3 py-2 rounded-xl border border-latte-200 dark:border-neutral-600 dark:bg-neutral-700 text-xs font-semibold"
                  >
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                  </select>
                  <input
                    type="text"
                    value={editCatForm.emoji}
                    onChange={(e) => setEditCatForm({ ...editCatForm, emoji: e.target.value })}
                    placeholder="Emoji"
                    className="col-span-2 px-3 py-2 rounded-xl border border-latte-200 dark:border-neutral-600 dark:bg-neutral-700 text-xs text-center"
                  />
                </div>
                <input
                  type="text"
                  value={editCatForm.major}
                  onChange={(e) => setEditCatForm({ ...editCatForm, major: e.target.value })}
                  placeholder="大分類名稱"
                  className="w-full px-3 py-2 rounded-xl border border-latte-200 dark:border-neutral-600 dark:bg-neutral-700 text-xs"
                />
                <input
                  type="text"
                  value={editCatForm.sub}
                  onChange={(e) => setEditCatForm({ ...editCatForm, sub: e.target.value })}
                  placeholder="子分類名稱"
                  className="w-full px-3 py-2 rounded-xl border border-latte-200 dark:border-neutral-600 dark:bg-neutral-700 text-xs"
                />
                <div className="flex justify-end gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setEditingCategory(null)}
                    className="px-4 py-2 rounded-xl bg-latte-100 dark:bg-neutral-700 text-xs font-semibold"
                  >
                    取消
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-xl bg-latte-600 text-white text-xs font-semibold"
                  >
                    儲存變更
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [configInput, setConfigInput] = useState('');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [profile, setProfile] = useState(null);

      const [ledgers, setLedgers] = useState([]);
      const [activeLedgerId, setActiveLedgerId] = useState(() => localStorage.getItem('active_ledger_id') || '');
      const [invitations, setInvitations] = useState([]);
      const [categories, setCategories] = useState([]);
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [budgetDoc, setBudgetDoc] = useState(null);

      const [activeTab, setActiveTab] = useState('home');
      const [viewMode, setViewMode] = useState('month');
      const [selectedDate, setSelectedDate] = useState(getTodayStr());
      const [selectedMonth, setSelectedMonth] = useState(getYearMonthStr());

      const [showSetupForm, setShowSetupForm] = useState(false);

      const [txModalOpen, setTxModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isStandalone, setIsStandalone] = useState(false);

      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'system');
      const [toastMsg, setToastMsg] = useState(null);
      const [dialog, setDialog] = useState(null);

      function showToast(msg) {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      }

      function askConfirm({ title, message, danger = false, confirmText = '確定' }) {
        return new Promise((resolve) => {
          setDialog({ title, message, mode: 'confirm', danger, confirmText, onClose: (res) => { setDialog(null); resolve(res); } });
        });
      }

      function askPrompt({ title, defaultValue = '' }) {
        return new Promise((resolve) => {
          setDialog({ title, mode: 'prompt', defaultValue, onClose: (res) => { setDialog(null); resolve(res); } });
        });
      }

      useEffect(() => {
        const checkStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        setIsStandalone(checkStandalone);

        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      async function handleInstallApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setDeferredPrompt(null);
          }
        } else {
          showToast('若未自動跳出安裝，請至瀏覽器選單點擊「加到主畫面」或「安裝應用程式」');
        }
      }

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          rootEl.classList.add('dark');
        } else {
          rootEl.classList.remove('dark');
        }
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      useEffect(() => {
        const saved = localStorage.getItem('firebase_config_json');
        if (saved) {
          const cfg = parseFirebaseConfig(saved);
          if (cfg) {
            try {
              if (!firebase.apps.length) {
                firebase.initializeApp(cfg);
              }
              setFirebaseReady(true);
            } catch (e) {
              console.error('Firebase init error:', e);
            }
          }
        }
      }, []);

      function handleSaveFirebaseConfig(e) {
        e.preventDefault();
        const cfg = parseFirebaseConfig(configInput);
        if (!cfg) {
          showToast('格式有誤，請確認貼入完整的 firebaseConfig 物件');
          return;
        }
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(cfg);
          } else {
            firebase.app().options = cfg;
          }
          localStorage.setItem('firebase_config_json', JSON.stringify(cfg));
          setFirebaseReady(true);
          showToast('Firebase 連接成功！');
        } catch (err) {
          showToast('初始化失敗：' + err.message);
        }
      }

      useEffect(() => {
        if (!firebaseReady) return;
        const unsubscribe = firebase.auth().onAuthStateChanged((u) => {
          setUser(u);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, [firebaseReady]);

      function handleGoogleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).catch((err) => {
          showToast('登入失敗：' + err.message);
        });
      }

      useEffect(() => {
        if (!user || !firebaseReady) return;
        const db = firebase.firestore();
        const unsubProfile = db.collection('profiles').doc(user.uid).onSnapshot(
          (doc) => {
            if (doc.exists) {
              setProfile(doc.data());
            } else {
              const defaultNick = user.displayName || (user.email ? user.email.split('@')[0] : '使用者');
              const initialProfile = { email: user.email || '', nickname: defaultNick, avatar_url: user.photoURL || '' };
              db.collection('profiles').doc(user.uid).set(initialProfile, { merge: true });
              setProfile(initialProfile);
            }
          },
          (err) => {
            console.error('Profile snapshot error:', err);
            setProfile({ email: user.email || '', nickname: user.email ? user.email.split('@')[0] : '使用者' });
          }
        );
        return () => unsubProfile();
      }, [user, firebaseReady]);

      useEffect(() => {
        if (!user || !firebaseReady) return;
        const db = firebase.firestore();
        const unsubLedgers = db.collection('ledgers')
          .where('memberIds', 'array-contains', user.uid)
          .onSnapshot(
            (snapshot) => {
              const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
              setLedgers(list);
              if (list.length > 0) {
                const activeExists = list.some((l) => l.id === activeLedgerId);
                if (!activeLedgerId || !activeExists) {
                  const unarchived = list.find((l) => !l.is_archived);
                  const newActive = unarchived ? unarchived.id : list[0].id;
                  setActiveLedgerId(newActive);
                  localStorage.setItem('active_ledger_id', newActive);
                }
              }
            },
            (err) => console.error('Ledgers snapshot error:', err)
          );
        return () => unsubLedgers();
      }, [user, firebaseReady]);

      useEffect(() => {
        if (activeLedgerId) {
          localStorage.setItem('active_ledger_id', activeLedgerId);
        }
      }, [activeLedgerId]);

      useEffect(() => {
        if (!user || !firebaseReady || !user.email) return;
        const db = firebase.firestore();
        const emailLower = user.email.toLowerCase();
        const unsubInv = db.collection('ledger_invitations')
          .where('invitee_email', '==', emailLower)
          .where('status', '==', 'pending')
          .onSnapshot(
            (snapshot) => {
              const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
              setInvitations(list);
            },
            (err) => console.error('Invitations error:', err)
          );
        return () => unsubInv();
      }, [user, firebaseReady]);

      const activeLedger = useMemo(() => ledgers.find((l) => l.id === activeLedgerId) || ledgers[0], [ledgers, activeLedgerId]);
      const currencySymbol = useMemo(() => {
        if (!activeLedger || !activeLedger.currency) return 'NT$';
        const found = CURRENCIES.find((c) => c.code === activeLedger.currency);
        return found ? found.symbol : 'NT$';
      }, [activeLedger]);

      useEffect(() => {
        if (!activeLedgerId || !firebaseReady) {
          setCategories([]);
          setPaymentMethods([]);
          setTransactions([]);
          setBudgetDoc(null);
          return;
        }
        const db = firebase.firestore();

        const unsubCats = db.collection('categories').where('ledger_id', '==', activeLedgerId).onSnapshot(
          (snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
            setCategories(list);
          },
          (err) => console.error('Categories error:', err)
        );

        const unsubPms = db.collection('payment_methods').where('ledger_id', '==', activeLedgerId).onSnapshot(
          (snap) => {
            setPaymentMethods(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          },
          (err) => console.error('Payment methods error:', err)
        );

        const unsubTx = db.collection('transactions').where('ledger_id', '==', activeLedgerId).onSnapshot(
          (snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => {
              const dateComp = (b.date || '').localeCompare(a.date || '');
              if (dateComp !== 0) return dateComp;
              return (b.created_ms || 0) - (a.created_ms || 0);
            });
            setTransactions(list);
          },
          (err) => console.error('Transactions error:', err)
        );

        const budgetId = `${activeLedgerId}_${selectedMonth}`;
        const unsubBudget = db.collection('budgets').doc(budgetId).onSnapshot(
          (doc) => {
            if (doc.exists) setBudgetDoc(doc.data());
            else setBudgetDoc(null);
          },
          (err) => console.error('Budget error:', err)
        );

        return () => {
          unsubCats();
          unsubPms();
          unsubTx();
          unsubBudget();
        };
      }, [activeLedgerId, firebaseReady, selectedMonth]);

      const displayedTransactions = useMemo(() => {
        if (viewMode === 'day') {
          return transactions.filter((t) => t.date === selectedDate);
        }
        return transactions.filter((t) => (t.date || '').startsWith(selectedMonth));
      }, [transactions, viewMode, selectedDate, selectedMonth]);

      async function handleDeleteTx(tx) {
        const ok = await askConfirm({
          title: '刪除收支紀錄',
          message: `確定要刪除「${tx.item_name || tx.major_category}」(${currencySymbol}${tx.amount}) 嗎？`,
          danger: true,
          confirmText: '確認刪除',
        });
        if (!ok) return;
        try {
          await firebase.firestore().collection('transactions').doc(tx.id).delete();
          showToast('已刪除該筆交易');
        } catch (err) {
          showToast('刪除失敗：' + err.message);
        }
      }

      if (!firebaseReady) {
        return (
          <div className="min-h-screen bg-latte-50 dark:bg-neutral-900 flex items-center justify-center p-4">
            {!showSetupForm ? (
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-latte-200 dark:border-neutral-700 text-center space-y-5">
                <div className="w-16 h-16 rounded-3xl bg-latte-600 text-white flex items-center justify-center mx-2.5 sm:mx-auto text-2xl font-bold shadow-md">
                  ☕
                </div>
                <div className="space-y-2">
                  <h1 className="text-xl sm:text-2xl font-extrabold text-latte-900 dark:text-white">暖心日常記帳本</h1>
                  <p className="text-xs sm:text-sm text-latte-600 dark:text-neutral-400 leading-relaxed">
                    個人與情侶共同記帳系統。簡單直覺的收支管理、預算控管、長按拖曳分類排序與雙人雲端即時同步。
                  </p>
                </div>
                <div className="grid grid-cols-3 gap-2 py-2 text-xs font-semibold text-latte-700 dark:text-neutral-300">
                  <div className="p-3 rounded-2xl bg-latte-50 dark:bg-neutral-700/50 border border-latte-100 dark:border-neutral-700">
                    💡 智慧收支分類
                  </div>
                  <div className="p-3 rounded-2xl bg-latte-50 dark:bg-neutral-700/50 border border-latte-100 dark:border-neutral-700">
                    ❤️ 情侶共同帳本
                  </div>
                  <div className="p-3 rounded-2xl bg-latte-50 dark:bg-neutral-700/50 border border-latte-100 dark:border-neutral-700">
                    📊 預算與報表
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setShowSetupForm(true)}
                  className="w-full py-3.5 rounded-2xl bg-latte-600 hover:bg-latte-700 text-white font-bold text-sm shadow-lg transition"
                >
                  開始使用 / 設定資料庫
                </button>
              </div>
            ) : (
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-latte-200 dark:border-neutral-700 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="font-bold text-base sm:text-lg text-latte-900 dark:text-white">Firebase 連線設定</h2>
                  <button
                    type="button"
                    onClick={() => setShowSetupForm(false)}
                    className="text-xs text-latte-500 hover:underline"
                  >
                    返回介紹
                  </button>
                </div>
                <p className="text-xs text-latte-600 dark:text-neutral-400">
                  請貼上您的 Firebase 主專案設定物件（包含 apiKey, authDomain, projectId 等）。
                </p>
                <form onSubmit={handleSaveFirebaseConfig} className="space-y-3">
                  <textarea
                    rows="6"
                    value={configInput}
                    onChange={(e) => setConfigInput(e.target.value)}
                    placeholder='例如: const firebaseConfig = { apiKey: "...", ... };'
                    className="w-full p-3 rounded-xl border border-latte-300 dark:border-neutral-600 dark:bg-neutral-700 text-xs font-mono"
                    required
                  />
                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-latte-600 hover:bg-latte-700 text-white font-bold text-sm"
                  >
                    儲存設定並進入系統
                  </button>
                </form>
              </div>
            )}
          </div>
        );
      }

      if (authLoading) {
        return (
          <div className="min-h-screen bg-latte-50 dark:bg-neutral-900 flex items-center justify-center">
            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-latte-600"></div>
          </div>
        );
      }

      if (!user) {
        return (
          <div className="min-h-screen bg-latte-50 dark:bg-neutral-900 flex items-center justify-center p-4">
            <div className="bg-white dark:bg-neutral-800 rounded-3xl p-8 max-w-sm w-full shadow-xl border border-latte-200 dark:border-neutral-700 text-center space-y-6">
              <div className="w-16 h-16 rounded-3xl bg-latte-600 text-white flex items-center justify-center mx-auto text-2xl font-bold shadow-md">
                ☕
              </div>
              <div className="space-y-2">
                <h1 className="text-xl font-extrabold text-latte-900 dark:text-white">登入暖心記帳</h1>
                <p className="text-xs text-latte-600 dark:text-neutral-400">使用 Google 帳號登入以開始同步您的收支資料</p>
              </div>
              <button
                type="button"
                onClick={handleGoogleLogin}
                className="w-full py-3.5 rounded-2xl bg-latte-700 hover:bg-latte-800 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2"
              >
                使用 Google 帳號登入
              </button>
              <button
                type="button"
                onClick={() => {
                  localStorage.removeItem('firebase_config_json');
                  setFirebaseReady(false);
                }}
                className="text-xs text-latte-500 dark:text-neutral-400 underline hover:text-latte-700"
              >
                重新設定 Firebase 專案
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-latte-50 dark:bg-neutral-900 text-latte-900 dark:text-latte-100 pb-24 md:pb-12 transition-colors">
          {toastMsg && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[999] bg-latte-800 text-white px-5 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-semibold animate-bounce">
              {toastMsg}
            </div>
          )}

          {dialog && (
            <CustomModalDialog dialog={dialog} onClose={handleDialogClose} />
          )}

          <header className="sticky top-0 z-30 bg-white/90 dark:bg-neutral-900/90 backdrop-blur-md border-b border-latte-200 dark:border-neutral-800 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-2xl bg-latte-600 text-white flex items-center justify-center font-bold text-base">☕</span>
              <div>
                <h1 className="font-bold text-sm sm:text-base">{activeLedger?.name || '暖心記帳'}</h1>
                <div className="text-[11px] text-latte-500 dark:text-neutral-400">
                  {profile?.nickname || user.email}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => {
                  if (!activeLedger) {
                    showToast('請先選擇帳本');
                    return;
                  }
                  setEditingTx(null);
                  setTxModalOpen(true);
                }}
                className="hidden md:inline-flex px-4 py-2 rounded-xl bg-latte-600 hover:bg-latte-700 text-white font-bold text-xs shadow-sm transition"
              >
                + 記帳
              </button>
              <button
                type="button"
                onClick={() => firebase.auth().signOut()}
                className="px-3 py-1.5 rounded-xl bg-latte-100 dark:bg-neutral-800 text-latte-700 dark:text-neutral-300 text-xs font-semibold hover:bg-latte-200"
              >
                登出
              </button>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 sm:px-6 pt-5">
            {activeTab === 'home' && (
              <HomeView
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                transactions={displayedTransactions}
                categories={categories}
                viewMode={viewMode}
                setViewMode={setViewMode}
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                onEditClick={(tx) => { setEditingTx(tx); setTxModalOpen(true); }}
                onDeleteClick={handleDeleteTx}
              />
            )}
            {activeTab === 'stats' && (
              <StatsView
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                transactions={transactions}
              />
            )}
            {activeTab === 'budgets' && (
              <BudgetView
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                categories={categories}
                transactions={transactions}
                budgetDoc={budgetDoc}
                showToast={showToast}
              />
            )}
            {activeTab === 'settings' && (
              <SettingsView
                user={user}
                profile={profile}
                ledgers={ledgers}
                activeLedger={activeLedger}
                setActiveLedgerId={setActiveLedgerId}
                invitations={invitations}
                categories={categories}
                paymentMethods={paymentMethods}
                transactions={transactions}
                theme={theme}
                setTheme={setTheme}
                showToast={showToast}
                askConfirm={askConfirm}
                askPrompt={askPrompt}
                deferredPrompt={deferredPrompt}
                onInstallApp={handleInstallApp}
                isStandalone={isStandalone}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-neutral-900/95 backdrop-blur-md border-t border-latte-200/80 dark:border-neutral-800 grid grid-cols-5 py-2 px-1 text-xs items-center shadow-lg">
            <button
              type="button"
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center justify-center py-1 font-medium transition ${activeTab === 'home' ? 'text-latte-700 dark:text-latte-200 font-bold' : 'text-neutral-400 dark:text-neutral-500'}`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>首頁</span>
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('stats')}
              className={`flex flex-col items-center justify-center py-1 font-medium transition ${activeTab === 'stats' ? 'text-latte-700 dark:text-latte-200 font-bold' : 'text-neutral-400 dark:text-neutral-500'}`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path strokeLinecap="round" strokeLinejoin="round" d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
              <span>統計</span>
            </button>
            
            <div className="flex justify-center">
              <button
                type="button"
                onClick={() => {
                  if (!activeLedger) {
                    showToast('請先在設定中選擇或建立帳本');
                    return;
                  }
                  setEditingTx(null);
                  setTxModalOpen(true);
                }}
                className="w-16 h-16 rounded-full bg-latte-600 hover:bg-latte-700 active:bg-latte-800 text-white font-bold text-xs shadow-xl flex flex-col items-center justify-center -mt-6 border-4 border-latte-50 dark:border-neutral-900 transition transform active:scale-95"
                title="記帳"
              >
                <span className="text-xl leading-none font-extrabold">+</span>
                <span className="text-[11px] font-bold">記帳</span>
              </button>
            </div>

            <button
              type="button"
              onClick={() => setActiveTab('budgets')}
              className={`flex flex-col items-center justify-center py-1 font-medium transition ${activeTab === 'budgets' ? 'text-latte-700 dark:text-latte-200 font-bold' : 'text-neutral-400 dark:text-neutral-500'}`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path strokeLinecap="round" strokeLinejoin="round" d="M2 10h20"/></svg>
              <span>預算</span>
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center justify-center py-1 font-medium relative transition ${activeTab === 'settings' ? 'text-latte-700 dark:text-latte-200 font-bold' : 'text-neutral-400 dark:text-neutral-500'}`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path strokeLinecap="round" strokeLinejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
              <span>設定</span>
              {invitations.length > 0 && (
                <span className="absolute top-0 right-3 w-2 h-2 rounded-full bg-red-500"></span>
              )}
            </button>
          </nav>

          {txModalOpen && activeLedger && (
            <TransactionModal
              user={user}
              profile={profile}
              activeLedger={activeLedger}
              currencySymbol={currencySymbol}
              categories={categories}
              paymentMethods={paymentMethods}
              editingTx={editingTx}
              showToast={showToast}
              onClose={() => { setTxModalOpen(false); setEditingTx(null); }}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
