    function getTodayStr() {
      const now = new Date();
      const offset = 8 * 60;
      const taipei = new Date(now.getTime() + (offset + now.getTimezoneOffset()) * 60000);
      return taipei.toISOString().split('T')[0];
    }

    function getYearMonthStr(dateStr = getTodayStr()) {
      return dateStr.slice(0, 7);
    }

    // 安全的四則運算計算函式（避免使用 new Function 觸發 CSP 阻擋或語法錯誤）
    function evaluateMathExpression(expr) {
      try {
        const sanitized = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
        if (!sanitized) return 0;
        const cleaned = sanitized.replace(/[+\-*/.]+$/, '');
        if (!cleaned) return 0;
        const tokens = cleaned.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
        if (!tokens || tokens.length === 0) return 0;

        // 先乘除
        const stack = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prev = parseFloat(stack.pop() || '0');
            const next = parseFloat(tokens[i + 1] || '0');
            if (token === '*') stack.push(prev * next);
            else stack.push(next !== 0 ? prev / next : 0);
            i += 2;
          } else {
            stack.push(token);
            i += 1;
          }
        }

        // 後加減
        let result = parseFloat(stack[0] || '0');
        for (let j = 1; j < stack.length; j += 2) {
          const op = stack[j];
          const val = parseFloat(stack[j + 1] || '0');
          if (op === '+') result += val;
          else if (op === '-') result -= val;
        }
        return isNaN(result) || !isFinite(result) ? 0 : result;
      } catch (e) {
        return 0;
      }
    }

    function parseFirebaseConfig(input) {
      try {
        const normalized = input.replace(/\u00A0/g, ' ').trim();
        if (normalized.startsWith('{')) return JSON.parse(normalized);
        const match = normalized.match(/\{[\s\S]*\}/);
        if (!match) return null;
        const jsonLike = match[0]
          .replace(/([{,]\s*)(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '$1"$3": ')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, '}');
        return JSON.parse(jsonLike);
      } catch (e) {
        return null;
      }
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-latte-50 dark:bg-neutral-900">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-6 max-w-md w-full shadow-xl border border-rose-200 dark:border-rose-800 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto font-bold text-xl">!</div>
                <h2 className="font-bold text-lg text-latte-900 dark:text-white">系統發生預期外的錯誤</h2>
                <p className="text-xs text-rose-600 dark:text-rose-400 font-mono bg-rose-50 dark:bg-rose-900/30 p-3 rounded-xl break-all text-left">
                  {this.state.error?.toString()}
                </p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="w-full py-3 rounded-xl bg-latte-700 text-white font-semibold text-sm"
                >
                  重新載入頁面
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function CustomModalDialog({ dialog, onClose }) {
      const [inputValue, setInputValue] = useState('');

      useEffect(() => {
        if (dialog?.defaultValue !== undefined) {
          setInputValue(dialog.defaultValue);
        } else {
          setInputValue('');
        }
      }, [dialog]);

      if (!dialog) return null;

      return (
        <div className="fixed inset-0 z-[999] bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white dark:bg-neutral-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-latte-200 dark:border-neutral-700 space-y-4">
            <h3 className="font-bold text-lg text-latte-900 dark:text-white">{dialog.title}</h3>
            {dialog.message && (
              <p className="text-sm text-latte-700 dark:text-neutral-300 whitespace-pre-line leading-relaxed">
                {dialog.message}
              </p>
            )}
            {dialog.mode === 'prompt' && (
              <input
                type="text"
                autoFocus
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 dark:bg-neutral-700 text-sm"
              />
            )}
            <div className="flex justify-end gap-2 pt-2">
              {dialog.mode !== 'alert' && (
                <button
                  type="button"
                  onClick={() => onClose(null)}
                  className="px-4 py-2 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-200 text-sm font-medium"
                >
                  取消
                </button>
              )}
              <button
                type="button"
                onClick={() => onClose(dialog.mode === 'prompt' ? inputValue : true)}
                className={`px-4 py-2 rounded-xl text-white text-sm font-semibold ${
                  dialog.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-latte-600 hover:bg-latte-700'
                }`}
              >
                {dialog.confirmText || '確定'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 拿鐵暖色系專屬月曆選擇彈跳窗
    function CustomDatePicker({ value, onChange, onClose }) {
      const todayStr = getTodayStr();
      const initialDate = value || todayStr;
      const [viewYear, setViewYear] = useState(() => parseInt(initialDate.slice(0, 4), 10) || new Date().getFullYear());
      const [viewMonth, setViewMonth] = useState(() => parseInt(initialDate.slice(5, 7), 10) || (new Date().getMonth() + 1));

      function shiftDays(offset) {
        const d = new Date(todayStr + 'T00:00:00');
        d.setDate(d.getDate() + offset);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        onChange(`${yyyy}-${mm}-${dd}`);
        onClose();
      }

      function prevMonth() {
        if (viewMonth === 1) {
          setViewYear((y) => y - 1);
          setViewMonth(12);
        } else {
          setViewMonth((m) => m - 1);
        }
      }

      function nextMonth() {
        if (viewMonth === 12) {
          setViewYear((y) => y + 1);
          setViewMonth(1);
        } else {
          setViewMonth((m) => m + 1);
        }
      }

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(viewYear, viewMonth - 1, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dd = String(d).padStart(2, '0');
          const mm = String(viewMonth).padStart(2, '0');
          cells.push({ day: d, dateStr: `${viewYear}-${mm}-${dd}` });
        }
        return cells;
      }, [viewYear, viewMonth]);

      return (
        <div className="fixed inset-0 z-[60] bg-black/55 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-latte-50 dark:bg-neutral-800 rounded-3xl p-5 max-w-xs w-full space-y-3.5 shadow-2xl border border-latte-200 dark:border-neutral-700">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base text-latte-900 dark:text-white">選擇記帳日期</h3>
              <button
                type="button"
                onClick={onClose}
                className="w-7 h-7 rounded-full bg-latte-200/70 dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 text-xs flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="grid grid-cols-3 gap-1.5">
              {[
                { label: '前天', offset: -2 },
                { label: '昨天', offset: -1 },
                { label: '今天', offset: 0 },
              ].map((q) => (
                <button
                  key={q.label}
                  type="button"
                  onClick={() => shiftDays(q.offset)}
                  className="py-1.5 rounded-xl bg-white dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 text-xs font-semibold text-latte-800 dark:text-neutral-200 hover:bg-latte-200/70 transition"
                >
                  {q.label}
                </button>
              ))}
            </div>

            <div className="flex items-center justify-between bg-white dark:bg-neutral-700/70 px-3 py-2 rounded-2xl border border-latte-200/80 dark:border-neutral-600">
              <button
                type="button"
                onClick={prevMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ‹
              </button>
              <span className="font-bold text-sm text-latte-900 dark:text-white">
                {viewYear} 年 {String(viewMonth).padStart(2, '0')} 月
              </span>
              <button
                type="button"
                onClick={nextMonth}
                className="w-7 h-7 rounded-lg hover:bg-latte-100 dark:hover:bg-neutral-600 text-latte-700 dark:text-neutral-200 font-bold text-sm"
              >
                ›
              </button>
            </div>

            <div className="bg-white dark:bg-neutral-900/50 p-2.5 rounded-2xl border border-latte-200/70 dark:border-neutral-700">
              <div className="grid grid-cols-7 text-center text-[11px] font-bold text-latte-500 dark:text-neutral-400 mb-1.5">
                {['日', '一', '二', '三', '四', '五', '六'].map((w) => (
                  <div key={w}>{w}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 gap-1 text-center">
                {calendarCells.map((cell, idx) => {
                  if (!cell) return <div key={`empty-${idx}`} className="h-8" />;
                  const isSelected = cell.dateStr === initialDate;
                  const isToday = cell.dateStr === todayStr;
                  return (
                    <button
                      key={cell.dateStr}
                      type="button"
                      onClick={() => {
                        onChange(cell.dateStr);
                        onClose();
                      }}
                      className={`h-8 rounded-xl text-xs font-semibold transition flex items-center justify-center ${
                        isSelected
                          ? 'bg-latte-600 text-white shadow-xs font-bold'
                          : isToday
                          ? 'bg-latte-200/80 dark:bg-neutral-700 text-latte-900 dark:text-white ring-1 ring-latte-500'
                          : 'text-latte-800 dark:text-neutral-200 hover:bg-latte-100 dark:hover:bg-neutral-700'
                      }`}
                    >
                      {cell.day}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TransactionModal({ user, profile, activeLedger, currencySymbol = 'NT$', categories, paymentMethods, editingTx, showToast, onClose }) {
      const [type, setType] = useState(editingTx?.type || 'expense');
      const [amountStr, setAmountStr] = useState(editingTx?.amount ? String(editingTx.amount) : '0');
      const [date, setDate] = useState(editingTx?.date || getTodayStr());
      const [itemName, setItemName] = useState(editingTx?.item_name || '');
      const [note, setNote] = useState(editingTx?.note || '');

      const safeCategories = useMemo(() => {
        const list = Array.isArray(categories) ? categories.filter((c) => !c.is_archived) : [];
        if (list.length > 0) return list;
        const fallback = [];
        DEFAULT_CATEGORIES.forEach((cat) => {
          cat.subs.forEach((subItem, idx) => {
            const subName = typeof subItem === 'string' ? subItem : subItem.name;
            const subEmoji = typeof subItem === 'string' ? cat.emoji : (subItem.emoji || cat.emoji);
            fallback.push({
              id: `default_${cat.type}_${cat.major}_${idx}`,
              type: cat.type,
              emoji: subEmoji,
              major: cat.major,
              sub: subName,
            });
          });
        });
        return fallback;
      }, [categories]);

      const filteredCats = useMemo(() => safeCategories.filter((c) => c.type === type), [safeCategories, type]);
      const majors = useMemo(() => [...new Set(filteredCats.map((c) => c.major))], [filteredCats]);
      const majorsKey = majors.join('|');

      const [selectedMajor, setSelectedMajor] = useState(editingTx?.major_category || '');
      const currentMajorSubs = useMemo(() => filteredCats.filter((c) => c.major === selectedMajor), [filteredCats, selectedMajor]);
      const [selectedSubCat, setSelectedSubCat] = useState(
        editingTx ? { major: editingTx.major_category, sub: editingTx.sub_category, emoji: '📝' } : null
      );

      const activePms = useMemo(() => {
        const list = Array.isArray(paymentMethods) ? paymentMethods.filter((p) => p.is_active) : [];
        if (list.length > 0) return list;
        return DEFAULT_PAYMENT_METHODS.map((name, i) => ({ id: `default_pm_${i}`, name, is_active: true }));
      }, [paymentMethods]);

      const [paymentMethod, setPaymentMethod] = useState(editingTx?.payment_method || '');
      const [saving, setSaving] = useState(false);

      const [dateModalOpen, setDateModalOpen] = useState(false);
      const [pmModalOpen, setPmModalOpen] = useState(false);

      // 大分類與子分類長按拖曳排序狀態（長按觸發時間 650ms）
      const [orderedMajors, setOrderedMajors] = useState([]);
      const orderedMajorsRef = useRef([]);
      const [draggingMajor, setDraggingMajor] = useState(null);
      const majorPressTimerRef = useRef(null);

      const [orderedSubs, setOrderedSubs] = useState([]);
      const orderedSubsRef = useRef([]);
      const [draggingSubId, setDraggingSubId] = useState(null);
      const subPressTimerRef = useRef(null);

      useEffect(() => {
        setOrderedMajors(majors);
        orderedMajorsRef.current = majors;
      }, [majorsKey]);

      const currentMajorSubsKey = currentMajorSubs.map((c) => `${c.id || c.sub}:${c.sort_order ?? ''}`).join('|');
      useEffect(() => {
        setOrderedSubs(currentMajorSubs);
        orderedSubsRef.current = currentMajorSubs;
      }, [currentMajorSubsKey]);

      function moveMajorItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedMajors((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedMajorsRef.current = next;
          return next;
        });
      }

      async function persistMajorOrder(newMajorOrder) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          let orderIdx = 0;
          newMajorOrder.forEach((m) => {
            const groupItems = categories.filter((c) => c.type === type && c.major === m);
            groupItems.forEach((item) => {
              if (item.id && !String(item.id).startsWith('default_')) {
                batch.update(db.collection('categories').doc(item.id), { sort_order: orderIdx++ });
              }
            });
          });
          await batch.commit();
          showToast('已更新大分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleMajorPointerDown(m) {
        if (majorPressTimerRef.current) clearTimeout(majorPressTimerRef.current);
        majorPressTimerRef.current = setTimeout(() => {
          setDraggingMajor(m);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 650);
      }

      function handleMajorTouchMove(e) {
        if (!draggingMajor) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const btnEl = target?.closest('[data-major-name]');
        const overMajor = btnEl?.getAttribute('data-major-name');
        if (overMajor && overMajor !== draggingMajor) {
          const fromIdx = orderedMajorsRef.current.indexOf(draggingMajor);
          const toIdx = orderedMajorsRef.current.indexOf(overMajor);
          moveMajorItem(fromIdx, toIdx);
        }
      }

      function handleMajorPointerUp() {
        if (majorPressTimerRef.current) {
          clearTimeout(majorPressTimerRef.current);
          majorPressTimerRef.current = null;
        }
        if (draggingMajor) {
          setDraggingMajor(null);
          persistMajorOrder(orderedMajorsRef.current);
        }
      }

      function moveSubItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
        setOrderedSubs((prev) => {
          const next = [...prev];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          orderedSubsRef.current = next;
          return next;
        });
      }

      async function persistSubOrder(newSubList) {
        if (!Array.isArray(categories) || categories.length === 0) return;
        try {
          const db = firebase.firestore();
          const batch = db.batch();
          const baseOrders = newSubList.map((c) => Number(c.sort_order) || 0);
          const minOrder = baseOrders.length > 0 ? Math.min(...baseOrders) : 0;
          newSubList.forEach((item, idx) => {
            if (item.id && !String(item.id).startsWith('default_')) {
              batch.update(db.collection('categories').doc(item.id), { sort_order: minOrder + idx });
            }
          });
          await batch.commit();
          showToast('已更新子分類順序');
        } catch (err) {
          showToast('更新順序失敗：' + err.message);
        }
      }

      function handleSubPointerDown(subKey) {
        if (subPressTimerRef.current) clearTimeout(subPressTimerRef.current);
        subPressTimerRef.current = setTimeout(() => {
          setDraggingSubId(subKey);
          if (navigator.vibrate) navigator.vibrate(25);
        }, 650);
      }

      function handleSubTouchMove(e) {
        if (!draggingSubId) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const btnEl = target?.closest('[data-sub-key]');
        const overKey = btnEl?.getAttribute('data-sub-key');
        if (overKey && overKey !== draggingSubId) {
          const fromIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === draggingSubId);
          const toIdx = orderedSubsRef.current.findIndex((c) => (c.id || c.sub) === overKey);
          moveSubItem(fromIdx, toIdx);
        }
      }

      function handleSubPointerUp() {
        if (subPressTimerRef.current) {
          clearTimeout(subPressTimerRef.current);
          subPressTimerRef.current = null;
        }
        if (draggingSubId) {
          setDraggingSubId(null);
          persistSubOrder(orderedSubsRef.current);
        }
      }

      useEffect(() => {
        if (majors.length > 0 && !majors.includes(selectedMajor)) {
          const nextMajor = majors[0];
          setSelectedMajor(nextMajor);
          const firstSub = filteredCats.find((c) => c.major === nextMajor);
          if (firstSub) {
            setSelectedSubCat({ major: firstSub.major, sub: firstSub.sub, emoji: firstSub.emoji || '📝' });
          }
        }
      }, [type, majorsKey]);

      useEffect(() => {
        if (activePms.length > 0 && !activePms.some((p) => p.name === paymentMethod)) {
          const defaultCash = activePms.find((p) => p.name === '現金');
          setPaymentMethod(defaultCash ? defaultCash.name : activePms[0].name);
        }
      }, [activePms.length]);

      function handleSelectMajor(m) {
        setSelectedMajor(m);
        const firstSub = filteredCats.find((c) => c.major === m);
        if (firstSub) {
          setSelectedSubCat({ major: firstSub.major, sub: firstSub.sub, emoji: firstSub.emoji || '📝' });
        }
      }

      function handleKeyPress(key) {
        if (key === 'AC') {
          setAmountStr('0');
          return;
        }
        if (key === 'backspace') {
          setAmountStr((prev) => (prev.length > 1 ? prev.slice(0, -1) : '0'));
          return;
        }
        setAmountStr((prev) => {
          if (key === '.') {
            if (prev.includes('.')) return prev;
            return prev + '.';
          }
          if (prev === '0') {
            return key === '00' ? '0' : key;
          }
          return prev + key;
        });
      }

      async function handleSubmit() {
        const finalAmount = evaluateMathExpression(amountStr);
        if (isNaN(finalAmount) || finalAmount <= 0) {
          showToast('請輸入大於 0 的有效金額');
          return;
        }
        if (!selectedSubCat || !selectedSubCat.major || !selectedSubCat.sub) {
          showToast('請先選擇分類');
          return;
        }
        if (!date) {
          showToast('請選擇日期');
          return;
        }
        if (!paymentMethod) {
          showToast('請先選擇付款方式');
          return;
        }

        setSaving(true);
        const db = firebase.firestore();
        try {
          if (editingTx) {
            await db.collection('transactions').doc(editingTx.id).update({
              type,
              amount: finalAmount,
              major_category: selectedSubCat.major,
              sub_category: selectedSubCat.sub,
              date,
              item_name: itemName.trim(),
              note: note.trim(),
              payment_method: paymentMethod,
            });
            showToast('已更新交易紀錄');
          } else {
            await db.collection('transactions').add({
              ledger_id: activeLedger.id,
              type,
              amount: finalAmount,
              major_category: selectedSubCat.major,
              sub_category: selectedSubCat.sub,
              date,
              item_name: itemName.trim(),
              note: note.trim(),
              payment_method: paymentMethod,
              payer_id: user.uid,
              payer_nickname: profile?.nickname || (user.email ? user.email.split('@')[0] : '使用者'),
              created_ms: Date.now(),
            });
            showToast('已新增交易紀錄');
          }
          onClose();
        } catch (err) {
          showToast('儲存失敗：' + err.message);
        } finally {
          setSaving(false);
        }
      }

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end md:items-center justify-center p-0 md:p-4">
          {/* 行動版保留專屬虛擬數字鍵盤，電腦版採用桌面表單雙欄設計，互不干擾 */}
          <div className="bg-white dark:bg-neutral-900 rounded-t-3xl md:rounded-3xl max-w-lg md:max-w-2xl w-full h-[645px] md:h-auto max-h-[95vh] p-4 sm:p-5 md:p-6 flex flex-col justify-between gap-2.5 md:gap-4 shadow-2xl overflow-hidden">
            
            <div className="flex justify-between items-center shrink-0">
              <span className="text-base md:text-lg font-bold text-latte-800 dark:text-latte-100">{editingTx ? '編輯收支紀錄' : '新增收支紀錄'}</span>
              <button type="button" onClick={onClose} className="w-8 h-8 rounded-full text-neutral-400 hover:bg-latte-100 dark:hover:bg-neutral-800 flex items-center justify-center shrink-0">✕</button>
            </div>

            {/* 類別選擇區塊：大分類改為橫向滾動單排，子分類維持垂直滾動網格 */}
            <div className="bg-latte-50 dark:bg-neutral-800/50 p-2.5 md:p-3.5 rounded-2xl space-y-2 shrink-0 border border-latte-200/60 dark:border-neutral-700/60">
              <div className="flex items-center justify-between px-0.5">
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold text-latte-600 dark:text-neutral-400">選擇記帳分類</span>
                  <span className="text-[10px] text-latte-400 dark:text-neutral-500">（長按可調順序）</span>
                </div>
                {selectedSubCat && (
                  <span className="text-xs font-bold text-latte-900 dark:text-white bg-white dark:bg-neutral-700 px-3 py-0.5 rounded-full shadow-2xs border border-latte-200 dark:border-neutral-600 truncate max-w-[190px]">
                    已選：{selectedSubCat.emoji} {selectedSubCat.major} - {selectedSubCat.sub}
                  </span>
                )}
              </div>

              {/* 大分類列表：單排橫向滾動（支援長按拖曳排序） */}
              <div
                onTouchMove={handleMajorTouchMove}
                onTouchEnd={handleMajorPointerUp}
                onMouseUp={handleMajorPointerUp}
                className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 px-0.5 select-none"
              >
                {orderedMajors.map((m) => {
                  const isDragging = draggingMajor === m;
                  return (
                    <button
                      key={m}
                      type="button"
                      data-major-name={m}
                      onTouchStart={() => handleMajorPointerDown(m)}
                      onMouseDown={() => handleMajorPointerDown(m)}
                      onMouseEnter={() => {
                        if (draggingMajor && draggingMajor !== m) {
                          const fromIdx = orderedMajorsRef.current.indexOf(draggingMajor);
                          const toIdx = orderedMajorsRef.current.indexOf(m);
                          moveMajorItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingMajor) handleSelectMajor(m);
                      }}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shrink-0 transition cursor-grab active:cursor-grabbing ${
                        isDragging
                          ? 'scale-105 bg-latte-600 text-white shadow-md ring-2 ring-latte-400 z-10'
                          : selectedMajor === m
                          ? 'bg-latte-800 text-white shadow-2xs dark:bg-neutral-100 dark:text-neutral-900'
                          : 'bg-white dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 border border-latte-200 dark:border-neutral-600 hover:bg-latte-100'
                      }`}
                    >
                      {m}
                    </button>
                  );
                })}
              </div>

              {/* 子分類網格：固定高度，支援上下滾動與長按拖曳排序 */}
              <div
                onTouchMove={handleSubTouchMove}
                onTouchEnd={handleSubPointerUp}
                onMouseUp={handleSubPointerUp}
                className="h-[88px] md:h-[112px] overflow-y-auto no-scrollbar grid grid-cols-3 md:grid-cols-4 content-start gap-2 p-1.5 bg-white/70 dark:bg-neutral-900/40 rounded-xl border border-latte-200/60 dark:border-neutral-700/60 select-none"
              >
                {orderedSubs.map((c) => {
                  const subKey = c.id || c.sub;
                  const isSelected = selectedSubCat?.major === c.major && selectedSubCat?.sub === c.sub;
                  const isDragging = draggingSubId === subKey;
                  return (
                    <button
                      key={subKey}
                      type="button"
                      data-sub-key={subKey}
                      onTouchStart={() => handleSubPointerDown(subKey)}
                      onMouseDown={() => handleSubPointerDown(subKey)}
                      onMouseEnter={() => {
                        if (draggingSubId && draggingSubId !== subKey) {
                          const fromIdx = orderedSubsRef.current.findIndex((item) => (item.id || item.sub) === draggingSubId);
                          const toIdx = orderedSubsRef.current.findIndex((item) => (item.id || item.sub) === subKey);
                          moveSubItem(fromIdx, toIdx);
                        }
                      }}
                      onClick={() => {
                        if (!draggingSubId) setSelectedSubCat({ major: c.major, sub: c.sub, emoji: c.emoji || '📝' });
                      }}
                      className={`flex items-center gap-1.5 p-2 rounded-xl border transition text-left cursor-grab active:cursor-grabbing ${
                        isDragging
                          ? 'scale-105 border-latte-600 bg-latte-100 dark:bg-neutral-600 shadow-md z-10'
                          : isSelected
                          ? 'border-latte-600 bg-white dark:bg-neutral-700 ring-2 ring-latte-600/30 font-bold'
                          : 'border-latte-200 dark:border-neutral-700 bg-white/80 dark:bg-neutral-800 hover:bg-white'
                      }`}
                    >
                      <span className="text-base shrink-0">{c.emoji || '📝'}</span>
                      <span className="text-xs text-latte-800 dark:text-neutral-200 truncate">{c.sub}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 項目名稱與備註 */}
            <div className="grid grid-cols-2 gap-2.5 md:gap-3 shrink-0">
              <input
                type="text"
                value={itemName}
                onChange={(e) => setItemName(e.target.value)}
                placeholder="項目名稱 (選填)"
                className="p-2 md:p-2.5 rounded-xl border border-latte-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-xs md:text-sm"
              />
              <input
                type="text"
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="備註 (選填)"
                className="p-2 md:p-2.5 rounded-xl border border-latte-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-xs md:text-sm"
              />
            </div>

            {/* 行動版：緊湊型金額顯示列 + 擴充空間後的 4x4 虛擬數字鍵盤 */}
            <div className="md:hidden flex flex-col gap-2.5 flex-1 min-h-0">
              <div className="bg-latte-100/70 dark:bg-neutral-800 px-3.5 py-2 rounded-2xl flex items-center justify-between border border-latte-200 dark:border-neutral-700 shrink-0">
                <div className="min-w-0 flex items-baseline gap-2">
                  <span className="text-[11px] text-latte-500 shrink-0">金額</span>
                  <div className="text-xl font-extrabold text-latte-900 dark:text-white truncate tracking-tight">
                    {currencySymbol} {amountStr}
                  </div>
                </div>
                <div className="flex bg-white dark:bg-neutral-700 p-0.5 rounded-xl border border-latte-200 dark:border-neutral-600 shrink-0">
                  <button
                    type="button"
                    onClick={() => setType('expense')}
                    className={`px-3.5 py-1.5 rounded-lg font-bold text-xs transition ${type === 'expense' ? 'bg-rose-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                  >
                    支出
                  </button>
                  <button
                    type="button"
                    onClick={() => setType('income')}
                    className={`px-3.5 py-1.5 rounded-lg font-bold text-xs transition ${type === 'income' ? 'bg-emerald-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                  >
                    收入
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-4 grid-rows-4 gap-1.5 flex-1 min-h-[218px]">
                {[
                  ['1', '2', '3'],
                  ['4', '5', '6'],
                  ['7', '8', '9'],
                  ['.', '0', '00']
                ].map((row, rIdx) => (
                  <React.Fragment key={rIdx}>
                    {row.map((btn) => (
                      <button
                        key={btn}
                        type="button"
                        onClick={() => handleKeyPress(btn)}
                        className="h-full w-full rounded-xl bg-latte-50 dark:bg-neutral-800 hover:bg-latte-200 dark:hover:bg-neutral-700 text-latte-900 dark:text-white font-bold text-lg shadow-2xs border border-latte-200/80 dark:border-neutral-700 transition active:scale-95 flex items-center justify-center touch-manipulation"
                      >
                        {btn}
                      </button>
                    ))}
                    {rIdx === 0 && (
                      <button
                        type="button"
                        onClick={() => setPmModalOpen(true)}
                        className="h-full w-full px-1 rounded-xl bg-latte-200/80 dark:bg-neutral-700 text-latte-800 dark:text-neutral-100 font-bold text-xs shadow-2xs transition active:scale-95 flex flex-col items-center justify-center leading-tight border border-latte-300 dark:border-neutral-600 touch-manipulation"
                      >
                        <span>付款方式</span>
                        <span className="text-[10px] font-normal truncate max-w-full mt-0.5">{paymentMethod || '現金'}</span>
                      </button>
                    )}
                    {rIdx === 1 && (
                      <div className="h-full w-full grid grid-cols-2 gap-1.5">
                        <button
                          type="button"
                          onClick={() => handleKeyPress('backspace')}
                          className="h-full w-full rounded-xl bg-latte-100 dark:bg-neutral-800 text-latte-800 dark:text-neutral-200 font-bold text-sm shadow-2xs border border-latte-200 dark:border-neutral-700 transition active:scale-95 flex items-center justify-center touch-manipulation"
                          title="倒退刪除"
                        >
                          ⌫
                        </button>
                        <button
                          type="button"
                          onClick={() => handleKeyPress('AC')}
                          className="h-full w-full rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 font-bold text-xs border border-amber-200 dark:border-amber-800 shadow-2xs transition active:scale-95 flex items-center justify-center touch-manipulation"
                          title="全部清除"
                        >
                          AC
                        </button>
                      </div>
                    )}
                    {rIdx === 2 && (
                      <button
                        type="button"
                        onClick={() => setDateModalOpen(true)}
                        className="h-full w-full px-1 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-2xs transition active:scale-95 flex flex-col items-center justify-center leading-tight touch-manipulation"
                      >
                        <span>日期</span>
                        <span className="text-[10px] font-normal opacity-95 truncate max-w-full mt-0.5">{date}</span>
                      </button>
                    )}
                    {rIdx === 3 && (
                      <button
                        type="button"
                        onClick={() => handleSubmit()}
                        disabled={saving}
                        className="h-full w-full rounded-xl bg-latte-700 hover:bg-latte-800 text-white font-bold text-sm shadow-md transition active:scale-95 flex items-center justify-center touch-manipulation"
                      >
                        {saving ? '儲存中' : '確定'}
                      </button>
                    )}
                  </React.Fragment>
                ))}
              </div>
            </div>

            {/* 電腦版專屬介面：隱藏虛擬鍵盤，改為清爽的實體鍵盤輸入欄位、付款方式、日期與操作鈕 */}
            <div className="hidden md:flex flex-col gap-4 pt-1">
              <div className="grid grid-cols-12 gap-3 items-end">
                <div className="col-span-5">
                  <label className="block text-xs font-bold text-latte-600 dark:text-neutral-400 mb-1.5">收支類型</label>
                  <div className="grid grid-cols-2 bg-latte-100 dark:bg-neutral-800 p-1 rounded-xl border border-latte-200 dark:border-neutral-700">
                    <button
                      type="button"
                      onClick={() => setType('expense')}
                      className={`py-2 rounded-lg font-bold text-sm transition ${type === 'expense' ? 'bg-rose-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                    >
                      支出
                    </button>
                    <button
                      type="button"
                      onClick={() => setType('income')}
                      className={`py-2 rounded-lg font-bold text-sm transition ${type === 'income' ? 'bg-emerald-600 text-white shadow-xs' : 'text-latte-700 dark:text-neutral-300'}`}
                    >
                      收入
                    </button>
                  </div>
                </div>

                <div className="col-span-7">
                  <label className="block text-xs font-bold text-latte-600 dark:text-neutral-400 mb-1.5">輸入金額 ({currencySymbol})</label>
                  <div className="relative flex items-center">
                    <span className="absolute left-3.5 text-sm font-bold text-latte-500">{currencySymbol}</span>
                    <input
                      type="number"
                      step="any"
                      min="0"
                      autoFocus
                      value={amountStr === '0' ? '' : amountStr}
                      onChange={(e) => setAmountStr(e.target.value || '0')}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleSubmit();
                        }
                      }}
                      placeholder="請直接輸入金額..."
                      className="w-full pl-12 pr-4 py-2 rounded-xl border border-latte-300 dark:border-neutral-600 bg-latte-50/70 dark:bg-neutral-800 text-xl font-extrabold text-latte-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-latte-500"
                    />
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-latte-600 dark:text-neutral-400 mb-1.5">付款方式</label>
                  <select
                    value={paymentMethod}
                    onChange={(e) => setPaymentMethod(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 text-sm font-semibold text-latte-800 dark:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-latte-500"
                  >
                    {activePms.map((pm) => (
                      <option key={pm.id || pm.name} value={pm.name}>{pm.name}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-latte-600 dark:text-neutral-400 mb-1.5">記帳日期</label>
                  <button
                    type="button"
                    onClick={() => setDateModalOpen(true)}
                    className="w-full p-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 hover:bg-latte-50 dark:hover:bg-neutral-700 text-sm font-semibold text-latte-800 dark:text-neutral-100 flex items-center justify-between transition"
                  >
                    <span>{date}</span>
                    <span className="text-xs text-latte-500">選擇日曆 📅</span>
                  </button>
                </div>
              </div>

              <div className="flex justify-end gap-3 pt-2 border-t border-latte-100 dark:border-neutral-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-xl bg-latte-100 dark:bg-neutral-800 hover:bg-latte-200 dark:hover:bg-neutral-700 text-latte-700 dark:text-neutral-300 text-sm font-semibold transition"
                >
                  取消
                </button>
                <button
                  type="button"
                  onClick={() => handleSubmit()}
                  disabled={saving}
                  className="px-8 py-2.5 rounded-xl bg-latte-700 hover:bg-latte-800 text-white text-sm font-bold shadow-md transition"
                >
                  {saving ? '儲存中...' : '確定儲存'}
                </button>
              </div>
            </div>
          </div>

          {/* 拿鐵主題專屬日曆彈跳窗 */}
          {dateModalOpen && (
            <CustomDatePicker
              value={date}
              onChange={(newDate) => setDate(newDate)}
              onClose={() => setDateModalOpen(false)}
            />
          )}

          {/* 付款方式選擇彈跳窗 */}
          {pmModalOpen && (
            <div className="fixed inset-0 z-[60] bg-black/55 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-latte-50 dark:bg-neutral-800 rounded-3xl p-5 max-w-xs w-full space-y-3 shadow-2xl border border-latte-200 dark:border-neutral-700">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-latte-900 dark:text-white">選擇付款方式</h3>
                  <button
                    type="button"
                    onClick={() => setPmModalOpen(false)}
                    className="w-7 h-7 rounded-full bg-latte-200/70 dark:bg-neutral-700 text-latte-700 dark:text-neutral-300 text-xs flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>
                <div className="space-y-1.5 max-h-48 overflow-y-auto">
                  {activePms.map((pm) => (
                    <button
                      key={pm.id || pm.name}
                      type="button"
                      onClick={() => { setPaymentMethod(pm.name); setPmModalOpen(false); }}
                      className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-semibold transition ${paymentMethod === pm.name ? 'bg-latte-600 text-white shadow-xs' : 'bg-white dark:bg-neutral-700 text-latte-800 dark:text-neutral-200 border border-latte-200/60 dark:border-neutral-600'}`}
                    >
                      {pm.name}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StatsView({ activeLedger, currencySymbol = 'NT$', selectedMonth, setSelectedMonth, transactions }) {
      const [statType, setStatType] = useState('expense');

      const filteredTx = useMemo(() => {
        return transactions.filter((t) => t.type === statType);
      }, [transactions, statType]);

      const totalAmount = useMemo(() => {
        return filteredTx.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
      }, [filteredTx]);

      const byMajor = useMemo(() => {
        const map = {};
        filteredTx.forEach((t) => {
          map[t.major_category] = (map[t.major_category] || 0) + (Number(t.amount) || 0);
        });
        return Object.entries(map)
          .map(([name, amount]) => ({
            name,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [filteredTx, totalAmount]);

      const byMember = useMemo(() => {
        if (activeLedger?.type !== 'couple') return [];
        const map = {};
        filteredTx.forEach((t) => {
          const nick = t.payer_nickname || '成員';
          map[nick] = (map[nick] || 0) + (Number(t.amount) || 0);
        });
        return Object.entries(map)
          .map(([nickname, amount]) => ({
            nickname,
            amount,
            pct: totalAmount > 0 ? Math.round((amount / totalAmount) * 100) : 0,
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [filteredTx, totalAmount, activeLedger]);

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-2.5">
            <input
              type="month"
              value={selectedMonth}
              onChange={(e) => setSelectedMonth(e.target.value)}
              className="px-3 py-2 rounded-xl bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-xs sm:text-sm font-semibold shadow-2xs"
            />

          <div className="bg-white dark:bg-neutral-800 rounded-2xl p-5 border border-latte-200 dark:border-neutral-700 space-y-4">

              <span className="font-bold text-sm sm:text-base">{statType === 'expense' ? '本月總支出' : '本月總收入'}</span>
              <span className={`font-extrabold text-lg ${statType === 'expense' ? 'text-rose-600' : 'text-emerald-600'}`}>
