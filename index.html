      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isStandalone, setIsStandalone] = useState(false);

      useEffect(() => {
        const standaloneCheck = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        setIsStandalone(standaloneCheck);

        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        window.addEventListener('appinstalled', () => {
          setDeferredPrompt(null);
          setIsStandalone(true);
          showToast('已成功安裝「暖心記帳」到桌面！');
        });
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      async function handleInstallApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setDeferredPrompt(null);
          }
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          setDialogState({
            mode: 'alert',
            title: '如何將「暖心記帳」安裝到手機桌面？',
            message: isIOS
              ? '【iPhone / iPad Safari 安裝步驟】\n1. 點擊瀏覽器底部正中央的「分享」按鈕（方框帶向上箭頭圖示）。\n2. 往下滑動選單，點擊「加入主畫面」。\n3. 點擊右上角「新增」即可在桌面看到專屬圖示！'
              : '【Android / Chrome 安裝步驟】\n1. 點擊瀏覽器右上角的「⋮」（三個點選單）。\n2. 點擊「安裝應用程式」或「加到主畫面」。\n3. 確認安裝後即可在手機桌面獨立開啟！',
            confirmText: '我知道了',
          });
        }
      }

      function showToast(msg) {
        setToastMsg(msg);
        setTimeout(() => setToastMsg((prev) => (prev === msg ? '' : prev)), 3200);
      }

      function askConfirm({ title, message, danger = false, confirmText = '確定' }) {
        return new Promise((resolve) => {
          setDialogState({ mode: 'confirm', title, message, danger, confirmText, resolve });
        });
      }

      function askPrompt({ title, message = '', defaultValue = '' }) {
        return new Promise((resolve) => {
          setDialogState({ mode: 'prompt', title, message, defaultValue, resolve });
        });
      }

      const [theme, setTheme] = useState(() => safeStorage.get('theme', 'system'));
      useEffect(() => {
        const root = document.documentElement;
        const applyDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', applyDark);
        safeStorage.set('theme', theme);
      }, [theme]);

      const [fbConfigText, setFbConfigText] = useState(() => safeStorage.get('fb_config', ''));
      const [fbReady, setFbReady] = useState(false);
      const [configError, setConfigError] = useState('');
      const [configModalOpen, setConfigModalOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');

      // 體驗模式狀態（當未設定 Firebase 或用戶想直接免登入體驗時使用）
      const [isDemoMode, setIsDemoMode] = useState(false);
      const demoSeed = useMemo(() => createDemoInitialData(), []);

      useEffect(() => {
        if (!fbConfigText) {
          setAuthLoading(false);
          return;
        }
        const parsed = parseFirebaseConfig(fbConfigText);
        if (!parsed || !parsed.apiKey || !parsed.projectId) {
          setConfigError('設定格式無法解析，請貼上完整的 firebaseConfig 物件。');
          setAuthLoading(false);
          return;
        }
        try {
          if (typeof firebase === 'undefined') {
            setConfigError('Firebase SDK 尚未載入，請檢查網路連線。');
            setAuthLoading(false);
            return;
          }
          if (!firebase.apps.length) {
            firebase.initializeApp(parsed);
          }
          setFbReady(true);
          setConfigError('');

          firebase.auth().getRedirectResult().catch((err) => {
            setAuthError(`登入失敗 (${err.code})：${err.message}`);
          });

          const unsub = firebase.auth().onAuthStateChanged(async (u) => {
            setUser(u);
            if (u) {
              setIsDemoMode(false);
              try {
                await ensureUserInitialized(u);
              } catch (e) {
                setAuthError('初始化個人資料失敗：' + e.message);
              }
            }
            setAuthLoading(false);
          });
          return () => unsub();
        } catch (err) {
          setConfigError('Firebase 初始化失敗：' + err.message);
          setAuthLoading(false);
        }
      }, [fbConfigText]);

      async function ensureUserInitialized(u) {
        const db = firebase.firestore();
        const profileRef = db.collection('profiles').doc(u.uid);
        const profileSnap = await profileRef.get();
        const defaultNickname = u.displayName || (u.email ? u.email.split('@')[0] : '使用者');

        if (!profileSnap.exists) {
          await profileRef.set({
            uid: u.uid,
            email: u.email || '',
            nickname: defaultNickname,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }

        const ledgersSnap = await db.collection('ledgers')
          .where('owner_id', '==', u.uid)
          .where('type', '==', 'personal')
          .get();

        if (ledgersSnap.empty) {
          const ledgerRef = db.collection('ledgers').doc();
          await ledgerRef.set({
            name: '我的個人帳本',
            type: 'personal',
            owner_id: u.uid,
            memberIds: [u.uid],
            members: { [u.uid]: { role: 'owner', email: u.email || '', nickname: defaultNickname } },
            max_members: 1,
            currency: 'TWD',
            is_archived: false,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
          });

          const batch = db.batch();
          let sortIdx = 0;
          DEFAULT_CATEGORIES.forEach((cat) => {
            cat.subs.forEach((subItem) => {
              const subName = typeof subItem === 'string' ? subItem : subItem.name;
              const subEmoji = typeof subItem === 'string' ? cat.emoji : (subItem.emoji || cat.emoji);
              const catRef = db.collection('categories').doc();
              batch.set(catRef, {
                ledger_id: ledgerRef.id,
                type: cat.type,
                emoji: subEmoji || '📝',
                major: cat.major,
                sub: subName,
                sort_order: sortIdx++,
                is_archived: false,
              });
            });
          });

          DEFAULT_PAYMENT_METHODS.forEach((pm) => {
            const pmRef = db.collection('payment_methods').doc();
            batch.set(pmRef, {
              ledger_id: ledgerRef.id,
              name: pm,
              is_active: true,
            });
          });

          await batch.commit();
        }
      }

      const [profile, setProfile] = useState(null);
      const [ledgers, setLedgers] = useState([]);
      const [activeLedgerId, setActiveLedgerId] = useState('');
      const [invitations, setInvitations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState([]);
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [budgetDoc, setBudgetDoc] = useState(null);
      const [demoBudgetsMap, setDemoBudgetsMap] = useState({});

      const [activeTab, setActiveTab] = useState('home');
      const [selectedMonth, setSelectedMonth] = useState(() => getYearMonthStr());
      const [customDateRange, setCustomDateRange] = useState({ enabled: false, start: '', end: '' });

      function enterDemoMode() {
        setIsDemoMode(true);
        setUser({ uid: 'demo_user', email: 'demo@example.com' });
        setProfile({ uid: 'demo_user', email: 'demo@example.com', nickname: '我' });
        setLedgers(demoSeed.demoLedgers);
        setActiveLedgerId('demo_personal');
        setTransactions(demoSeed.demoTransactions);
        setCategories(demoSeed.demoCategories);
        setPaymentMethods(demoSeed.demoPaymentMethods);
        setBudgetDoc({ total: 15000, majors: { '吃吃喝喝': 8000 }, subs: {} });
        showToast('已進入單機體驗模式，所有功能皆可直接操作');
      }

      function exitDemoMode() {
        setIsDemoMode(false);
        setUser(null);
        setProfile(null);
        setLedgers([]);
        setTransactions([]);
      }

      useEffect(() => {
        let lastTrackedDay = getTodayStr();
        const syncDateIfRolledOver = () => {
          const currentDay = getTodayStr();
          if (currentDay !== lastTrackedDay) {
            const prevMonth = lastTrackedDay.slice(0, 7);
            lastTrackedDay = currentDay;
            setSelectedMonth((prev) => (prev === prevMonth ? currentDay.slice(0, 7) : prev));
          }
        };
        const timer = setInterval(syncDateIfRolledOver, 60000);
        document.addEventListener('visibilitychange', syncDateIfRolledOver);
        return () => {
          clearInterval(timer);
          document.removeEventListener('visibilitychange', syncDateIfRolledOver);
        };
      }, []);

      const [txModalOpen, setTxModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);

      useEffect(() => {
        if (!user || !fbReady || isDemoMode) return;
        const db = firebase.firestore();

        const unsubProfile = db.collection('profiles').doc(user.uid).onSnapshot((doc) => {
          if (doc.exists) setProfile(doc.data());
        });

        const unsubLedgers = db.collection('ledgers')
          .where('memberIds', 'array-contains', user.uid)
          .onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => {
              const aIsMyPersonal = a.type === 'personal' && a.owner_id === user.uid;
              const bIsMyPersonal = b.type === 'personal' && b.owner_id === user.uid;
              if (aIsMyPersonal && !bIsMyPersonal) return -1;
              if (!aIsMyPersonal && bIsMyPersonal) return 1;
              if (a.type === 'personal' && b.type !== 'personal') return -1;
              if (a.type !== 'personal' && b.type === 'personal') return 1;
              return (a.name || '').localeCompare(b.name || '');
            });
            setLedgers(list);
            const activeList = list.filter((l) => !l.is_archived);
            if (activeList.length > 0 && (!activeLedgerId || !activeList.some((l) => l.id === activeLedgerId))) {
              const personal = activeList.find((l) => l.type === 'personal');
              setActiveLedgerId(personal ? personal.id : activeList[0].id);
            }
          });

        const unsubInvites = db.collection('ledger_invitations')
          .where('invitee_email', '==', (user.email || '').toLowerCase())
          .where('status', '==', 'pending')
          .onSnapshot((snap) => {
            setInvitations(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

        return () => {
          unsubProfile();
          unsubLedgers();
          unsubInvites();
        };
      }, [user, fbReady, isDemoMode]);

      const activeLedger = useMemo(() => ledgers.find((l) => l.id === activeLedgerId), [ledgers, activeLedgerId]);
      const currencySymbol = useMemo(() => {
        const found = CURRENCIES.find((c) => c.code === (activeLedger?.currency || 'TWD'));
        return found ? found.symbol : 'NT$';
      }, [activeLedger]);

      useEffect(() => {
        if (!activeLedgerId || !fbReady || isDemoMode) return;
        const db = firebase.firestore();

        const unsubTx = db.collection('transactions')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => {
              if (b.date !== a.date) return b.date.localeCompare(a.date);
              return (b.created_ms || 0) - (a.created_ms || 0);
            });
            setTransactions(list);
          });

        const unsubCat = db.collection('categories')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => (a.sort_order ?? 9999) - (b.sort_order ?? 9999));
            setCategories(list);
          });

        const unsubPm = db.collection('payment_methods')
          .where('ledger_id', '==', activeLedgerId)
          .onSnapshot((snap) => {
            setPaymentMethods(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          });

        return () => {
          unsubTx();
          unsubCat();
          unsubPm();
        };
      }, [activeLedgerId, fbReady, isDemoMode]);

      useEffect(() => {
        if (!activeLedgerId || !selectedMonth) return;
        if (isDemoMode) {
          const bKey = `${activeLedgerId}_${selectedMonth}`;
          setBudgetDoc(demoBudgetsMap[bKey] || { total: 15000, majors: { '吃吃喝喝': 8000 }, subs: {} });
          return;
        }
        if (!fbReady) return;
        const db = firebase.firestore();
        const budgetId = `${activeLedgerId}_${selectedMonth}`;
        const unsub = db.collection('budgets').doc(budgetId).onSnapshot((doc) => {
          setBudgetDoc(doc.exists ? doc.data() : { total: 0, majors: {}, subs: {} });
        });
        return () => unsub();
      }, [activeLedgerId, selectedMonth, fbReady, isDemoMode, demoBudgetsMap]);

      async function handleGoogleLogin() {
        setAuthError('');
        if (!fbReady) {
          setConfigModalOpen(true);
          return;
        }
        if (window.location.protocol === 'file:') {
          setAuthError('偵測到您直接雙擊開啟檔案 (file://)，Google 登入必須透過本地伺服器 (http://localhost) 執行。');
          return;
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await firebase.auth().signInWithPopup(provider);
        } catch (err) {
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            await firebase.auth().signInWithRedirect(provider);
          } else if (err.code === 'auth/unauthorized-domain') {
            setAuthError(`網域未授權 (${window.location.hostname})：請前往 Firebase Console → Authentication → Settings → Authorized domains 新增此網域。`);
          } else {
            setAuthError(`登入錯誤 (${err.code})：${err.message}`);
          }
        }
      }

      const ledgerTransactions = useMemo(() => {
        if (!isDemoMode) return transactions;
        return transactions.filter((t) => t.ledger_id === activeLedgerId);
      }, [transactions, isDemoMode, activeLedgerId]);

      const periodTransactions = useMemo(() => {
        return ledgerTransactions.filter((tx) => {
          if (customDateRange.enabled) {
            if (customDateRange.start && tx.date < customDateRange.start) return false;
            if (customDateRange.end && tx.date > customDateRange.end) return false;
            return true;
          }
          return tx.date && tx.date.startsWith(selectedMonth);
        });
      }, [ledgerTransactions, selectedMonth, customDateRange]);

      const summary = useMemo(() => {
        let income = 0;
        let expense = 0;
        periodTransactions.forEach((tx) => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'income') income += amt;
          else expense += amt;
        });
        return { income, expense, balance: income - expense };
      }, [periodTransactions]);

      if (authLoading) {
        return <div className="min-h-screen flex items-center justify-center text-latte-600">載入系統資料中...</div>;
      }

      if (!user) {
        return (
          <div className="min-h-screen flex flex-col justify-between bg-latte-50 dark:bg-neutral-900 p-4 sm:p-6">
            <header className="max-w-5xl w-full mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-2xl bg-latte-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                  記
                </div>
                <div>
                  <span className="font-bold text-base text-latte-900 dark:text-white block leading-tight">暖心日常記帳本</span>
                  <span className="text-[11px] text-latte-500 dark:text-neutral-400">Personal & Couple Expense Tracker</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {!isStandalone && (
                  <button
                    type="button"
                    onClick={handleInstallApp}
                    className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-latte-600 text-white hover:bg-latte-700 transition"
                  >
                    下載 App
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => setConfigModalOpen(true)}
                  className="px-3 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-latte-700 dark:text-neutral-300 hover:bg-latte-100 dark:hover:bg-neutral-700 transition flex items-center gap-1.5"
                >
                  <span className={`w-2 h-2 rounded-full ${fbReady ? 'bg-emerald-500' : 'bg-amber-400'}`}></span>
                  {fbReady ? '雲端已連線' : '雲端連線設定'}
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const order = ['light', 'dark', 'system'];
                    setTheme(order[(order.indexOf(theme) + 1) % order.length]);
                  }}
                  className="px-2.5 py-1.5 rounded-xl text-xs bg-white dark:bg-neutral-800 border border-latte-200 dark:border-neutral-700 text-latte-600 dark:text-neutral-300"
                >
                  {theme === 'light' ? '淺色' : theme === 'dark' ? '深色' : '自動'}
                </button>
              </div>
            </header>

            <main className="max-w-md w-full mx-auto my-auto py-6">
              <div className="bg-white dark:bg-neutral-800 rounded-3xl shadow-xl p-7 sm:p-8 border border-latte-200 dark:border-neutral-700 space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-16 h-16 mx-auto rounded-2xl bg-latte-100 dark:bg-neutral-700 border border-latte-200 dark:border-neutral-600 flex items-center justify-center text-2xl font-bold text-latte-700 dark:text-latte-200 shadow-xs">
                    記
                  </div>
                  <h1 className="text-2xl font-bold text-latte-900 dark:text-white pt-1">個人與情侶共同記帳</h1>
                  <p className="text-sm text-latte-600 dark:text-neutral-400 leading-relaxed">
                    簡單直覺的日常收支管理，讓個人儲蓄與伴侶共同生活開銷都井井有條。
                  </p>
                </div>

                {authError && (
                  <div className="p-3.5 rounded-xl bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300 text-left leading-relaxed">
                    {authError}
                  </div>
                )}

                <div className="space-y-3">
                  <button
                    type="button"
                    onClick={handleGoogleLogin}
                    className="w-full py-3.5 px-5 rounded-2xl bg-latte-700 hover:bg-latte-800 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition flex items-center justify-center gap-3"
                  >
                    <span>使用 Google 帳號登入</span>
                  </button>

                  <button
                    type="button"
                    onClick={enterDemoMode}
                    className="w-full py-3 px-5 rounded-2xl bg-latte-100 hover:bg-latte-200/80 dark:bg-neutral-700 dark:hover:bg-neutral-600 text-latte-800 dark:text-neutral-100 font-semibold text-xs sm:text-sm transition flex items-center justify-center gap-2 border border-latte-200 dark:border-neutral-600"
                  >
                    <span>免登入直接進入體驗模式</span>
                  </button>
                </div>
              </div>
            </main>

            <footer className="text-center text-xs text-latte-500 dark:text-neutral-500">
              資料加密儲存於您的專屬雲端空間 • 支援手機與電腦跨裝置同步
            </footer>

            {configModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="max-w-lg w-full bg-white dark:bg-neutral-800 rounded-2xl shadow-xl p-6 border border-latte-200 dark:border-neutral-700 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-lg font-bold text-latte-900 dark:text-white">Firebase 雲端資料庫連線設定</h2>
                    <button
                      type="button"
                      onClick={() => setConfigModalOpen(false)}
                      className="p-1.5 rounded-lg text-latte-500 hover:bg-latte-100 dark:hover:bg-neutral-700"
                    >
                      ✕
                    </button>
                  </div>
                  <p className="text-xs text-latte-600 dark:text-neutral-300 leading-relaxed">
                    請前往 Firebase Console → 專案設定 → 您的應用程式，複製 <code className="bg-latte-100 dark:bg-neutral-700 px-1.5 py-0.5 rounded">firebaseConfig</code> 整段貼入下方：
                  </p>
                  <textarea
                    rows="7"
                    className="w-full p-3 text-xs font-mono rounded-xl border border-latte-300 dark:border-neutral-600 bg-latte-50 dark:bg-neutral-900 focus:outline-none focus:ring-2 focus:ring-latte-500"
                    placeholder={'const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};'}
                    value={fbConfigText}
                    onChange={(e) => setFbConfigText(e.target.value)}
                  />
                  {configError && <p className="text-xs text-red-600 font-medium">{configError}</p>}
                  <div className="flex justify-end gap-2 pt-1">
                    {fbReady && (
                      <button
                        type="button"
                        onClick={() => {
                          safeStorage.remove('fb_config');
                          window.location.reload();
                        }}
                        className="px-3.5 py-2.5 rounded-xl border border-rose-300 text-rose-600 text-xs font-medium mr-auto"
                      >
                        清除目前設定
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setConfigModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl bg-latte-100 dark:bg-neutral-700 text-latte-700 dark:text-neutral-200 text-xs font-semibold"
                    >
                      取消
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        safeStorage.set('fb_config', fbConfigText);
                        window.location.reload();
                      }}
                      className="px-5 py-2.5 rounded-xl bg-latte-600 hover:bg-latte-700 text-white text-xs font-semibold transition"
                    >
                      儲存設定並連線
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const activeLedgers = ledgers.filter((l) => !l.is_archived);
      const navItems = [
        { id: 'home', label: '首頁' },
        { id: 'stats', label: '統計' },
        { id: 'budgets', label: '預算' },
        { id: 'settings', label: '設定' },
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row pb-28 md:pb-0">
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 sm:left-auto sm:translate-x-0 sm:right-4 z-[999] px-5 py-3 rounded-2xl bg-latte-800 text-white text-sm font-semibold shadow-2xl border border-latte-600/50 pointer-events-none">
              {toastMsg}
            </div>
          )}

          <CustomModalDialog
            dialog={dialogState}
            onClose={(result) => {
              const res = dialogState?.resolve;
              setDialogState(null);
              if (res) res(result);
            }}
          />

          <aside className="hidden md:flex md:w-68 md:flex-col bg-latte-100/80 dark:bg-neutral-800/90 border-r border-latte-200/80 dark:border-neutral-700/80 p-5 justify-between shrink-0 shadow-xs">
            <div className="space-y-5">
              <div>
                <div className="text-[11px] font-medium text-latte-500 dark:text-neutral-400 mb-1.5 uppercase tracking-wider px-1">目前使用帳本</div>
                <select
                  value={activeLedgerId}
                  onChange={(e) => setActiveLedgerId(e.target.value)}
                  className="w-full p-2.5 rounded-xl bg-white dark:bg-neutral-700/80 border border-latte-200 dark:border-neutral-600 font-semibold text-sm shadow-2xs focus:outline-none focus:ring-2 focus:ring-latte-500"
                >
                  {activeLedgers.map((l) => (
                    <option key={l.id} value={l.id}>
                      {l.name} ({l.currency})
                    </option>
                  ))}
                </select>
              </div>

              <nav className="space-y-1.5 px-1">
                {navItems.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full text-left px-5 py-3.5 rounded-2xl font-semibold text-sm transition flex items-center justify-between ${
                      activeTab === item.id
                        ? 'bg-latte-600 text-white shadow-xs'
                        : 'text-latte-800 dark:text-neutral-200 hover:bg-latte-200/50 dark:hover:bg-neutral-700/60'
                    }`}
                  >
                    <span>{item.label}</span>
                    {item.id === 'settings' && invitations.length > 0 && (
                      <span className="px-2 py-0.5 text-xs rounded-full bg-red-500 text-white font-bold">{invitations.length}</span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="pt-4 border-t border-latte-200/60 dark:border-neutral-700/60 space-y-2.5 text-xs text-latte-600 dark:text-neutral-400">
              <div className="px-1 truncate font-medium">暱稱：{profile?.nickname}</div>
              <button
                onClick={() => (isDemoMode ? exitDemoMode() : firebase.auth().signOut())}
                className="w-full py-2.5 rounded-xl border border-latte-300 dark:border-neutral-600 hover:bg-latte-200/60 dark:hover:bg-neutral-700 text-center font-medium transition"
              >
                {isDemoMode ? '返回登入 / 雲端設定' : '登出帳號'}
              </button>
            </div>
          </aside>

          <header className="md:hidden sticky top-0 z-20 bg-latte-50/95 dark:bg-neutral-900/95 backdrop-blur-md border-b border-latte-200/70 dark:border-neutral-800 px-3 py-2.5 flex items-center justify-center shadow-2xs">
            <select
              value={activeLedgerId}
              onChange={(e) => setActiveLedgerId(e.target.value)}
              className="w-auto min-w-[170px] max-w-[240px] px-3 py-1.5 rounded-xl bg-white dark:bg-neutral-800 border border-latte-300/80 dark:border-neutral-700 font-semibold text-xs shadow-2xs"
            >
              {activeLedgers.length === 0 && <option value="">尚無啟用中的帳本</option>}
              {activeLedgers.map((l) => (
                <option key={l.id} value={l.id}>
                  {l.name} ({l.currency})
                </option>
              ))}
            </select>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-5">
            {!activeLedger && activeTab !== 'settings' ? (
              <div className="bg-white dark:bg-neutral-800 rounded-3xl p-8 border border-latte-200 dark:border-neutral-700 text-center space-y-3.5 shadow-xs">
                <div className="text-base font-bold text-latte-800 dark:text-latte-100">目前沒有啟用中的帳本</div>
                <p className="text-sm text-latte-600 dark:text-neutral-400">您的帳本可能已全部封存或正在建立中，請前往設定頁解除封存或建立新帳本。</p>
                <button
                  type="button"
                  onClick={() => setActiveTab('settings')}
                  className="px-5 py-2.5 rounded-xl bg-latte-600 text-white text-sm font-semibold transition"
                >
                  前往帳本設定
                </button>
              </div>
            ) : null}

            {activeTab === 'home' && activeLedger && (
              <HomeView
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                customDateRange={customDateRange}
                setCustomDateRange={setCustomDateRange}
                summary={summary}
                transactions={periodTransactions}
                categories={categories}
                onAddClick={() => {
                  if (!activeLedger) {
                    showToast('請先選擇或建立帳本');
                    return;
                  }
                  setEditingTx(null);
                  setTxModalOpen(true);
                }}
                onEditClick={(tx) => { setEditingTx(tx); setTxModalOpen(true); }}
                onDeleteClick={async (tx) => {
                  const ok = await askConfirm({
                    title: '刪除收支紀錄',
                    message: `確定要刪除「${tx.item_name || tx.sub_category}」(${currencySymbol}${Number(tx.amount).toLocaleString()}) 嗎？刪除後無法復原。`,
                    danger: true,
                    confirmText: '確認刪除',
                  });
                  if (ok) {
                    if (isDemoMode) {
                      setTransactions((prev) => prev.filter((item) => item.id !== tx.id));
                      showToast('已刪除該筆收支紀錄');
                      return;
                    }
                    try {
                      await firebase.firestore().collection('transactions').doc(tx.id).delete();
                      showToast('已刪除該筆收支紀錄');
                    } catch (err) {
                      showToast('刪除失敗：' + err.message);
                    }
                  }
                }}
              />
            )}

            {activeTab === 'stats' && activeLedger && (
              <StatsView
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                allTransactions={ledgerTransactions}
              />
            )}

            {activeTab === 'budgets' && activeLedger && (
              <BudgetView
                isDemoMode={isDemoMode}
                onDemoSaveBudget={(bKey, data) => setDemoBudgetsMap((prev) => ({ ...prev, [bKey]: data }))}
                activeLedger={activeLedger}
                currencySymbol={currencySymbol}
                selectedMonth={selectedMonth}
                setSelectedMonth={setSelectedMonth}
                categories={categories}
                transactions={ledgerTransactions.filter((t) => t.date && t.date.startsWith(selectedMonth) && t.type === 'expense')}
                budgetDoc={budgetDoc}
                showToast={showToast}
              />
            )}

            {activeTab === 'settings' && (
              <SettingsView
                isDemoMode={isDemoMode}
                onOpenConfigModal={() => {
                  exitDemoMode();
                  setConfigModalOpen(true);
                }}
                onExitDemo={exitDemoMode}
                onDemoUpdate={(action, payload) => {
                  if (action === 'nickname') {
                    setProfile((prev) => ({ ...prev, nickname: payload }));
                  } else if (action === 'ledgerName') {
                    setLedgers((prev) => prev.map((l) => (l.id === payload.id ? { ...l, name: payload.name } : l)));
                  } else if (action === 'currency') {
                    setLedgers((prev) => prev.map((l) => (l.id === payload.id ? { ...l, currency: payload.currency } : l)));
                  } else if (action === 'createCoupleLedger') {
                    setLedgers((prev) => [
                      ...prev,
                      {
                        id: payload.id,
                        name: payload.name,
                        type: 'couple',
                        owner_id: user.uid,
                        memberIds: [user.uid],
                        members: { [user.uid]: { role: 'owner', email: user.email, nickname: profile?.nickname || '我' } },
                        max_members: 5,
                        currency: 'TWD',
                        is_archived: false,
                      },
                    ]);
                  } else if (action === 'archiveLedger') {
                    setLedgers((prev) => prev.map((l) => (l.id === payload.id ? { ...l, is_archived: payload.is_archived } : l)));
                  } else if (action === 'deleteLedger') {
                    setLedgers((prev) => prev.filter((l) => l.id !== payload.id));
                    if (activeLedgerId === payload.id) setActiveLedgerId('demo_personal');
                  } else if (action === 'removeMember') {
                    setLedgers((prev) =>
                      prev.map((l) => {
                        if (l.id !== payload.ledgerId) return l;
                        const nextMembers = { ...l.members };
                        delete nextMembers[payload.targetUid];
                        return {
                          ...l,
                          memberIds: (l.memberIds || []).filter((id) => id !== payload.targetUid),
                          members: nextMembers,
                        };
                      })
                    );
                  } else if (action === 'addCategory') {
                    setCategories((prev) => [...prev, payload]);
                  } else if (action === 'editCategory') {
                    setCategories((prev) => prev.map((c) => (c.id === payload.id ? { ...c, ...payload } : c)));
                  } else if (action === 'deleteCategory') {
                    setCategories((prev) => prev.filter((c) => c.id !== payload.id));
                  } else if (action === 'reorderCategories') {
                    setCategories(payload.map((item, idx) => ({ ...item, sort_order: idx })));
                  } else if (action === 'addPaymentMethod') {
                    setPaymentMethods((prev) => [...prev, payload]);
                  } else if (action === 'togglePaymentMethod') {
                    setPaymentMethods((prev) => prev.map((pm) => (pm.id === payload.id ? { ...pm, is_active: !pm.is_active } : pm)));
                  } else if (action === 'importTransactions') {
                    setTransactions((prev) => [...payload, ...prev]);
                  } else if (action === 'restoreJsonBackup') {
                    if (payload.transactions?.length) setTransactions((prev) => [...payload.transactions, ...prev]);
                    if (payload.categories?.length) setCategories((prev) => [...prev, ...payload.categories]);
                    if (payload.paymentMethods?.length) setPaymentMethods((prev) => [...prev, ...payload.paymentMethods]);
                  }
                }}
                user={user}
                profile={profile}
                ledgers={ledgers}
                activeLedger={activeLedger}
                setActiveLedgerId={setActiveLedgerId}
                invitations={invitations}
                categories={categories}
                paymentMethods={paymentMethods}
                transactions={ledgerTransactions}
                theme={theme}
                setTheme={setTheme}
                showToast={showToast}
                askConfirm={askConfirm}
                askPrompt={askPrompt}
                deferredPrompt={deferredPrompt}
                onInstallApp={handleInstallApp}
                isStandalone={isStandalone}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-neutral-900/95 backdrop-blur-md border-t border-latte-200/80 dark:border-neutral-800 h-20 px-2 flex items-center justify-between shadow-xl">
            <button
              type="button"
              onClick={() => setActiveTab('home')}
              title="首頁"
              aria-label="首頁"
              className={`flex-1 h-full flex items-center justify-center transition touch-manipulation ${activeTab === 'home' ? 'text-latte-700 dark:text-latte-200' : 'text-neutral-400 dark:text-neutral-500 hover:text-latte-600'}`}
            >
              <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={activeTab === 'home' ? 2.4 : 1.9} strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 10.5L12 3l9 7.5" />
                <path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5" />
                <path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6" />
              </svg>
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('stats')}
              title="統計"
              aria-label="統計"
              className={`flex-1 h-full flex items-center justify-center transition touch-manipulation ${activeTab === 'stats' ? 'text-latte-700 dark:text-latte-200' : 'text-neutral-400 dark:text-neutral-500 hover:text-latte-600'}`}
            >
              <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={activeTab === 'stats' ? 2.4 : 1.9} strokeLinecap="round" strokeLinejoin="round">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
                <path d="M22 12A10 10 0 0 0 12 2v10z" />
              </svg>
            </button>

            <div className="px-2 flex items-center justify-center shrink-0">
              <button
                type="button"
                onClick={() => {
                  if (!activeLedger) {
                    showToast('請先在設定中選擇或建立帳本');
                    return;
                  }
                  setEditingTx(null);
                  setTxModalOpen(true);
                }}
                className="h-13 py-3 px-6 rounded-full bg-latte-600 hover:bg-latte-700 active:bg-latte-800 text-white font-bold text-base shadow-lg flex items-center justify-center whitespace-nowrap border-4 border-latte-50 dark:border-neutral-900 transition transform active:scale-95 touch-manipulation"
                title="記帳"
              >
                + 記帳
              </button>
            </div>

            <button
              type="button"
              onClick={() => setActiveTab('budgets')}
              title="預算"
              aria-label="預算"
              className={`flex-1 h-full flex items-center justify-center transition touch-manipulation ${activeTab === 'budgets' ? 'text-latte-700 dark:text-latte-200' : 'text-neutral-400 dark:text-neutral-500 hover:text-latte-600'}`}
            >
              <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={activeTab === 'budgets' ? 2.4 : 1.9} strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
                <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
              </svg>
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('settings')}
              title="設定"
              aria-label="設定"
              className={`flex-1 h-full flex items-center justify-center relative transition touch-manipulation ${activeTab === 'settings' ? 'text-latte-700 dark:text-latte-200' : 'text-neutral-400 dark:text-neutral-500 hover:text-latte-600'}`}
            >
              <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={activeTab === 'settings' ? 2.4 : 1.9} strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
              {invitations.length > 0 && (
                <span className="absolute top-4 right-5 w-2.5 h-2.5 rounded-full bg-red-500"></span>
              )}
            </button>
          </nav>

          {txModalOpen && activeLedger && (
            <TransactionModal
              isDemoMode={isDemoMode}
              onDemoSaveTx={(payload, editId) => {
                if (editId) {
                  setTransactions((prev) => prev.map((t) => (t.id === editId ? { ...t, ...payload } : t)));
                } else {
                  setTransactions((prev) => [{ id: `demo_tx_${Date.now()}`, ...payload }, ...prev]);
                }
              }}
              onDemoReorderCategories={(targetType, newMajorOrder, newSubList) => {
                setCategories((prev) => {
                  if (newMajorOrder) {
                    const orderMap = new Map(newMajorOrder.map((m, i) => [m, i]));
                    return [...prev].sort((a, b) => {
                      if (a.type !== targetType || b.type !== targetType) return 0;
                      return (orderMap.get(a.major) ?? 99) - (orderMap.get(b.major) ?? 99);
                    });
                  }
                  if (newSubList) {
                    const subOrderMap = new Map(newSubList.map((s, i) => [s.id, i]));
                    return [...prev].sort((a, b) => {
                      const ai = subOrderMap.get(a.id);
                      const bi = subOrderMap.get(b.id);
                      if (ai !== undefined && bi !== undefined) return ai - bi;
                      return 0;
                    });
                  }
                  return prev;
                });
              }}
              user={user}
              profile={profile}
              activeLedger={activeLedger}
              currencySymbol={currencySymbol}
              categories={categories}
              paymentMethods={paymentMethods}
              editingTx={editingTx}
              showToast={showToast}
              onClose={() => { setTxModalOpen(false); setEditingTx(null); }}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
